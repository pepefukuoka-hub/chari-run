    else if (P.slope < -0.05) target *= 1 + Math.min(0.2, -P.slope * 0.4);
    const want = Math.atan2(inp.ax, inp.az);
    const diff = angDiff(P.yaw, want);
    if (Math.abs(diff) > 2.3 && P.speed > 5.5 && !P.crouching) {
      // 急な切り返し：ブレーキ（スキッド）
      P.skidT = 0.32; P.skidYaw = want;
      Sound.play('skid');
      Fx.dust(P.x, P.y, P.z, 3);
    } else {
      // 速いほど曲がりにくいが、止まっているときはすぐ向く
      const turn = PL.TURN * dt * (P.speed > 7 ? 0.75 : P.speed < 1.5 ? 2 : 1);
      P.yaw += clamp(diff, -turn, turn);
      // 大きく曲がっている間は少しだけ減速（曲がりやすく）
      if (Math.abs(diff) > 1.2 && P.speed > 4) target = Math.min(target, P.speed - 4 * dt);
      // 動き出しはすぐに歩きの速さへ
      if (P.speed < PL.WALK * 0.5 * inp.m && target > P.speed) P.speed = Math.max(P.speed, Math.min(target, PL.WALK * 0.5 * inp.m));
      P.speed = approach(P.speed, target, (target > P.speed ? PL.ACC : PL.DEC) * dt);
    }
  } else {
    P.speed = approach(P.speed, 0, PL.DEC * dt);
  }
  setVelFromYaw();
}

// 氷の上：勢い（速度ベクトル）が残り、ゆっくりしか変わらない
function groundIce(dt) {
  let tx = 0, tz = 0;
  if (inp.m > 0) {
    const sp = lerp(PL.WALK * 0.5, PL.RUN * 1.1, smooth(inp.m));
    tx = inp.ax * sp; tz = inp.az * sp;
    const want = Math.atan2(inp.ax, inp.az);
    P.yaw += clamp(angDiff(P.yaw, want), -PL.TURN * 0.6 * dt, PL.TURN * 0.6 * dt);
  }
  const k = (inp.m > 0 ? PL.ICE_ACC : PL.ICE_DEC) * dt;
  const dx = tx - P.vx, dz = tz - P.vz, d = Math.hypot(dx, dz);
  if (d > k) { P.vx += (dx / d) * k; P.vz += (dz / d) * k; } else { P.vx = tx; P.vz = tz; }
  // speed は「向き方向の速さ」としておく（見た目・ジャンプ用）
  const v = Math.hypot(P.vx, P.vz);
  P.speed = v * Math.max(0, Math.cos(angDiff(P.yaw, Math.atan2(P.vx, P.vz))));
  if (v > 4 && Math.abs(angDiff(P.yaw, Math.atan2(P.vx, P.vz))) > 1 && Math.random() < dt * 15) Fx.skid(P.x, P.y, P.z);
}

// 地上（またはコヨーテ時間中）のジャンプ。技の分かれ道
function groundJump() {
  const ice = P.groundS && P.groundS.kind === 'ice';
  if (ice) {
    // 氷の上では、すべっている向きに跳ぶ
    const v = Math.hypot(P.vx, P.vz);
    if (v > 1) { P.yaw = Math.atan2(P.vx, P.vz); P.speed = v; }
  }
  P.sideFlip = false; P.dive = false;
  if (P.skidT > 0) {
    // くるりんジャンプ（切り返しの途中で跳ぶと、くるっと向きを変えて高く跳ぶ）
    P.yaw = P.skidYaw;
    P.speed = 3.5;
    setVelFromYaw();
    doJump(PL.SIDE_V, 'flip');
    P.flip = 0.001; P.flipDir = -1; P.sideFlip = true;
    P.jumpN = 0;
    Fx.burst(P.x, P.y + 0.3, P.z, [1, 1, 1], 8, 4);
  } else if (P.poundT > 0) {
    // ヒップドロップ着地のすぐ後のジャンプ：高く跳ねる
    P.speed = Math.min(P.speed, 2);
    setVelFromYaw();
    doJump(PL.POUNDJUMP_V, 'jump3');
    P.flip = 0.001; P.flipDir = 1;
    P.jumpN = 0;
  } else if (P.crouching && P.speed > 4.5) {
    // 幅とび
    P.speed = Math.max(P.speed, 8) * PL.LONG_MUL;
    setVelFromYaw();
    doJump(PL.LONG_V, 'longjump');
    P.longJump = true;
    P.jumpN = 0;
  } else if (P.crouching) {
    // バク宙
    P.speed = -4;
    setVelFromYaw();
    doJump(PL.BACK_V, 'flip');
    P.flip = 0.001; P.flipDir = -1;
    P.jumpN = 0;
  } else {
    const chain = P.landT < PL.CHAIN_WIN && P.speed > 3 && P.jumpN > 0 && P.jumpN < 3;
    P.jumpN = chain ? P.jumpN + 1 : 1;
    if (P.jumpN === 3 && P.speed < 6) P.jumpN = 1;
    const vy = [0, PL.J1, PL.J2, PL.J3][P.jumpN] + Math.max(0, P.speed) * 0.12;
    doJump(vy, ['', 'jump', 'jump2', 'jump3'][P.jumpN]);
    if (P.jumpN === 3) { P.flip = 0.001; P.flipDir = 1; }
  }
}

// 空中での操作
function airControl(dt) {
  // コヨーテジャンプ（崖から出た直後）
  if (P.jumpBuf > 0 && P.coyote > 0) {
    P.state = 'ground'; P.landT = 1; P.crouching = false;
    groundJump();
    return;
  }
  if (inp.m > 0 && !P.longJump && !P.dive) {
    const fwd = Math.sin(P.yaw) * inp.ax + Math.cos(P.yaw) * inp.az;
    const side = Math.cos(P.yaw) * inp.ax - Math.sin(P.yaw) * inp.az;
    P.speed = approach(P.speed, PL.RUN * Math.max(0.35, fwd) * inp.m, PL.AIR_ACC * dt * (fwd < 0 ? 1.6 : 1));
    P.yaw += side * dt * 2.4 * (P.flip ? 0.3 : 1);
  } else if (inp.m > 0) {
    const side = Math.cos(P.yaw) * inp.ax - Math.sin(P.yaw) * inp.az;
    P.yaw += side * dt * 1.2;
  }
  setVelFromYaw();

  // 壁にくっついて落ちるときは少しゆっくり（壁キックしやすく）
  if (P.wall && P.wallT < 0.05 && P.vy < 0 && inp.m > 0) {
    const into = -(inp.ax * P.wall.nx + inp.az * P.wall.nz);
    if (into > 0.3) {
      P.wallSlide = true;
      if (Math.random() < 0.3) Fx.skid(P.x - P.wall.nx * 0.4, P.y + 0.6, P.z - P.wall.nz * 0.4);
    }
  }

  if (P.wall && P.wallT < PL.WALL_WIN && P.jumpBuf > 0 && P.airT > 0.04) {
    // 壁キック
    const w = P.wall;
    P.yaw = Math.atan2(w.nx, w.nz);
    P.speed = PL.WALLKICK_H;
    setVelFromYaw();
    doJump(PL.WALLKICK_V, 'wall');
    P.jumpN = 0; P.longJump = false; P.dive = false; P.flip = 0; P.sideFlip = false;
    P.squash = 0.8;
    Fx.burst(P.x - w.nx * 0.4, P.y + 0.9, P.z - w.nz * 0.4, [1, 1, 1], 8, 3);
    P.wall = null;
    Game.shake = Math.max(Game.shake, 0.06);
  } else if (Input.crouchP && P.airT > 0.04) {
    // ヒップドロップ
    P.state = 'pound'; P.stateT = 0;
    P.vx = P.vz = 0; P.speed = 0; P.vy = 0; P.flip = 0;
    P.longJump = false; P.dive = false; P.sideFlip = false;
    Sound.play('poundSpin');
  } else if (P.attackBuf > 0 && P.airT > 0.05 && !P.longJump && !P.dive) {
    P.attackBuf = 0;
    if (P.speed > 6.5 && !P.flip) {
      // ダイブ（前へ飛びこむ）
      P.dive = true; P.longJump = true;
      P.speed = Math.min(Math.max(P.speed + 3, 11), 13);
      P.vy = Math.max(P.vy, 5);
      P.kickT = 0.35; P.punchHit = false;
      setVelFromYaw();
      Sound.play('longjump');
    } else {
      // 空中キック（少し浮く）
      P.vy = Math.max(P.vy, 4);
      P.punchHit = false;
      P.kickT = 0.3;
      Sound.play('kick');
    }
  }
}

function moveAndCollide(dt) {
  const prevY = P.y;
  const steps = 3;
  const h = dt / steps;
  let wall = null;
  for (let i = 0; i < steps; i++) {
    P.x += P.vx * h;
    P.z += P.vz * h;
    const w = pushOutXZ(P);
    if (w) wall = w;
  }
  // 壁に当たったら速度を壁沿いに
  if (wall) {
    const vn = P.vx * wall.nx + P.vz * wall.nz;
    if (vn < 0) {
      if (P.state === 'ground' && P.speed > 6 && vn < -6 && Math.abs(vn) > P.speed * 0.85) {
        // 走って壁に正面衝突：はね返る
        P.speed = -3; Sound.play('land', 0.8); Game.shake = 0.12; P.skidT = 0;
      }
      P.vx -= vn * wall.nx; P.vz -= vn * wall.nz;
      if (P.state !== 'ground') {
        const along = Math.hypot(P.vx, P.vz);
        if (P.state === 'air') P.speed = Math.min(P.speed, along + 1);
        if (P.dive) { P.dive = false; P.longJump = false; P.speed = -2; P.vy = Math.min(P.vy, 2); }
      }
    }
    if (!P.grounded && P.state === 'air' && P.vy < 6) { P.wall = wall; P.wallT = 0; }
  }
  if (P.wall) { P.wallT += dt; if (P.wallT > PL.WALL_WIN) P.wall = null; }

  // 縦方向
  if (P.grounded) {
    const g = groundBelow(P.x, P.z, P.y + STEP_H, P.r * 0.5);
    if (g && P.y - g.y <= 0.5 && P.vy <= 0) {
      P.y = g.y; P.groundS = g.s; P.vy = 0;
    } else {
      // 足場から出た：コヨーテ時間のはじまり
      P.grounded = false; P.groundS = null;
      if (P.state === 'ground' || P.state === 'punch') {
        P.coyote = P.skidT > 0 || P.slideT > 0 ? 0.05 : PL.COYOTE;
        P.state = 'air'; P.airT = 0; P.jumpHeld = false;
        P.skidT = 0; P.slideT = 0; P.punchN = 0;
        P.fallFrom = P.y;
        if (P.speed < 0) P.speed *= 0.5;
      }
      P.vy = Math.min(P.vy, 0);
    }
  } else {
    const ny = P.y + P.vy * dt;
    if (P.vy > 0) {
      const c = ceilingAbove(P.x, P.z, P.y + P.h, ny + P.h, P.r * 0.3);
      if (c !== null) { P.y = c - P.h; P.vy = -1; Sound.play('land', 0.5); }
      else P.y = ny;
    } else {
      const g = groundBelow(P.x, P.z, prevY + 0.05, P.r * 0.5);
      if (g && ny <= g.y) { P.y = g.y; landOn(g.s); }
      else P.y = ny;
    }
  }
}

function landOn(s) {
  const fallV = P.vy;
  const drop = P.fallFrom - P.y;
  P.grounded = true; P.groundS = s; P.vy = 0;
  P.landT = 0; P.flip = 0; P.wall = null; P.coyote = 0;
  P.sideFlip = false;
  P.squash = clamp(1 + fallV * 0.012, 0.6, 0.85);
  P.fallFrom = P.y;
  if (s.kind === 'spring') {
    P.state = 'air'; P.grounded = false; P.groundS = null;
    P.vy = 27; P.airT = 0; P.jumpHeld = true; P.flip = 0.001; P.flipDir = 1;
    P.longJump = false; P.dive = false;
    s.boing = 1;
    Sound.play('spring');
    return;
  }
  if (s.kind === 'lava') {
    playerHurt(P.x + Math.sin(P.yaw), P.z + Math.cos(P.yaw));
    P.vy = 16; P.grounded = false; P.groundS = null; P.state = 'hurt';
    return;
  }
  if (P.state === 'pound') {
    Sound.play('pound');
    Game.shake = 0.3;
    Fx.ring(P.x, P.y + 0.05, P.z);
    Fx.dust(P.x, P.y, P.z, 14);
    Game.onPound(P.x, P.y, P.z);
    P.state = 'ground'; P.speed = 0; P.landT = 1;
    P.stateT = 0;
    P.poundT = 0.28; // この間にジャンプすると高く跳ねる
    P.squash = 0.55;
    return;
  }
  if (P.dive) {
    // ダイブの着地：おなかですべる
    P.dive = false; P.longJump = false;
    P.slideT = 0.4; P.speed = Math.min(P.speed, 10);
    Sound.play('land', 0.8);
    Fx.dust(P.x, P.y, P.z, 6);
  }
  if (P.longJump) { P.speed *= 0.45; P.longJump = false; }
  if (P.state === 'hurt') { P.speed = 0; P.vx = P.vz = 0; }
  if (fallV < -8) {
    Sound.play('land', clamp(-fallV / 30, 0.35, 1));
    Fx.dust(P.x, P.y, P.z, fallV < -22 ? 9 : 5);
  }
  if (fallV < -30 || drop > 9) { Game.shake = Math.max(Game.shake, 0.15); P.squash = 0.6; }
  P.state = 'ground';
  P.speed = Math.max(0, P.speed);
  P.skidT = 0;
}

// ===== 55_camera.js =====
// カメラ（主人公の後ろを追いかける。ドラッグ・Q/E・右スティックで回せる）
// 考え方：
//  ・ふだんは「ひもでつながったカメラ」：前の位置から主人公へ引っぱられるだけなので、
//    横に走ると自然に回り、手前に走っても勝手にぐるっと回らない
//  ・しばらく手で回していないときだけ、走っている向きの後ろへ「ゆっくり」寄せる
//  ・上下は「最後に立っていた高さ」を基準にして、ジャンプのたびに揺れない
//  ・壁や塔の中に入らないよう、5本の線で調べて手前に寄る
const Cam = {
  yaw: Math.PI, pitch: 0.38, dist: 10.5,
  zoomLv: 1, dists: [6.5, 10.5, 15],
  tx: 0, ty: 0, tz: 0,
  eye: [0, 5, 10],
  target: [0, 0, 0],
  manualT: 9,
  fov: 0.95,
  shown: 10.5,
  override: null,  // 演出用 {eye, target}
  baseY: 0,        // 上下の基準（最後に立っていた高さ）
  lastWant: 0, vWantS: 0,
  vy: 0,           // 注視点の上下の速さ（ばね）
  resetT: 0,       // 後ろへ回り込み中
  pitchAuto: 0.36,
  aheadX: 0, aheadZ: 0,
  distS: 10.5,
};
const camWant = [0, 0, 0];
const camTmpA = [0, 0, 0], camTmpB = [0, 0, 0];

function camReset() {
  Cam.yaw = P.yaw + Math.PI;
  Cam.tx = P.x; Cam.ty = P.y + 1.2; Cam.tz = P.z;
  Cam.baseY = P.y; Cam.vy = 0; Cam.lastWant = P.y + 1.2; Cam.vWantS = 0;
  Cam.pitch = 0.36;
  Cam.dist = Cam.distS = Cam.dists[Cam.zoomLv];
  Cam.shown = Cam.dist;
  Cam.manualT = 9;
  Cam.aheadX = Cam.aheadZ = 0;
  Cam.override = null;
}

// 線分 a→b とワールドの交差（カメラ用）。円柱はきちんと丸で、細い柱・飾りは無視する
function camRay(ax, ay, az, bx, by, bz) {
  let tMin = 1;
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const sol = World.solids;
  for (let i = 0; i < sol.length; i++) {
    const s = sol[i];
    if (s.noCam) continue;
    if (s.type === 'cyl') {
      if (s.r < 0.8) continue; // 木の幹などは無視（見えなくなっても一瞬）
      // XZ 平面で円と交差
      const ox = ax - s.x, oz = az - s.z;
      const A = dx * dx + dz * dz;
      const C = ox * ox + oz * oz - s.r * s.r;
      let t0;
      if (C <= 0) t0 = 0; // 始点が円の中（主人公が円柱の上にいるときなど）
      else {
        if (A < 1e-9) continue;
        const B = ox * dx + oz * dz;
        const disc = B * B - A * C;
        if (disc < 0) continue;
        t0 = (-B - Math.sqrt(disc)) / A;
        if (t0 < 0 || t0 >= tMin) continue;
      }
      // その点の高さが円柱の高さの範囲内か（上面を少し下げて、乗っているときに引っかからない）
      const y = ay + dy * t0;
      if (y < s.y0 || y > s.y1 - 0.05) {
        // 上面・下面から入る場合
        const yc = dy > 0 ? s.y0 : s.y1 - 0.05;
        if (Math.abs(dy) < 1e-9) continue;
        const tc = (yc - ay) / dy;
        if (tc <= 0 || tc >= tMin) continue;
        const px = ax + dx * tc - s.x, pz = az + dz * tc - s.z;
        if (px * px + pz * pz > s.r * s.r) continue;
        if (C <= 0 && tc < 0.02) continue;
        tMin = tc;
        continue;
      }
      if (t0 > 0.001) tMin = t0;
      continue;
    }
    // 箱（坂は上面の真ん中の高さまで）
    const x0 = s.x0, x1 = s.x1, z0 = s.z0, z1 = s.z1, y0 = s.y0;
    const y1 = s.ramp ? (s.y0 + s.y1) * 0.5 : s.y1 - 0.05;
    if (x1 - x0 < 0.5 && z1 - z0 < 0.5) continue;
    let t0 = 0, t1 = tMin;
    // x
    if (Math.abs(dx) < 1e-9) { if (ax < x0 || ax > x1) continue; }
    else {
      let ta = (x0 - ax) / dx, tb = (x1 - ax) / dx;
      if (ta > tb) { const q = ta; ta = tb; tb = q; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) continue;
    }
    if (Math.abs(dy) < 1e-9) { if (ay < y0 || ay > y1) continue; }
    else {
      let ta = (y0 - ay) / dy, tb = (y1 - ay) / dy;
      if (ta > tb) { const q = ta; ta = tb; tb = q; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) continue;
    }
    if (Math.abs(dz) < 1e-9) { if (az < z0 || az > z1) continue; }
    else {
      let ta = (z0 - az) / dz, tb = (z1 - az) / dz;
      if (ta > tb) { const q = ta; ta = tb; tb = q; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) continue;
    }
    if (t0 > 0.001 && t0 < tMin) tMin = t0;
  }
  return tMin;
}

function updateCamera(dt) {
  // ---- 遠近 ----
  if (Input.zoomP) { Cam.zoomLv = (Cam.zoomLv + 1) % 3; Sound.play('cursor'); }
  if (Input.zoomStep) { Cam.zoomLv = clamp(Cam.zoomLv + Input.zoomStep, 0, 2); }
  Cam.dist = Cam.dists[Cam.zoomLv];
  Cam.distS = lerp(Cam.distS, Cam.dist, 1 - Math.exp(-dt * 6));

  // ---- 手動操作 ----
  const W = window.innerWidth, H = window.innerHeight;
  // タッチは画面の大きさに合わせる（横いっぱいなぞると約 1 周弱）
  const sens = Input.touchMode ? 6.5 / Math.max(W, H, 320) : 0.0055;
  let manual = false;
  if (Input.camDX || Input.camDY) {
    Cam.yaw -= Input.camDX * sens;
    Cam.pitch += Input.camDY * sens * 0.75;
    manual = true;
  }
  if (Input.camKey) { Cam.yaw -= Input.camKey * dt * 2.6; manual = true; }
  if (Input.camRX || Input.camRY) {
    Cam.yaw -= Input.camRX * Math.abs(Input.camRX) * dt * 3.4;
    Cam.pitch += Input.camRY * dt * 1.6;
    manual = true;
  }
  Cam.pitch = clamp(Cam.pitch, -0.12, 1.25);
  if (manual) { Cam.manualT = 0; Cam.resetT = 0; } else Cam.manualT += dt;

  if (Input.camResetP) { Cam.resetT = 0.6; Sound.play('cursor'); }

  // ---- 注視点（左右） ----
  const sp = Math.hypot(P.vx, P.vz);
  // 進む方向を少し先まで見せる
  const ahead = P.state === 'dead' ? 0 : clamp(sp / PL.RUN, 0, 1.3) * 1.1;
  const ax = sp > 0.1 ? (P.vx / sp) * ahead : 0, az = sp > 0.1 ? (P.vz / sp) * ahead : 0;
  Cam.aheadX = lerp(Cam.aheadX, ax, 1 - Math.exp(-dt * 2.5));
  Cam.aheadZ = lerp(Cam.aheadZ, az, 1 - Math.exp(-dt * 2.5));
  const oldTx = Cam.tx, oldTz = Cam.tz;
  Cam.tx = lerp(Cam.tx, P.x + Cam.aheadX, 1 - Math.exp(-dt * 9));
  Cam.tz = lerp(Cam.tz, P.z + Cam.aheadZ, 1 - Math.exp(-dt * 9));

  // ---- 注視点（上下）：立った高さを基準に、ばねでなめらかに ----
  if (P.grounded || P.state === 'dead') Cam.baseY = P.y;
  else if (P.y < Cam.baseY) Cam.baseY = P.y;                   // 下へ落ちるときはついていく
  else if (P.y > Cam.baseY + 3.2) Cam.baseY = P.y - 3.2;       // ばね・壁キックで高く上がるとき
  if (P.state === 'dead') Cam.baseY = Math.max(P.y, World.killY + 6);
  const tyWant = Cam.baseY + 1.2;
  // 目標の動く速さ（落下中などは追いかけ遅れが出ないように足す。段差で一気に変わったときは使わない）
  let vWant = (tyWant - Cam.lastWant) / Math.max(dt, 1e-4);
  if (Math.abs(tyWant - Cam.lastWant) > 0.3) vWant = 0;
  Cam.lastWant = tyWant;
  Cam.vWantS = lerp(Cam.vWantS, vWant, 1 - Math.exp(-dt * 8));
  // 臨界減衰ばね（行きすぎず、急に止まらない）。主人公が画面の端に近いほど固く
  const off = Math.abs(P.y + 1.2 - Cam.ty);
  const w = 5 + clamp((off - 2) / 2, 0, 1) * 3;
  const acc = w * w * (tyWant - Cam.ty) + 2 * w * (Cam.vWantS - Cam.vy);
  Cam.vy += acc * dt;
  Cam.ty += Cam.vy * dt;

  // ---- 向き：ひもでつながったカメラ ----
  if (!manual && Cam.resetT <= 0 && P.state !== 'dead') {
    // 前のフレームのカメラ位置から、動いた注視点を見たときの角度
    const ex = oldTx + Math.sin(Cam.yaw) * Cam.distS, ez = oldTz + Math.cos(Cam.yaw) * Cam.distS;
    const lx = ex - Cam.tx, lz = ez - Cam.tz;
    if (lx * lx + lz * lz > 0.01) Cam.yaw += angDiff(Cam.yaw, Math.atan2(lx, lz));
  }
  // ---- 手で動かしていない間だけ、ゆっくり後ろへ寄せる ----
  if (Cam.resetT > 0) {
    Cam.resetT -= dt;
    Cam.yaw += angDiff(Cam.yaw, P.yaw + Math.PI) * (1 - Math.exp(-dt * 10));
    Cam.pitch = lerp(Cam.pitch, 0.36, 1 - Math.exp(-dt * 8));
  } else if (Cam.manualT > 1.6 && P.state !== 'dead') {
    const d = angDiff(Cam.yaw, P.yaw + Math.PI);
    // 手前（カメラの方）へ走るときは回さない。横〜奥へ走っているときだけ
    if (P.grounded && sp > 4 && Math.abs(d) < 2.0) {
      Cam.yaw += d * clamp(sp / PL.RUN, 0, 1) * dt * 0.7;
    }
    // 上下の角度：高い所から下を見るときは少し見下ろす
    let pw = 0.36;
    if (!P.grounded && P.vy < -10) pw = 0.55;
    Cam.pitchAuto = lerp(Cam.pitchAuto, pw, 1 - Math.exp(-dt * 1.5));
    if (Cam.manualT > 3) Cam.pitch = lerp(Cam.pitch, Cam.pitchAuto, 1 - Math.exp(-dt * 0.8));
  }

  // ---- めり込み防止 ----
  const cp = Math.cos(Cam.pitch), spi = Math.sin(Cam.pitch);
  const dist = Cam.distS;
  const ox = Math.sin(Cam.yaw) * cp, oy = spi, oz = Math.cos(Cam.yaw) * cp;
  camWant[0] = Cam.tx + ox * dist; camWant[1] = Cam.ty + oy * dist; camWant[2] = Cam.tz + oz * dist;
  // 中心と、横・上下にずらした 4 本（画面の端が壁に入らないように）
  const rx = Math.cos(Cam.yaw) * 0.35, rz = -Math.sin(Cam.yaw) * 0.35;
  let t = camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0], camWant[1], camWant[2]);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0] + rx, camWant[1], camWant[2] + rz) + 0.04);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0] - rx, camWant[1], camWant[2] - rz) + 0.04);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0], camWant[1] + 0.3, camWant[2]) + 0.04);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0], camWant[1] - 0.3, camWant[2]) + 0.04);
  const dWant = Math.max(0.4, dist * clamp(t, 0, 1) - 0.3);
  // さえぎられたらすぐ手前へ（壁の中を映さない）、離れるときはゆっくり
  Cam.shown = dWant < Cam.shown ? dWant : lerp(Cam.shown, dWant, 1 - Math.exp(-dt * 2.5));
  const eye = camTmpA;
  eye[0] = Cam.tx + ox * Cam.shown;
  eye[1] = Cam.ty + oy * Cam.shown;
  eye[2] = Cam.tz + oz * Cam.shown;
  // 地面の下に入らない
  const g = groundBelow(eye[0], eye[2], eye[1] + 0.6, 0.1);
  if (g && eye[1] < g.y + 0.4) eye[1] = g.y + 0.4;

  const tgt = camTmpB;
  tgt[0] = Cam.tx; tgt[1] = Cam.ty; tgt[2] = Cam.tz;
  if (Cam.override) {
    eye[0] = Cam.override.eye[0]; eye[1] = Cam.override.eye[1]; eye[2] = Cam.override.eye[2];
    tgt[0] = Cam.override.target[0]; tgt[1] = Cam.override.target[1]; tgt[2] = Cam.override.target[2];
  }
  if (Game.shake > 0) {
    const s = Math.min(Game.shake, 0.4) * 0.5;
    eye[0] += (Math.random() - 0.5) * s; eye[1] += (Math.random() - 0.5) * s; eye[2] += (Math.random() - 0.5) * s;
  }
  // 描画側に渡す（中身だけ書きかえる）
  Cam.eye[0] = eye[0]; Cam.eye[1] = eye[1]; Cam.eye[2] = eye[2];
  Cam.target[0] = tgt[0]; Cam.target[1] = tgt[1]; Cam.target[2] = tgt[2];
}

// モデル（主人公・アイテム・敵・飾り）と、それを描く関数
// 色はシェーダーで線形化→トーンマップされるので、少し落ち着いた色で決めている
const COL = {

  foot: hex(0xd8752a), hand: hex(0xfff1d6), mouth: hex(0x7a2a2a), tongue: hex(0xff7d8a),
  grass: hex(0x86cf62), grassDk: hex(0x5fab4b), dirt: hex(0xbd8a5e), dirtDk: hex(0x8c6446),
  stone: hex(0xc4bfcc), stoneDk: hex(0x928ca3), wood: hex(0xc99059), woodDk: hex(0x97663f),
  ice: hex(0xc4ecff), lava: hex(0xff6a2a),
  acorn: hex(0xc98a3e), acornDk: hex(0x9a6129), acornCap: hex(0x7a5230), acornCapLt: hex(0x9b7048),

};

const Models = {};

// 球面上にほぼ均等に点を並べる（フィボナッチ球）
function fibPoints(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - (2 * (i + 0.5)) / n, r = Math.sqrt(1 - y * y), ph = i * 2.39996;
    out.push([Math.cos(ph) * r, y, Math.sin(ph) * r]);
  }
  return out;
}
// 向き dir に y 軸を合わせる行列（位置 p）
function alignY(p, dir, sx, sy, sz) {
  const y = v3.norm(dir);
  const a = Math.abs(y[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const x = v3.norm(v3.cross(a, y));
  const z = v3.cross(x, y);
  const m = new Float32Array(16);
  m[0] = x[0] * sx; m[1] = x[1] * sx; m[2] = x[2] * sx;
  m[4] = y[0] * sy; m[5] = y[1] * sy; m[6] = y[2] * sy;
  m[8] = z[0] * sz; m[9] = z[1] * sz; m[10] = z[2] * sz;
  m[12] = p[0]; m[13] = p[1]; m[14] = p[2]; m[15] = 1;
  return m;
}

function buildModels() {
  // ================= ころん（足元が原点、前が +z）=================
  {
    const g = new Geo();
    // 頭と体がひとつになった、おもちのような丸い体
    const head = (p) => {
      if (p[1] > 0.55) return mixc(COL.body, COL.bodyLt, (p[1] - 0.55) * 1.6);
      return mixc(COL.bodyDk, COL.body, clamp(p[1] * 0.7 + 0.75, 0, 1));
    };
    g.sphere(T(0, 0.7, 0, 0.6, 0.6, 0.56), head, 28, 18);
    // 下側のふくらみ（おなかは白っぽい）
    const lower = (p) => {
      const base = mixc(COL.bodyDk, COL.body, clamp(p[1] * 0.5 + 0.6, 0, 1));
      const k = smooth(clamp((p[2] - 0.25) / 0.3, 0, 1)) * smooth(clamp((0.85 - Math.abs(p[1] + 0.05)) / 0.25, 0, 1));
      return mixc(base, COL.belly, k);
    };
    g.sphere(T(0, 0.42, 0, 0.57, 0.4, 0.53), lower, 26, 14);
    // 口のまわり（ふっくらした白いマズル）
    g.sphere(T(0, 0.66, 0.44, 0.22, 0.14, 0.12), COL.belly, 16, 10);
    // 鼻
    g.sphere(T(0, 0.725, 0.555, 0.05, 0.035, 0.035), COL.eye, 10, 6);
    g.sphere(T(-0.015, 0.735, 0.585, 0.014, 0.01, 0.006), COL.white, 5, 3);
    // ほっぺ
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.35, 0.7, 0.425, 0.095, 0.058, 0.035, sx * 0.72), COL.cheek, 12, 6);
    // マフラー（しま模様）
    const stripe = (p) => {
      const u = Math.atan2(p[2], p[0]);
      return Math.floor((u / Math.PI) * 5 + 10) % 2 ? COL.scarf : mixc(COL.scarf, COL.scarfLt, 0.75);
    };
    g.torus(T(0, 0.5, 0, 1, 1, 0.97, 0, -0.06), stripe, 0.565, 0.1, 30, 10);
    // 結び目（背中側）
    g.sphere(T(0.2, 0.49, -0.56, 0.11, 0.1, 0.09, 0.4), COL.scarf, 10, 8);
    // 頭のてっぺんのくるんとした毛
    g.arc(T(0, 1.36, 0.02, 1, 1, 1, Math.PI / 2), COL.bodyLt, 0.075, 0.026, -0.9, Math.PI * 0.95, 10, 6);
    Models.body = g.mesh();
  }
  // 目（1つぶん）：黒目に大小2つのハイライト
  Models.eye = new Geo()
    .sphere(T(0, 0, 0, 0.088, 0.13, 0.052), (p) => mixc(COL.eye, COL.eyeLo, clamp(-p[1] * 1.4 - 0.2, 0, 1)), 14, 10)
    .sphere(T(0.026, 0.05, 0.042, 0.034, 0.038, 0.02), COL.white, 8, 6)
    .sphere(T(-0.028, -0.045, 0.045, 0.016, 0.016, 0.01), COL.white, 6, 4)
    .mesh();
  // にっこり目（^）と、ぎゅっと目
  Models.eyeHappy = new Geo().arc(T(0, -0.03, 0), COL.eye, 0.065, 0.019, 0.15, Math.PI - 0.15, 10, 5).mesh();
  // ぎゅっと目（> の形。左目は 180° 回して < にする）
  {
    const g = new Geo();
    const p0 = [-0.045, 0.045, 0], p1 = [0.04, 0, 0], p2 = [-0.045, -0.045, 0];
    for (const [a, c] of [[p0, p1], [p2, p1]]) {
      const d = v3.sub(c, a);
      g.cyl(alignY(a, d, 0.019, v3.len(d), 0.019), COL.eye, 6);
      g.sphere(T(a[0], a[1], a[2], 0.019, 0.019, 0.019), COL.eye, 6, 4);
    }
    g.sphere(T(p1[0], p1[1], p1[2], 0.02, 0.02, 0.02), COL.eye, 6, 4);
    Models.eyeX = g.mesh();
  }
  // 口（ω の形）と、開いた口
  {
    const g = new Geo();
    for (const sx of [-1, 1]) g.arc(T(sx * 0.034, 0, 0), COL.eye, 0.034, 0.011, Math.PI + 0.15, TAU - 0.1, 8, 5);
    Models.mouth = g.mesh();
    const o = new Geo();
    o.sphere(T(0, 0, 0, 0.065, 0.055, 0.03), COL.mouth, 12, 8);
    o.sphere(T(0, -0.025, 0.012, 0.04, 0.022, 0.02), COL.tongue, 10, 6);
    Models.mouthOpen = o.mesh();
  }
  // 耳（根もとが原点）
  Models.ear = new Geo()
    .sphere(T(0, 0.13, 0, 0.17, 0.165, 0.08), (p) => mixc(COL.body, COL.bodyLt, p[1] * 0.5 + 0.3), 14, 10)
    .sphere(T(0, 0.13, 0.04, 0.1, 0.1, 0.05), COL.cheek, 12, 8)
    .mesh();
  // しっぽ（ふわふわの丸）
  Models.tail = new Geo().sphere(T(0, 0, 0, 0.15, 0.14, 0.14), (p) => mixc(COL.body, COL.belly, p[2] * -0.5 + 0.5), 12, 8).mesh();
  // 足（底はクリーム色）、手
  Models.foot = new Geo().sphere(T(0, 0.085, 0.05, 0.155, 0.1, 0.205), (p, n) => (n[1] < -0.55 ? COL.belly : mixc(COL.foot, COL.body, p[1] * 0.5 + 0.5)), 14, 8).mesh();
  Models.hand = new Geo().sphere(T(0, 0, 0, 0.12, 0.12, 0.12), (p) => (p[1] < -0.35 || p[2] > 0.55 ? COL.belly : COL.body), 12, 8).mesh();
  // マフラーのしっぽ（上端が原点、下へ垂れる。先はしま）
  Models.scarfTail = new Geo()
    .cyl(T(0, -0.3, 0, 0.08, 0.3, 0.028), (p) => (p[1] < 0.18 ? COL.scarfLt : COL.scarf), 10)
    .mesh();

  // ================= どんぐり =================
  {
    const g = new Geo();
    const nut = (p) => mixc(COL.acornDk, COL.acorn, clamp(p[1] * 0.6 + 0.6, 0, 1));
    g.sphere(T(0, -0.02, 0, 0.26, 0.31, 0.26), nut, 16, 12);
    g.cyl(T(0, -0.36, 0, 0.06, 0.08, 0.06), COL.acornDk, 6, { top: 0.2, bottom: 1 }); // とがった先
    // 帽子（あみ目もよう）
    const cap = (p, n) => {
      const u = Math.atan2(p[2], p[0]);
      const k = (Math.floor(u * 2.6 + p[1] * 6) + Math.floor(u * 2.6 - p[1] * 6)) % 2 === 0;
      return n[1] < -0.2 ? shade(COL.acornCap, 0.75) : k ? COL.acornCapLt : COL.acornCap;
    };
    g.sphere(T(0, 0.15, 0, 0.3, 0.17, 0.3), cap, 16, 8, { flat: true });
    g.cyl(T(0, 0.28, 0, 0.035, 0.13, 0.035, 0, 0, 0.25), COL.acornCap, 6);
    Models.acorn = g.mesh();
  }
  // ================= ひかりの種（芽の出た光る結晶）=================
  {
    const g = new Geo();
    const cry = (p) => {
      const y = p[1];
      return y < 1 ? mixc(COL.seedDk, COL.seed, y) : mixc(COL.seed, COL.seedLt, y - 1);
    };
    // 下は短め、上は長めの8角すい2つ
    const lo = (p) => cry([0, p[1] * 0.75, 0]);
    const hi = (p) => cry([0, 0.75 + p[1] * 1.25, 0]);
    g.cyl(T(0, 0, 0, 0.5, 0.55, 0.5), lo, 8, { bottom: 0, top: 1, flat: true, caps: false });
    g.cyl(T(0, 0.55, 0, 0.5, 0.95, 0.5), hi, 8, { bottom: 1, top: 0, flat: true, caps: false });
    // 寄りそう小さな結晶
    for (const [sx, sz, s, rz] of [[0.38, 0.1, 0.45, -0.5], [-0.33, -0.15, 0.38, 0.55]]) {
      const m = T(sx, 0.28, sz, 1, 1, 1, 0, 0, rz);
      g.cyl(M4.scale(M4.copy(m), 0.2 * s / 0.45, 0.25 * s / 0.45, 0.2 * s / 0.45), lo, 6, { bottom: 0, top: 1, flat: true, caps: false });
      const m2 = M4.translate(M4.copy(m), 0, 0.25 * s / 0.45, 0);
      g.cyl(M4.scale(m2, 0.2 * s / 0.45, 0.5 * s / 0.45, 0.2 * s / 0.45), hi, 6, { bottom: 1, top: 0, flat: true, caps: false });
    }
    // てっぺんの小さな芽（双葉）
    g.cyl(T(0, 1.42, 0, 0.025, 0.16, 0.025), COL.leafDk, 5);
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.11, 1.6, 0, 0.12, 0.035, 0.07, 0, 0, sx * -0.35), COL.leaf, 10, 6);
    Models.seed = g.mesh();
  }
  // ================= ハート =================
  {
    const g = new Geo();
    const hc = (p) => mixc(COL.heart, COL.heartLt, clamp(p[1] * 0.6 + 0.2, 0, 1));
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.13, 0.02, 0, 0.19, 0.31, 0.15, 0, 0, sx * -0.72), hc, 16, 12);
    g.sphere(T(-0.16, 0.16, 0.115, 0.05, 0.035, 0.02, 0, 0, 0.6), COL.white, 8, 4);
    Models.heart = g.mesh();
  }
  // ================= 敵：もこもこ（ふわふわの紫。踏める）=================
  {
    const g = new Geo();
    const fur = (p) => mixc(COL.enemyDk, COL.enemy, clamp(p[1] * 0.5 + 0.55, 0, 1));
    g.sphere(T(0, 0.56, 0, 0.6, 0.52, 0.6), fur, 18, 12);
    // まわりにふわふわの玉をくっつけて、もこもこの輪郭に
    for (const q of fibPoints(30)) {
      if (q[1] < -0.35) continue;
      if (q[2] > 0.45 && Math.abs(q[0]) < 0.62 && q[1] < 0.55) continue; // 顔はあける
      const p = [q[0] * 0.58, 0.56 + q[1] * 0.5, q[2] * 0.58];
      const s = 0.2 + (q[1] + 1) * 0.04;
      const lt = clamp(q[1] * 0.5 + 0.5, 0, 1);
      g.sphere(T(p[0], p[1], p[2], s, s * 0.9, s), (pp) => mixc(COL.enemyDk, mixc(COL.enemy, COL.enemyLt, lt * 0.45), clamp(pp[1] * 0.5 + 0.5 + lt * 0.3, 0, 1)), 10, 7);
    }
    // 目（白目＋黒目）と、怒りまゆ
    for (const sx of [-1, 1]) {
      g.sphere(T(sx * 0.2, 0.66, 0.5, 0.13, 0.15, 0.08, sx * 0.3), COL.white, 12, 8);
      g.sphere(T(sx * 0.17, 0.63, 0.57, 0.06, 0.08, 0.04, sx * 0.3), COL.eye, 10, 6);
      g.sphere(T(sx * 0.155, 0.66, 0.6, 0.02, 0.022, 0.01), COL.white, 6, 4);
      g.box(T(sx * 0.22, 0.83, 0.55, 0.2, 0.05, 0.06, sx * 0.3, 0, sx * -0.45), COL.enemyDk);
    }
    // 口とキバ
    g.arc(T(0, 0.48, 0.585, 1, 1, 1, 0, -0.2), COL.eye, 0.07, 0.014, 0.3, Math.PI - 0.3, 8, 4);
    g.cyl(T(0.05, 0.47, 0.595, 0.025, 0.05, 0.02, 0, Math.PI), COL.white, 5, { top: 0 });
    // 足
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.28, 0.09, 0.1, 0.17, 0.1, 0.22), COL.enemyDk, 10, 6);
    Models.blob = g.mesh();
  }
  // ================= 敵：トゲコロ（トゲ玉。踏めない）=================
  {
    const g = new Geo();
    g.sphere(T(0, 0, 0, 0.66, 0.66, 0.66), (p) => mixc(COL.spikeDk, COL.spike, p[1] * 0.4 + 0.6), 16, 12);
    for (const q of fibPoints(26)) {
      const m = alignY([q[0] * 0.55, q[1] * 0.55, q[2] * 0.55], q, 0.17, 0.52, 0.17);
      g.cyl(m, (p) => (p[1] > 0.62 ? COL.spikeTip : mixc(COL.spike, hex(0x8a8ca8), p[1])), 7, { top: 0, caps: false });
    }
    Models.spiky = g.mesh();
  }
  // ---- 影・粒・輪（他のファイルからも使う）----
  Models.shadow = new Geo().disc(T(), [0, 0, 0], 20).mesh();
  Models.puff = new Geo().sphere(T(), WHITE, 8, 6, { flat: true }).mesh();
  Models.ring = new Geo().torus(T(), WHITE, 1, 0.08, 28, 4).mesh();
  Models.cube = new Geo().box(T(), WHITE).mesh();
  Models.flag = (() => {
    const g = new Geo();
    g.cyl(T(0, 0, 0, 0.08, 3, 0.08), COL.white, 8);
    g.sphere(T(0, 3.05, 0, 0.16, 0.16, 0.16), COL.flowerY, 8, 6);
    return g.mesh();
  })();
  Models.flagCloth = new Geo().box(T(0.5, 2.6, 0, 1, 0.6, 0.05), COL.scarf).mesh();
}

// ---------- ころんを描く ----------
// P の状態を読んで、姿勢・表情・マフラーのなびきを決める。
// ポーズが切り替わるときは、前のポーズから短い時間で混ぜてつなぐ（PoseMix）。
// drawPlayer は影用（R.pass === 'shadow'）と本番で1フレームに2回呼ばれるので、
// 混ぜ具合や「直前に何をしたか」の記録は本番の描画のときだけ進める。
const POSE_N = 24; // 手(3×2) 足(4×2) と、体の角度・位置・耳 10こ
const PoseMix = {
  key: '',                         // いまのポーズの名前
  from: new Float32Array(POSE_N),  // 切り替わる直前に描いていたポーズ
  last: new Float32Array(POSE_N),  // 前のフレームに描いたポーズ

  // ---- 顔 ----
  if (!shadowPass) {
    // まばたき：3.4秒ごと、ときどき2回
    const bt = (t + 0.4) % 3.4, cyc = Math.floor((t + 0.4) / 3.4);
    let blink = 1;
    if (bt < 0.14) blink = 0.08 + Math.abs(bt - 0.07) / 0.07 * 0.92;
    else if (cyc % 3 === 1 && bt > 0.24 && bt < 0.38) blink = 0.08 + Math.abs(bt - 0.31) / 0.07 * 0.92;
    if (P.crouching) blink = Math.min(blink, 0.55);
    for (const sd of [-1, 1]) {
      const e = M4.copy(body);
      M4.translate(e, sd * 0.2, 0.86, 0.474);
      M4.rotY(e, sd * 0.36);
      if (eyes === 'open') {
        M4.scale(e, 1, blink, 1);
        drawMesh(Models.eye, e);
      } else if (eyes === 'happy') {
        M4.translate(e, 0, -0.01, 0.04);
        drawMesh(Models.eyeHappy, e);
      } else {
        // ぎゅっと目（> <）
        M4.translate(e, 0, 0, 0.045);
        if (sd > 0) M4.rotZ(e, Math.PI);
        drawMesh(Models.eyeX, e);
      }
    }
    const mo = M4.copy(body);
    if (mouth === 'open') {
      M4.translate(mo, 0, 0.625, 0.545);
      M4.rotX(mo, -0.25);
      drawMesh(Models.mouthOpen, mo);
    } else {
      M4.translate(mo, 0, 0.675, 0.565);
      M4.rotX(mo, -0.3);
      drawMesh(Models.mouth, mo);
    }
  }
  // ---- 耳 ----
  for (const sd of [-1, 1]) {
    const e = M4.copy(body);
    M4.translate(e, sd * 0.3, 1.1, -0.04);
    M4.rotZ(e, sd * (-0.42 - earZ));
    M4.rotX(e, -0.1 + earX);
    drawMesh(Models.ear, e);
  }
  // ---- しっぽ ----
  {
    const tl = M4.copy(body);
    M4.translate(tl, 0, 0.34, -0.53);
    M4.rotY(tl, Math.sin(t * (run ? 14 : 5)) * 0.3);
    drawMesh(Models.tail, tl);
  }
  // ---- 足 ----
  for (let i = 0; i < 2; i++) {
    const f = M4.copy(m);
    const [fx, fy, fz, fa] = feet[i];
    M4.translate(f, fx, fy, fz);
    if (fa) M4.rotX(f, fa);
    M4.scale(f, Math.min(1.1, sxz), 1, 1);
    drawMesh(Models.foot, f);
  }
  // ---- 手（体のつぶれに合わせて高さも動かす）----
  for (let i = 0; i < 2; i++) {
    const hd = M4.copy(m);
    const [hx, hy, hz] = hands[i];
    M4.translate(hd, hx * sxz, hy * sq, hz);
    drawMesh(Models.hand, hd);
  }
  // ---- マフラーのしっぽ（2本。速さと落下でなびく）----
  {
    const wind = clamp(hsp / PL.RUN, 0, 1) + (air ? clamp(Math.abs(P.vy) / 20, 0, 0.7) : 0);
    for (const sd of [-1, 1]) {
      const fl1 = Math.sin(t * 13 + sd) * (0.08 + wind * 0.14);
      const fl2 = Math.sin(t * 15 + 1.3 + sd) * (0.12 + wind * 0.22);
      const s = M4.copy(body);
      M4.translate(s, 0.2 + sd * 0.05, 0.47, -0.6);
      M4.rotY(s, 0.25 + sd * 0.22);
      M4.rotZ(s, sd * 0.12);
      M4.rotX(s, 0.25 + wind * 1.05 + fl1);
      drawMesh(Models.scarfTail, s);
      M4.translate(s, 0, -0.28, 0);
      M4.rotX(s, 0.1 + wind * 0.35 + fl2);
      M4.scale(s, 0.92, 0.85, 1);
      drawMesh(Models.scarfTail, s);
    }
  }
}

// 丸い影を地面に落とす（着地位置の目安。本物の影と重なるので控えめ）
function drawShadow(x, y, z, r, a = 0.32) {
  if (R.pass === 'shadow') return;
  const g = groundBelow(x, z, y + 0.2, 0);
  if (!g) return;
  const h = y - g.y;
  const k = clamp(1 - h / 14, 0.25, 1);
  Sprites.add(x, g.y + 0.03, z, r * 1.25 * (0.6 + 0.4 * k), 3, 0.12, 0.1, 0.2, a * k * 0.8);
}

// ---------- 粒子 ----------
// 種類：ふつうの粒（土ぼこり）／光る粒（emit）／星（star）／輪（ring）／閃光（flash）
const Fx = {
  list: [],
  add(o) { if (this.list.length < 400) this.list.push(o); },
  dust(x, y, z, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 1 + Math.random() * 2;
      this.add({ x: x + Math.cos(a) * 0.3, y: y + 0.12, z: z + Math.sin(a) * 0.3, vx: Math.cos(a) * s, vy: 0.8 + Math.random() * 1.4, vz: Math.sin(a) * s, life: 0.55, max: 0.55, size: 0.2 + Math.random() * 0.14, col: [0.96, 0.92, 0.84], grav: -1.5, alpha: 0.55, drag: 3 });
    }
  },
  skid(x, y, z) { if (Math.random() < 0.5) this.dust(x, y, z, 1); },
  burst(x, y, z, col, n, sp) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, b = Math.random() * Math.PI - Math.PI / 2, s = sp * (0.5 + Math.random() * 0.7);
      this.add({ x, y, z, vx: Math.cos(a) * Math.cos(b) * s, vy: Math.sin(b) * s + 2, vz: Math.sin(a) * Math.cos(b) * s, life: 0.6, max: 0.6, size: 0.12 + Math.random() * 0.1, col, grav: 10, alpha: 1, emit: 1, star: i % 3 === 0, drag: 1.5, rot: Math.random() * TAU });
    }
    // はじける瞬間の光
    this.add({ flash: true, x, y, z, life: 0.22, max: 0.22, size: 0.5 + sp * 0.12, col: mixc(col, [1, 1, 1], 0.5) });
    if (n >= 10) this.add({ ring: true, air: true, x, y, z, life: 0.35, max: 0.35, size: 0.3, col: mixc(col, [1, 1, 1], 0.4) });
  },
  sparkle(x, y, z, col) {
    this.add({ x: x + (Math.random() - 0.5), y: y + (Math.random() - 0.5), z: z + (Math.random() - 0.5), vx: 0, vy: 0.8, vz: 0, life: 0.7, max: 0.7, size: 0.1, col, grav: 0, alpha: 1, emit: 1, star: true, rot: Math.random() * TAU });
  },
  ring(x, y, z) { this.add({ ring: true, x, y, z, life: 0.45, max: 0.45, size: 0.5, col: [1, 0.97, 0.9] }); },
  update(dt) {
    for (const p of this.list) {
      p.life -= dt;
      if (p.ring || p.flash) continue;
      p.vy -= p.grav * dt;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vz *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    }
    this.list = this.list.filter((p) => p.life > 0);
  },
  draw() {
    for (const p of this.list) {
      const k = p.life / p.max;
      const c = p.col;
      if (p.ring) {
        const r = p.size + (1 - k) * (p.air ? 1.8 : 3.5);
        Sprites.add(p.x, p.y + 0.06, p.z, r, 4, c[0], c[1], c[2], k * 0.9);
        if (p.air) Sprites.add(p.x, p.y, p.z, r * 0.8, 1, c[0], c[1], c[2], k * 0.25);
      } else if (p.flash) {
        Sprites.add(p.x, p.y, p.z, p.size * (1.2 + (1 - k) * 1.5), 1, c[0], c[1], c[2], k * 0.6);
      } else if (p.emit) {
        const s = p.size * (0.5 + 0.5 * k);
        const a = p.alpha * Math.min(1, k * 2.5);
        if (p.star) Sprites.add(p.x, p.y, p.z, s * 3.6, 2, c[0], c[1], c[2], a, (p.rot || 0) + (1 - k) * 2);
        else Sprites.add(p.x, p.y, p.z, s * 2.4, 1, c[0], c[1], c[2], a);
      } else {
        // 土ぼこり：ふくらみながら消える
        const s = p.size * (0.7 + (1 - k) * 1.1);
        Sprites.add(p.x, p.y, p.z, s * 1.5, 0, c[0], c[1], c[2], p.alpha * Math.min(1, k * 1.8) * 0.85);
      }
    }
    this.drawGlows();
    Sprites.flush();
  },
  // ひかりの種・ハートのまわりの光（75_entities.js の描く位置に合わせる）
  drawGlows() {
    if (typeof Level === 'undefined') return;
    const t = Game.time;
    for (const s of Level.seeds) {
      if (s.got || s.hidden) continue;
      const y = s.y + Math.sin(s.t * 2) * 0.2;
      const pulse = 0.85 + Math.sin(s.t * 4) * 0.15;
      Sprites.add(s.x, y + 0.75, s.z, 2.2 * pulse, 1, 0.4, 1, 0.85, 0.32);
      Sprites.add(s.x, y + 0.8, s.z, 2.0, 2, 0.8, 1, 0.95, 0.3, t * 0.6);
      Sprites.add(s.x, y + 0.8, s.z, 1.5, 2, 0.8, 1, 0.95, 0.2, -t * 0.9 + 0.7);
      const g = groundBelow(s.x, s.z, s.y + 0.5, 0);
      if (g) {
        Sprites.add(s.x, g.y + 0.05, s.z, 1.4 * pulse, 5, 0.4, 1, 0.85, 0.4);
        const rk = (t * 0.7 + s.id * 0.3) % 1;
        Sprites.add(s.x, g.y + 0.06, s.z, 0.4 + rk * 1.0, 4, 0.6, 1, 0.9, (1 - rk) * 0.6);
      }
    }
    for (const h of Level.hearts) {
      if (h.got) continue;
      Sprites.add(h.x, h.y + Math.sin(h.t) * 0.15, h.z, 1.1, 1, 1, 0.45, 0.55, 0.3);
    }
  },
};

// ===== 70_level.js =====
// ステージ「そよかぜ空島」：当たり判定と見た目を同時に組み立てる
//
// 地図（上が北＝ -z、右が東＝ +x）
//   中央：はじまりの草原（半径28、高さ0）。スタートは南側 (0,16)
//   北  ：風の塔（らせん足場 → 落ちる足場 → バク宙で屋上）……… 種1
//   北西：見晴らしの崖と風車（3段ジャンプ）……………………… 種0
//   東  ：動く足場 → 回る橋 → 上下する足場 → 東の浮島 ………… 種2
//   西  ：トゲコロの坂 → 高台（敵を全部たおすと出る）………… 種3
//   南  ：橋 → えんとつ島（えんとつの中を壁キック）…………… 種4
//   中央：どんぐり50こで出る ……………………………………………… 種5
//   南西：幅とびの桟橋 → ちぎれ雲の小島（帰りは風の筒）……… 種6
//   南東：杭3本をヒップドロップ → 雲の飛び石が浮かぶ → 小屋の島 … 種7
//   ひみつ：中央の島の北東のがけ下に小さな足場（どんぐり・ハート・ばね）
const Level = {
  static: null,     // まとめた地形メッシュ
  water: null,
  clouds: [],
  acorns: [], seeds: [], hearts: [], enemies: [], movers: [], springs: [],
  spinners: [], fallers: [], stakes: [], risers: [], launchers: [], mills: [], flags: [],
  start: { x: 0, y: 0, z: 16, yaw: Math.PI },
  seedTotal: 0, acornTotal: 0,
  signs: [],
  stakeDone: false, arenaDone: false,
  _cache: null,     // 2回目以降の組み立てではメッシュを作り直さない
};

// 2回目以降の組み立て用：形状を作らない Geo の代わり
const NOGEO = { box() { return this; }, cyl() { return this; }, sphere() { return this; }, disc() { return this; }, torus() { return this; } };

function buildLevel() {
  World.clear();
  World.killY = -28;
  Object.assign(Level, {
    acorns: [], seeds: [], hearts: [], enemies: [], movers: [], springs: [], signs: [], clouds: [],
    spinners: [], fallers: [], stakes: [], risers: [], launchers: [], mills: [], flags: [],
    stakeDone: false, arenaDone: false,
  });
  const cache = Level._cache || (Level._cache = {});
  const g = cache.static ? NOGEO : new Geo(0.09);
  const rng = makeRng(20261125);
  const once = (key, make) => cache[key] || (cache[key] = make());

  // ---------- 部品 ----------
  const grassCol = (p, n) => (n[1] > 0.5 ? mixc(COL.grassDk, COL.grass, 0.5 + 0.5 * Math.sin(p[0] * 3.1 + p[2] * 2.3)) : p[1] > 0.75 ? COL.grassDk : COL.dirt);
  const dirtCol = (p) => mixc(COL.dirtDk, COL.dirt, clamp(p[1], 0, 1));
  const rockCol = (p) => mixc(COL.stoneDk, COL.stone, clamp(p[1] * 0.8 + 0.2 + 0.15 * Math.sin(p[1] * 9), 0, 1));

  function island(x, z, r, top, depth = 7) {
    World.cyl(x, z, r, top - depth * 0.6, top, 'grass');
    g.cyl(T(x, top - 0.7, z, r, 0.7, r), grassCol, 32);
    g.cyl(T(x, top - 0.7 - depth, z, r, depth, r), dirtCol, 32, { bottom: 0.18, top: 0.98, caps: false, flat: true });
  }
  function kindColor(kind) {
    if (kind === 'stone') return (p, n) => (n[1] > 0.5 ? COL.stone : mixc(COL.stoneDk, COL.stone, p[1] + 0.5));
    if (kind === 'wood') return (p, n) => (n[1] > 0.5 ? COL.wood : COL.woodDk);
    if (kind === 'ice') return (p, n) => (n[1] > 0.5 ? COL.ice : shade(COL.ice, 0.85));
    if (kind === 'cloud') return (p, n) => (n[1] > 0.5 ? COL.cloud : hex(0xd6e4f4));
    return (p, n) => (n[1] > 0.5 ? COL.grass : p[1] > 0.3 ? COL.grassDk : COL.dirt);
  }
  function block(cx, cy, cz, sx, sy, sz, kind = 'grass') {
    const s = World.boxC(cx, cy, cz, sx, sy, sz, kind);
    g.box(T(cx, cy, cz, sx, sy, sz), kindColor(kind));
    return s;
  }
  // 回転した向きの動かない板（桟橋など）
  function oblock(cx, cz, sx, sz, ang, y0, y1, kind = 'stone') {
    const s = World.obox(cx, cz, sx, sz, ang, y0, y1, kind);
    g.box(T(cx, (y0 + y1) / 2, cz, sx, y1 - y0, sz, ang), kindColor(kind));
    return s;
  }
  function stump(x, z, r, top, depth = 30) {
    World.cyl(x, z, r, top - depth, top, 'wood');
    g.cyl(T(x, top - depth, z, r, depth, r), (p, n) => (n[1] > 0.5 ? mixc(COL.wood, hex(0xe9c08a), 0.5) : COL.woodDk), 18, { flat: true });
    g.cyl(T(x, top, z, r * 0.62, 0.02, r * 0.62), hex(0xd9a86c), 18); // 年輪
    g.cyl(T(x, top + 0.005, z, r * 0.5, 0.02, r * 0.5), hex(0xf0cf98), 18);
  }
  function tree(x, y, z, s = 1) {
    World.cyl(x, z, 0.45 * s, y, y + 3.2 * s, 'wood');
    g.cyl(T(x, y, z, 0.35 * s, 3.2 * s, 0.35 * s), COL.trunk, 8, { top: 0.7, flat: true });
    const leaf = (p) => mixc(COL.leafDk, COL.leaf, clamp(p[1] * 0.5 + 0.5, 0, 1));
    g.sphere(T(x, y + 3.6 * s, z, 1.6 * s, 1.4 * s, 1.6 * s), leaf, 10, 7, { flat: true });
    g.sphere(T(x + 0.8 * s, y + 3.0 * s, z + 0.4 * s, 1.0 * s, 0.9 * s, 1.0 * s), leaf, 8, 6, { flat: true });
    g.sphere(T(x - 0.7 * s, y + 3.2 * s, z - 0.5 * s, 1.0 * s, 0.9 * s, 1.0 * s), leaf, 8, 6, { flat: true });
    // 木の上にも乗れる
    World.cyl(x, z, 1.3 * s, y + 4.4 * s, y + 4.9 * s, 'grass').noCam = true;
    return y + 4.9 * s;
  }
  function pine(x, y, z, s = 1) {
    World.cyl(x, z, 0.4 * s, y, y + 4 * s, 'wood');
    g.cyl(T(x, y, z, 0.3 * s, 1.2 * s, 0.3 * s), COL.trunk, 6);
    for (let i = 0; i < 3; i++) {
      g.cyl(T(x, y + (1 + i * 1.1) * s, z, (1.6 - i * 0.4) * s, 1.8 * s, (1.6 - i * 0.4) * s), (p) => mixc(COL.leafDk, COL.leaf, p[1]), 8, { top: 0, flat: true });
    }
  }
  function rock(x, y, z, s) {
    World.cyl(x, z, s * 0.9, y - 1, y + s * 0.9, 'stone');
    g.sphere(T(x, y, z, s, s * 0.9, s * 0.95, rng() * 3), (p) => mixc(COL.stoneDk, COL.stone, p[1] * 0.5 + 0.5), 7, 5, { flat: true });
  }
  function flower(x, y, z) {
    const c = [COL.flowerR, COL.flowerY, COL.flowerW][Math.floor(rng() * 3)];
    g.cyl(T(x, y, z, 0.03, 0.35, 0.03), COL.leafDk, 4, { caps: false });
    g.sphere(T(x, y + 0.38, z, 0.12, 0.07, 0.12), c, 6, 4, { flat: true });
    g.sphere(T(x, y + 0.4, z, 0.05, 0.05, 0.05), COL.flowerY, 4, 3);
  }
  function tuft(x, y, z) {
    for (let i = 0; i < 3; i++) {
      const a = rng() * TAU;
      g.cyl(T(x + Math.cos(a) * 0.12, y, z + Math.sin(a) * 0.12, 0.07, 0.3 + rng() * 0.2, 0.07, a, (rng() - 0.5) * 0.5), COL.grassDk, 3, { top: 0, flat: true, caps: false });
    }
  }
  // 花と草をまく（avoid: [[x,z,r],...] の中には置かない）
  function scatter(cx, cz, r0, r1, y, n, avoid = []) {
    for (let i = 0; i < n; i++) {
      const a = rng() * TAU, r = r0 + rng() * (r1 - r0);
      const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      const k = rng();
      if (avoid.some(([ax, az, ar]) => Math.hypot(x - ax, z - az) < ar)) continue;
      if (k < 0.45) flower(x, y, z); else tuft(x, y, z);
    }
  }
  function fence(x0, z0, x1, z1, y) {
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, z1 - z0) / 1.6));
    const ang = Math.atan2(x1 - x0, z1 - z0);
    for (let i = 0; i <= n; i++) {
      const x = lerp(x0, x1, i / n), z = lerp(z0, z1, i / n);
      g.box(T(x, y + 0.5, z, 0.18, 1, 0.18), COL.woodDk);
    }
    const len = Math.hypot(x1 - x0, z1 - z0);
    g.box(T((x0 + x1) / 2, y + 0.75, (z0 + z1) / 2, 0.1, 0.12, len, ang), COL.wood);
    g.box(T((x0 + x1) / 2, y + 0.4, (z0 + z1) / 2, 0.1, 0.12, len, ang), COL.wood);
    // 柵は低い壁として当たり判定（軸にそった柵だけ）
    const s = World.add({ type: 'box', x0: Math.min(x0, x1) - 0.1, x1: Math.max(x0, x1) + 0.1, z0: Math.min(z0, z1) - 0.1, z1: Math.max(z0, z1) + 0.1, y0: y, y1: y + 0.9, kind: 'wood' });
    s.noCam = true;
  }
  // 看板：近づくとヒントが出る
  function sign(x, y, z, yaw, lines) {
    World.cyl(x, z, 0.18, y, y + 1.1, 'wood').noCam = true;
    g.cyl(T(x, y, z, 0.09, 1.25, 0.09), COL.woodDk, 6);
    g.box(T(x, y + 1.3, z, 1.3, 0.8, 0.12, yaw), (p, n) => (Math.abs(n[2]) > 0.5 ? hex(0xf3d7a6) : COL.wood));
    g.box(T(x + Math.sin(yaw) * 0.07, y + 1.38, z + Math.cos(yaw) * 0.07, 0.9, 0.08, 0.02, yaw), COL.woodDk);
    g.box(T(x + Math.sin(yaw) * 0.07, y + 1.2, z + Math.cos(yaw) * 0.07, 0.7, 0.08, 0.02, yaw), COL.woodDk);
    Level.signs.push({ x, y, z, lines, armed: true });
  }
  // 小屋（屋根も坂として乗れる）
  function hut(x, y, z, sx, sz, wall) {
    World.boxC(x, y + 1.1, z, sx, 2.2, sz, 'wood');
    g.box(T(x, y + 1.1, z, sx, 2.2, sz), (p, n) => (n[1] > 0.5 ? COL.woodDk : mixc(hex(0xf2e2c4), hex(0xe6cfa8), (Math.floor((p[0] + p[2] + 1) * 6) % 2))));
    // 扉と窓
    g.box(T(x, y + 0.75, z + sz / 2 + 0.02, 0.8, 1.5, 0.05), COL.woodDk);
    g.box(T(x + sx * 0.3, y + 1.4, z + sz / 2 + 0.02, 0.55, 0.5, 0.05), hex(0x7fd3ff));
    // 屋根（x 方向に山形）
    const hw = sx / 2 + 0.35, rise = 1.1;
    World.ramp(x - hw, z - sz / 2 - 0.3, x, z + sz / 2 + 0.3, y + 2.2 - 0.3, 'x', y + 2.2, y + 2.2 + rise, 'wood').noCam = true;

    // 幅とびの軌道にどんぐり（目安）
    for (let i = 0; i < 4; i++) { const r = 31.5 + i * 2.1; const [x, z] = at(r); acornAt(x, 2 + 1.2 * Math.sin((i + 1) / 5 * Math.PI) - i * 0.5, z); }
    // ちぎれ雲の小島：中心 r=44.5、半径 5.5、高さ -1（桟橋より 3 低い・すき間 9.0）
    const [ix, iz] = at(44.5);
    island(ix, iz, 5.5, -1, 6);
    stump(ix + qx * 0.5, iz + qz * 0.5, 1.1, 0.2, 2);
    seedAt(6, ix + qx * 0.5, 0.2, iz + qz * 0.5, 'ちぎれ雲の小島');
    pine(ix + dx * 2.5 - qx * 2.5, -1, iz + dz * 2.5 - qz * 2.5, 0.8);
    scatter(ix, iz, 1.5, 5, -1, 14, [[ix + qx * 0.5, iz + qz * 0.5, 1.4]]);
    acornRing(ix + qx * 0.5, -1, iz + qz * 0.5, 2.6, 3, 1.0);
    // 帰り道：風の筒（中央の島へ飛ばす）
    const [lx, lz] = at(42.0, 2.8);
    launcher(lx, -1, lz, Math.atan2(-dx, -dz), 22, 17);
    const [sx, sz] = at(21, -2.6);
    sign(sx, 0, sz, Math.atan2(dx, dz) + Math.PI, ['走りながら しゃがんで ジャンプで 幅とび！', '帰りは 風の筒に 乗ろう']);
  }

  // ================= 種7 南東：杭を打つと雲の飛び石が浮かぶ =================
  {
    stake(12, 0, 18.5); stake(15.5, 0, 14.5); stake(18, 0, 19.5);
    acornAt(12, 0.9, 18.5); acornAt(15.5, 0.9, 14.5); acornAt(18, 0.9, 19.5);
    const ex = Math.SQRT1_2, ez = Math.SQRT1_2, qx = Math.SQRT1_2, qz = -Math.SQRT1_2;
    const at = (r, side = 0) => [ex * r + qx * side, ez * r + qz * side];
    [[31, 1.0, 0.8], [34.5, 2.0, -0.8], [38, 3.0, 0.8], [41.5, 4.0, -0.6]].forEach(([r, top, side]) => {
      const [x, z] = at(r, side);
      riser(x, top, z, 2.5, 2.5);
      acornAt(x, top, z);
    });
    const [ix, iz] = at(50.9);
    island(ix, iz, 6, 5, 7);
    hut(ix + 1.5, 5, iz + 2.2, 3, 2.4);
    flag(ix - 3, 5, iz - 2, hex(0x9b7de0));
    seedAt(7, ix - 1.5, 5, iz - 0.5, '雲の上の小屋');
    blobAt(ix + 2, 5, iz - 3, 1.5);
    scatter(ix, iz, 2, 5.5, 5, 14, [[ix + 1.5, iz + 2.2, 2.6]]);
    sign(10.5, 0, 22, Math.PI, ['3本の杭を ヒップドロップで 打ちこもう', '（空中で しゃがむ）']);
  }

  // ================= ひみつ：北東のがけ下 =================
  {
    const a = -0.93, r = 31.2;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    block(x, -3.8, z, 5.2, 0.6, 5.2, 'stone');
    g.cyl(T(x, -6.5, z, 2.2, 2.4, 2.2), rockCol, 7, { top: 1.2, bottom: 0.2, flat: true });
    acornRing(x, -3.5, z, 1.4, 5);
    heartAt(x + 1.5, -3.5, z - 1.5);
    Level.springs.push(World.boxC(x - 1.4, -3.25, z + 1.4, 1.6, 0.5, 1.6, 'spring'));
  }

  // どんぐりの総数
  Level.acornTotal = Level.acorns.length;
  Level.seedTotal = Level.seeds.length;

  // まとめた地形メッシュ（2回目以降は作り直さない）
  if (!cache.static) { cache.static = g.mesh(); cache.staticTris = g.pos.length / 9; }
  Level.static = cache.static;
  Level.staticTris = cache.staticTris;

  // ---- 動く物のメッシュ ----
  const boxMesh = (sx, sy, sz, kind, jit = 0.06) => once(`box:${sx}:${sy}:${sz}:${kind}`, () => new Geo(jit).box(T(0, 0, 0, sx, sy, sz), kindColor(kind)).mesh());
  for (const mv of Level.movers) {
    const s = mv.s;
    mv.mesh = boxMesh(s.x1 - s.x0, s.y1 - s.y0, s.z1 - s.z0, s.kind);
  }
  for (const sp of Level.spinners) {
    sp.mesh = once(`spin:${sp.sx}:${sp.sz}`, () => {
      const gg = new Geo(0.06);
      gg.box(T(0, 0, 0, sp.sx, 0.5, sp.sz), kindColor('wood'));
      for (let i = 0; i < 9; i++) gg.box(T(-sp.sx / 2 + 0.6 + i * ((sp.sx - 1.2) / 8), 0.26, 0, 0.12, 0.03, sp.sz), COL.woodDk);
      gg.cyl(T(0, 0.25, 0, 0.5, 0.08, 0.5), hex(0xffd166), 12);
      return gg.mesh();
    });
  }
  for (const f of Level.fallers) {
    f.mesh = once(`fall:${f.sx}:${f.sz}`, () => {
      const gg = new Geo(0.12);
      gg.box(T(0, 0, 0, f.sx, 0.6, f.sz), (p, n) => (n[1] > 0.5 ? hex(0xd9a066) : hex(0xa36a3a)));
      gg.box(T(0.3, 0.31, -0.2, 1.4, 0.02, 0.08, 0.6), hex(0x6b4325)); // ひび
      gg.box(T(-0.4, 0.31, 0.4, 0.9, 0.02, 0.08, -0.9), hex(0x6b4325));
      return gg.mesh();
    });
  }
  for (const r of Level.risers) {
    r.mesh = once(`rise:${r.sx}:${r.sz}`, () => {
      const gg = new Geo(0.03);
      gg.box(T(0, 0, 0, r.sx, 0.7, r.sz), kindColor('cloud'));
      for (const [ox, oz] of [[-0.8, -0.8], [0.8, -0.7], [-0.7, 0.8], [0.8, 0.8]]) gg.sphere(T(ox, -0.2, oz, 0.75, 0.5, 0.75), COL.cloud, 8, 5, { flat: true });
      return gg.mesh();
    });
  }
  Models.stake = once('stake', () => {
    const gg = new Geo(0.08);
    gg.cyl(T(0, 0, 0, 0.55, 2.7, 0.55), (p, n) => (n[1] > 0.5 ? hex(0xe9c08a) : COL.woodDk), 10, { flat: true });
    gg.cyl(T(0, 2.7, 0, 0.62, 0.2, 0.62), hex(0xd8604a), 10, { flat: true });
    return gg.mesh();
  });
  Models.spring = once('spring', () => {
    const gg = new Geo();
    gg.cyl(T(0, 0, 0, 0.8, 0.15, 0.8), COL.stoneDk, 14);
    for (let i = 0; i < 3; i++) gg.torus(T(0, 0.18 + i * 0.12, 0, 0.55, 1, 0.55), COL.spikeTip, 1, 0.08, 14, 5);
    gg.cyl(T(0, 0.5, 0, 0.8, 0.12, 0.8), hex(0xff5a5a), 14);
    return gg.mesh();
  });
  Models.launcher = once('launcher', () => {
    const gg = new Geo();
    gg.cyl(T(0, -0.15, 0, 0.95, 0.15, 0.95), hex(0x7fd3ff), 16);
    // 進む向き（+z）の矢印
    gg.box(T(0, 0.02, -0.15, 0.3, 0.05, 0.9), COL.white);
    gg.box(T(0.22, 0.02, 0.35, 0.18, 0.05, 0.6, 0.7), COL.white);
    gg.box(T(-0.22, 0.02, 0.35, 0.18, 0.05, 0.6, -0.7), COL.white);
    return gg.mesh();
  });
  Models.millBlades = once('mill', () => {
    const gg = new Geo();
    gg.cyl(T(0, 0, 0, 0.35, 0.4, 0.35, 0, Math.PI / 2), COL.woodDk, 10);
    for (let i = 0; i < 4; i++) {
      const m = T(0, 0, 0.25, 1, 1, 1, 0, 0, (i * Math.PI) / 2);
      const arm = M4.copy(m); M4.translate(arm, 0, 2.0, 0); M4.scale(arm, 0.12, 4, 0.08);
      gg.box(arm, COL.woodDk);
      const sail = M4.copy(m); M4.translate(sail, 0.38, 2.4, 0.02); M4.scale(sail, 0.7, 3, 0.04);
      gg.box(sail, hex(0xfaf3e6));
    }
    return gg.mesh();
  });
  Models.flagCloth2 = once('flagcloth', () => new Geo().box(T(0, 0, 0, 1, 1, 1), WHITE).mesh());
  if (!Models.hopper) buildLevelModels();

  // ---- 雲（下の雲海と、遠くの雲）----
  Level.cloudMesh = once('clouds', () => {
    const cg = new Geo(0.04);
    const crng = makeRng(7);
    for (let i = 0; i < 70; i++) {
      const a = crng() * TAU, r = 30 + crng() * 140;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      const y = -22 - crng() * 6;
      const s = 6 + crng() * 10;
      cg.sphere(T(x, y, z, s, s * 0.35, s * 0.8, crng() * 3), (p) => mixc(hex(0xdde8f5), COL.cloud, p[1] * 0.5 + 0.5), 10, 6, { flat: true });
    }
    for (let i = 0; i < 18; i++) {
      const a = crng() * TAU, r = 110 + crng() * 50;
      const x = Math.cos(a) * r, z = Math.sin(a) * r, y = 10 + crng() * 35;
      for (let k = 0; k < 3; k++) {
        const s = 4 + crng() * 5;
        cg.sphere(T(x + (k - 1) * s * 0.9, y + crng() * 2, z, s, s * 0.6, s * 0.7), (p) => mixc(hex(0xe8f0fa), COL.cloud, p[1] * 0.5 + 0.5), 10, 6, { flat: true });
      }
    }
    return cg.mesh();
  });
  // 空（大きな球の内側）
  Models.sky = once('sky', () => {
    const sg = new Geo();
    sg.sphere(T(0, 0, 0, -1, 1, 1), (p) => {
      const y = p[1];
      if (y > 0) return mixc(hex(0xbfe4ff), hex(0x4f9ae8), Math.pow(y, 0.7));
      return mixc(hex(0xbfe4ff), hex(0xe9f3ff), Math.min(1, -y * 3));
    }, 24, 14);
    return sg.mesh();
  });
}
