const Models = {};

// 球面上にほぼ均等に点を並べる（フィボナッチ球）
function fibPoints(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - (2 * (i + 0.5)) / n, r = Math.sqrt(1 - y * y), ph = i * 2.39996;
    out.push([Math.cos(ph) * r, y, Math.sin(ph) * r]);
  }
  return out;
}
// 向き dir に y 軸を合わせる行列（位置 p）
function alignY(p, dir, sx, sy, sz) {
  const y = v3.norm(dir);
  const a = Math.abs(y[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const x = v3.norm(v3.cross(a, y));
  const z = v3.cross(x, y);
  const m = new Float32Array(16);
  m[0] = x[0] * sx; m[1] = x[1] * sx; m[2] = x[2] * sx;
  m[4] = y[0] * sy; m[5] = y[1] * sy; m[6] = y[2] * sy;
  m[8] = z[0] * sz; m[9] = z[1] * sz; m[10] = z[2] * sz;
  m[12] = p[0]; m[13] = p[1]; m[14] = p[2]; m[15] = 1;
  return m;
}

function buildModels() {
  // ================= ころん（足元が原点、前が +z）=================
  {
    const g = new Geo();
    // 頭と体がひとつになった、おもちのような丸い体
    const head = (p) => {
      if (p[1] > 0.55) return mixc(COL.body, COL.bodyLt, (p[1] - 0.55) * 1.6);
      return mixc(COL.bodyDk, COL.body, clamp(p[1] * 0.7 + 0.75, 0, 1));
    };
    g.sphere(T(0, 0.7, 0, 0.6, 0.6, 0.56), head, 28, 18);
    // 下側のふくらみ（おなかは白っぽい）
    const lower = (p) => {
      const base = mixc(COL.bodyDk, COL.body, clamp(p[1] * 0.5 + 0.6, 0, 1));
      const k = smooth(clamp((p[2] - 0.25) / 0.3, 0, 1)) * smooth(clamp((0.85 - Math.abs(p[1] + 0.05)) / 0.25, 0, 1));
      return mixc(base, COL.belly, k);
    };
    g.sphere(T(0, 0.42, 0, 0.57, 0.4, 0.53), lower, 26, 14);
    // 口のまわり（ふっくらした白いマズル）
    g.sphere(T(0, 0.66, 0.44, 0.22, 0.14, 0.12), COL.belly, 16, 10);
    // 鼻
    g.sphere(T(0, 0.725, 0.555, 0.05, 0.035, 0.035), COL.eye, 10, 6);
    g.sphere(T(-0.015, 0.735, 0.585, 0.014, 0.01, 0.006), COL.white, 5, 3);
    // ほっぺ
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.35, 0.7, 0.425, 0.095, 0.058, 0.035, sx * 0.72), COL.cheek, 12, 6);
    // マフラー（しま模様）
    const stripe = (p) => {
      const u = Math.atan2(p[2], p[0]);
      return Math.floor((u / Math.PI) * 5 + 10) % 2 ? COL.scarf : mixc(COL.scarf, COL.scarfLt, 0.75);
    };
    g.torus(T(0, 0.5, 0, 1, 1, 0.97, 0, -0.06), stripe, 0.565, 0.1, 30, 10);
    // 結び目（背中側）
    g.sphere(T(0.2, 0.49, -0.56, 0.11, 0.1, 0.09, 0.4), COL.scarf, 10, 8);
    // 頭のてっぺんのくるんとした毛
    g.arc(T(0, 1.36, 0.02, 1, 1, 1, Math.PI / 2), COL.bodyLt, 0.075, 0.026, -0.9, Math.PI * 0.95, 10, 6);
    Models.body = g.mesh();
  }
  // 目（1つぶん）：黒目に大小2つのハイライト
  Models.eye = new Geo()
    .sphere(T(0, 0, 0, 0.088, 0.13, 0.052), (p) => mixc(COL.eye, COL.eyeLo, clamp(-p[1] * 1.4 - 0.2, 0, 1)), 14, 10)
    .sphere(T(0.026, 0.05, 0.042, 0.034, 0.038, 0.02), COL.white, 8, 6)
    .sphere(T(-0.028, -0.045, 0.045, 0.016, 0.016, 0.01), COL.white, 6, 4)
    .mesh();
  // にっこり目（^）と、ぎゅっと目
  Models.eyeHappy = new Geo().arc(T(0, -0.03, 0), COL.eye, 0.065, 0.019, 0.15, Math.PI - 0.15, 10, 5).mesh();
  // ぎゅっと目（> の形。左目は 180° 回して < にする）
  {
    const g = new Geo();
    const p0 = [-0.045, 0.045, 0], p1 = [0.04, 0, 0], p2 = [-0.045, -0.045, 0];
    for (const [a, c] of [[p0, p1], [p2, p1]]) {
      const d = v3.sub(c, a);
      g.cyl(alignY(a, d, 0.019, v3.len(d), 0.019), COL.eye, 6);
      g.sphere(T(a[0], a[1], a[2], 0.019, 0.019, 0.019), COL.eye, 6, 4);
    }
    g.sphere(T(p1[0], p1[1], p1[2], 0.02, 0.02, 0.02), COL.eye, 6, 4);
    Models.eyeX = g.mesh();
  }
  // 口（ω の形）と、開いた口
  {
    const g = new Geo();
    for (const sx of [-1, 1]) g.arc(T(sx * 0.034, 0, 0), COL.eye, 0.034, 0.011, Math.PI + 0.15, TAU - 0.1, 8, 5);
    Models.mouth = g.mesh();
    const o = new Geo();
    o.sphere(T(0, 0, 0, 0.065, 0.055, 0.03), COL.mouth, 12, 8);
    o.sphere(T(0, -0.025, 0.012, 0.04, 0.022, 0.02), COL.tongue, 10, 6);
    Models.mouthOpen = o.mesh();
  }
  // 耳（根もとが原点）
  Models.ear = new Geo()
    .sphere(T(0, 0.13, 0, 0.17, 0.165, 0.08), (p) => mixc(COL.body, COL.bodyLt, p[1] * 0.5 + 0.3), 14, 10)
    .sphere(T(0, 0.13, 0.04, 0.1, 0.1, 0.05), COL.cheek, 12, 8)
    .mesh();
  // しっぽ（ふわふわの丸）
  Models.tail = new Geo().sphere(T(0, 0, 0, 0.15, 0.14, 0.14), (p) => mixc(COL.body, COL.belly, p[2] * -0.5 + 0.5), 12, 8).mesh();
  // 足（底はクリーム色）、手
  Models.foot = new Geo().sphere(T(0, 0.085, 0.05, 0.155, 0.1, 0.205), (p, n) => (n[1] < -0.55 ? COL.belly : mixc(COL.foot, COL.body, p[1] * 0.5 + 0.5)), 14, 8).mesh();
  Models.hand = new Geo().sphere(T(0, 0, 0, 0.12, 0.12, 0.12), (p) => (p[1] < -0.35 || p[2] > 0.55 ? COL.belly : COL.body), 12, 8).mesh();
  // マフラーのしっぽ（上端が原点、下へ垂れる。先はしま）
  Models.scarfTail = new Geo()
    .cyl(T(0, -0.3, 0, 0.08, 0.3, 0.028), (p) => (p[1] < 0.18 ? COL.scarfLt : COL.scarf), 10)
    .mesh();

  // ================= どんぐり =================
  {
    const g = new Geo();
    const nut = (p) => mixc(COL.acornDk, COL.acorn, clamp(p[1] * 0.6 + 0.6, 0, 1));
    g.sphere(T(0, -0.02, 0, 0.26, 0.31, 0.26), nut, 16, 12);
    g.cyl(T(0, -0.36, 0, 0.06, 0.08, 0.06), COL.acornDk, 6, { top: 0.2, bottom: 1 }); // とがった先
    // 帽子（あみ目もよう）
    const cap = (p, n) => {
      const u = Math.atan2(p[2], p[0]);
      const k = (Math.floor(u * 2.6 + p[1] * 6) + Math.floor(u * 2.6 - p[1] * 6)) % 2 === 0;
      return n[1] < -0.2 ? shade(COL.acornCap, 0.75) : k ? COL.acornCapLt : COL.acornCap;
    };
    g.sphere(T(0, 0.15, 0, 0.3, 0.17, 0.3), cap, 16, 8, { flat: true });
    g.cyl(T(0, 0.28, 0, 0.035, 0.13, 0.035, 0, 0, 0.25), COL.acornCap, 6);
    Models.acorn = g.mesh();
  }
  // ================= ひかりの種（芽の出た光る結晶）=================
  {
    const g = new Geo();
    const cry = (p) => {
      const y = p[1];
      return y < 1 ? mixc(COL.seedDk, COL.seed, y) : mixc(COL.seed, COL.seedLt, y - 1);
    };
    // 下は短め、上は長めの8角すい2つ
    const lo = (p) => cry([0, p[1] * 0.75, 0]);
    const hi = (p) => cry([0, 0.75 + p[1] * 1.25, 0]);
    g.cyl(T(0, 0, 0, 0.5, 0.55, 0.5), lo, 8, { bottom: 0, top: 1, flat: true, caps: false });
    g.cyl(T(0, 0.55, 0, 0.5, 0.95, 0.5), hi, 8, { bottom: 1, top: 0, flat: true, caps: false });
    // 寄りそう小さな結晶
    for (const [sx, sz, s, rz] of [[0.38, 0.1, 0.45, -0.5], [-0.33, -0.15, 0.38, 0.55]]) {
      const m = T(sx, 0.28, sz, 1, 1, 1, 0, 0, rz);
      g.cyl(M4.scale(M4.copy(m), 0.2 * s / 0.45, 0.25 * s / 0.45, 0.2 * s / 0.45), lo, 6, { bottom: 0, top: 1, flat: true, caps: false });
      const m2 = M4.translate(M4.copy(m), 0, 0.25 * s / 0.45, 0);
      g.cyl(M4.scale(m2, 0.2 * s / 0.45, 0.5 * s / 0.45, 0.2 * s / 0.45), hi, 6, { bottom: 1, top: 0, flat: true, caps: false });
    }
    // てっぺんの小さな芽（双葉）
    g.cyl(T(0, 1.42, 0, 0.025, 0.16, 0.025), COL.leafDk, 5);
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.11, 1.6, 0, 0.12, 0.035, 0.07, 0, 0, sx * -0.35), COL.leaf, 10, 6);
    Models.seed = g.mesh();
  }
  // ================= ハート =================
  {
    const g = new Geo();
    const hc = (p) => mixc(COL.heart, COL.heartLt, clamp(p[1] * 0.6 + 0.2, 0, 1));
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.13, 0.02, 0, 0.19, 0.31, 0.15, 0, 0, sx * -0.72), hc, 16, 12);
    g.sphere(T(-0.16, 0.16, 0.115, 0.05, 0.035, 0.02, 0, 0, 0.6), COL.white, 8, 4);
    Models.heart = g.mesh();
  }
  // ================= 敵：もこもこ（ふわふわの紫。踏める）=================
  {
    const g = new Geo();
    const fur = (p) => mixc(COL.enemyDk, COL.enemy, clamp(p[1] * 0.5 + 0.55, 0, 1));
    g.sphere(T(0, 0.56, 0, 0.6, 0.52, 0.6), fur, 18, 12);
    // まわりにふわふわの玉をくっつけて、もこもこの輪郭に
    for (const q of fibPoints(30)) {
      if (q[1] < -0.35) continue;
      if (q[2] > 0.45 && Math.abs(q[0]) < 0.62 && q[1] < 0.55) continue; // 顔はあける
      const p = [q[0] * 0.58, 0.56 + q[1] * 0.5, q[2] * 0.58];
      const s = 0.2 + (q[1] + 1) * 0.04;
      const lt = clamp(q[1] * 0.5 + 0.5, 0, 1);
      g.sphere(T(p[0], p[1], p[2], s, s * 0.9, s), (pp) => mixc(COL.enemyDk, mixc(COL.enemy, COL.enemyLt, lt * 0.45), clamp(pp[1] * 0.5 + 0.5 + lt * 0.3, 0, 1)), 10, 7);
    }
    // 目（白目＋黒目）と、怒りまゆ
    for (const sx of [-1, 1]) {
      g.sphere(T(sx * 0.2, 0.66, 0.5, 0.13, 0.15, 0.08, sx * 0.3), COL.white, 12, 8);
      g.sphere(T(sx * 0.17, 0.63, 0.57, 0.06, 0.08, 0.04, sx * 0.3), COL.eye, 10, 6);
      g.sphere(T(sx * 0.155, 0.66, 0.6, 0.02, 0.022, 0.01), COL.white, 6, 4);
      g.box(T(sx * 0.22, 0.83, 0.55, 0.2, 0.05, 0.06, sx * 0.3, 0, sx * -0.45), COL.enemyDk);
    }
    // 口とキバ
    g.arc(T(0, 0.48, 0.585, 1, 1, 1, 0, -0.2), COL.eye, 0.07, 0.014, 0.3, Math.PI - 0.3, 8, 4);
    g.cyl(T(0.05, 0.47, 0.595, 0.025, 0.05, 0.02, 0, Math.PI), COL.white, 5, { top: 0 });
    // 足
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.28, 0.09, 0.1, 0.17, 0.1, 0.22), COL.enemyDk, 10, 6);
    Models.blob = g.mesh();
  }
  // ================= 敵：トゲコロ（トゲ玉。踏めない）=================
  {
    const g = new Geo();
    g.sphere(T(0, 0, 0, 0.66, 0.66, 0.66), (p) => mixc(COL.spikeDk, COL.spike, p[1] * 0.4 + 0.6), 16, 12);
    for (const q of fibPoints(26)) {
      const m = alignY([q[0] * 0.55, q[1] * 0.55, q[2] * 0.55], q, 0.17, 0.52, 0.17);
      g.cyl(m, (p) => (p[1] > 0.62 ? COL.spikeTip : mixc(COL.spike, hex(0x8a8ca8), p[1])), 7, { top: 0, caps: false });
    }
    Models.spiky = g.mesh();
  }
  // ---- 影・粒・輪（他のファイルからも使う）----
  Models.shadow = new Geo().disc(T(), [0, 0, 0], 20).mesh();
  Models.puff = new Geo().sphere(T(), WHITE, 8, 6, { flat: true }).mesh();
  Models.ring = new Geo().torus(T(), WHITE, 1, 0.08, 28, 4).mesh();
  Models.cube = new Geo().box(T(), WHITE).mesh();
  Models.flag = (() => {
    const g = new Geo();
    g.cyl(T(0, 0, 0, 0.08, 3, 0.08), COL.white, 8);
    g.sphere(T(0, 3.05, 0, 0.16, 0.16, 0.16), COL.flowerY, 8, 6);
    return g.mesh();
  })();
  Models.flagCloth = new Geo().box(T(0.5, 2.6, 0, 1, 0.6, 0.05), COL.scarf).mesh();
}

// ---------- ころんを描く ----------
// P の状態を読んで、姿勢・表情・マフラーのなびきを決める
function drawPlayer() {
  if (P.inv > 0 && P.state !== 'dead' && Math.floor(P.inv * 14) % 2 === 0) return;
  const shadowPass = R.pass === 'shadow';
  const t = Game.time;
  const st = P.state;
  const air = !P.grounded && st !== 'win' && st !== 'dead';
  const ph = P.anim;
  const hsp = Math.hypot(P.vx, P.vz);
  const run = st === 'ground' && Math.abs(P.speed) > 0.3 ? clamp(Math.abs(P.speed) / PL.RUN, 0.25, 1) : 0;
  const curling = air && P.flip && Math.abs(P.flip) < TAU * 0.92;
  const poundSpin = st === 'pound' && P.stateT < 0.22;

  // ---- 体の姿勢 ----
  let lean = 0, roll = 0, twist = 0, bob = 0, sq = P.squash;
  let eyes = 'open', mouth = 'smile', earX = 0, earZ = 0;
  // 手足の位置（side=+1 が右）
  const hands = [[-0.6, 0.56, 0.04], [0.6, 0.56, 0.04]];
  const feet = [[-0.23, 0, 0, 0], [0.23, 0, 0, 0]]; // x, y, z, 角度

  if (st === 'ground' || st === 'punch') {
    // 呼吸
    sq *= 1 + Math.sin(t * 3.2) * 0.022;
    hands[0][1] += Math.sin(t * 3.2) * 0.015; hands[1][1] += Math.sin(t * 3.2) * 0.015;
    if (run) {
      const s1 = Math.sin(ph), c1 = Math.cos(ph);
      bob = Math.abs(Math.sin(ph)) * 0.11 * run;
      lean = run * 0.3;
      roll = s1 * 0.07 * run;
      twist = s1 * 0.16 * run;
      sq *= 1 + (Math.abs(c1) - 0.5) * 0.06 * run; // 一歩ごとに少し伸び縮み
      for (let i = 0; i < 2; i++) {
        const sd = i ? 1 : -1, s = sd * s1, c = sd * c1;
        feet[i][2] = s * 0.34 * run;
        feet[i][1] = Math.max(0, c) * 0.2 * run;
        feet[i][3] = -c * 0.6 * run;
        hands[i][2] = -s * 0.32 * run + 0.02;
        hands[i][1] = 0.55 + Math.abs(s) * 0.06 * run;
        hands[i][0] = sd * (0.6 - 0.05 * run);
      }
      earX = -0.35 * run + Math.sin(ph * 2) * 0.12 * run;
    } else {
      // 立ち止まり：ときどき耳がぴくっと動く
      const tw = (t % 4.3) < 0.18 ? Math.sin((t % 4.3) / 0.18 * Math.PI) * 0.3 : 0;
      earZ = tw;
    }
    if (P.stateT < 0 && P.landT > 0.5) { /* ヒップドロップ着地直後 */ sq *= 0.92; }
  }
  if (air && st !== 'pound') {
    const up = P.vy > 0;
    sq *= 1 + clamp(P.vy * 0.006, -0.06, 0.1);
    mouth = up ? 'open' : 'smile';
    if (up) {
      // 上昇中：両手を上げてばんざい、足は前後に
      hands[0] = [-0.58, 0.98, 0.0]; hands[1] = [0.58, 0.98, 0.0];
      if (P.jumpN === 2) { hands[0] = [-0.7, 0.8, -0.05]; hands[1] = [0.42, 1.05, 0.15]; }
      feet[0] = [-0.22, 0.14, 0.18, -0.5]; feet[1] = [0.22, 0.04, -0.16, 0.4];
      earX = -0.4;
    } else {
      // 落下中：手を広げて、耳がふわっと
      const fl = Math.sin(t * 22) * 0.04;
      hands[0] = [-0.7, 0.82 + fl, 0.02]; hands[1] = [0.7, 0.82 - fl, 0.02];
      feet[0] = [-0.24, 0.02, 0.08, 0.3]; feet[1] = [0.24, 0.06, -0.04, -0.2];
      earX = 0.22;
    }
    if (P.longJump) {
      // 幅とび：体を前に倒し、手を前に伸ばす
      lean = 1.15;
      hands[0] = [-0.42, 0.75, 0.42]; hands[1] = [0.42, 0.75, 0.42];
      feet[0] = [-0.22, 0.12, -0.25, 0.9]; feet[1] = [0.22, 0.12, -0.25, 0.9];
      earX = -0.6;
      mouth = 'open';
    }
    if (curling) {
      // 宙返り中は丸くなる
      hands[0] = [-0.45, 0.6, 0.38]; hands[1] = [0.45, 0.6, 0.38];
      feet[0] = [-0.2, 0.22, 0.25, -1.0]; feet[1] = [0.2, 0.22, 0.25, -1.0];
      eyes = 'happy';
      earX = -0.5;
    }
    if (P.kickT > 0) {
      // 空中キック
      feet[1] = [0.2, 0.42, 0.5, -1.2];
      hands[0] = [-0.62, 0.8, -0.1]; hands[1] = [0.55, 0.7, -0.15];
      lean = -0.25;
      eyes = 'hurt';
    }
  }
  if (st === 'pound') {
    if (poundSpin) {
      hands[0] = [-0.45, 0.62, 0.36]; hands[1] = [0.45, 0.62, 0.36];
      feet[0] = [-0.2, 0.24, 0.26, -1.0]; feet[1] = [0.2, 0.24, 0.26, -1.0];
      eyes = 'happy';
    } else {
      // 急降下：足をそろえて下へ、手は上へ
      sq *= 1.1;
      hands[0] = [-0.42, 1.08, -0.05]; hands[1] = [0.42, 1.08, -0.05];
      feet[0] = [-0.13, -0.04, 0, 0.15]; feet[1] = [0.13, -0.04, 0, 0.15];
      eyes = 'hurt';
      earX = 0.5;
    }
  }
  if (st === 'punch') {
    const k = Math.sin(clamp(P.stateT / 0.32, 0, 1) * Math.PI);
    hands[1] = [0.28 - k * 0.08, 0.66, 0.12 + k * 0.62];
    hands[0] = [-0.55, 0.58, -0.18 * k];
    twist = -k * 0.45;
    lean = 0.22 * k;
    mouth = 'open';
    feet[0][2] = -0.12 * k; feet[1][2] = 0.14 * k;
  }
  if (st === 'hurt' || st === 'dead') {
    const fl = Math.sin(t * 30) * 0.06;
    lean = -0.35;
    hands[0] = [-0.72, 0.95 + fl, 0.05]; hands[1] = [0.72, 0.95 - fl, 0.05];
    feet[0] = [-0.25, 0.1, 0.18, -0.6]; feet[1] = [0.25, 0.05, 0.1, -0.4];
    eyes = 'hurt'; mouth = 'open'; earX = 0.4;
  }
  if (st === 'win') {
    // 勝利ポーズ：ぴょんぴょん跳ねて、両手を上げる
    const hop = Math.abs(Math.sin(ph * 0.75));
    bob = hop * 0.32;
    sq *= 1 + (hop - 0.5) * 0.14;
    const w = Math.sin(ph * 2) * 0.08;
    hands[0] = [-0.52, 1.18 - w, 0.08]; hands[1] = [0.52, 1.18 + w, 0.08];
    feet[0] = [-0.22, hop * 0.06, 0.05, -0.3 * hop]; feet[1] = [0.22, hop * 0.06, 0.05, -0.3 * hop];
    eyes = 'happy'; mouth = 'open';
    roll = Math.sin(ph * 0.75) * 0.08;
    earX = -0.2 * hop; earZ = 0.15 * hop;
  }
  if (P.crouching) {
    sq = Math.min(sq, 0.74);
    hands[0] = [-0.55, 0.34, 0.2]; hands[1] = [0.55, 0.34, 0.2];
    earX = 0.7;
  }

  // ---- 体の行列 ----
  const m = M4.ident();
  M4.translate(m, P.x, P.y, P.z);
  M4.rotY(m, P.yaw);
  if (P.flip && st !== 'dead') {
    // 宙返り：回りすぎないよう1回転でとめ、終わりぎわはゆっくり
    const a = Math.min(Math.abs(P.flip), TAU);
    const e = a < TAU * 0.85 ? a : TAU * 0.85 + (a - TAU * 0.85) * 0.6 + smooth((a - TAU * 0.85) / (TAU * 0.15)) * TAU * 0.06;
    M4.translate(m, 0, 0.65, 0);
    M4.rotX(m, Math.sign(P.flip) * e);
    M4.translate(m, 0, -0.65, 0);
  }
  if (st === 'dead') { M4.translate(m, 0, 0.7, 0); M4.rotZ(m, P.flip); M4.translate(m, 0, -0.7, 0); }
  M4.translate(m, 0, bob, 0);
  if (twist) M4.rotY(m, twist);
  if (lean) M4.rotX(m, lean);
  if (roll) M4.rotZ(m, roll);
  // つぶれ・伸び（体積を保つように横も変える）
  const sxz = 1 / Math.sqrt(sq);
  const body = M4.copy(m);
  M4.scale(body, sxz, sq, sxz);
  drawMesh(Models.body, body);

  // ---- 顔 ----
  if (!shadowPass) {
    // まばたき：3.4秒ごと、ときどき2回
    const bt = (t + 0.4) % 3.4, cyc = Math.floor((t + 0.4) / 3.4);
    let blink = 1;
    if (bt < 0.14) blink = 0.08 + Math.abs(bt - 0.07) / 0.07 * 0.92;
    else if (cyc % 3 === 1 && bt > 0.24 && bt < 0.38) blink = 0.08 + Math.abs(bt - 0.31) / 0.07 * 0.92;
    if (P.crouching) blink = Math.min(blink, 0.55);
    for (const sd of [-1, 1]) {
      const e = M4.copy(body);
      M4.translate(e, sd * 0.2, 0.86, 0.474);
      M4.rotY(e, sd * 0.36);
      if (eyes === 'open') {
        M4.scale(e, 1, blink, 1);
        drawMesh(Models.eye, e);
      } else if (eyes === 'happy') {
        M4.translate(e, 0, -0.01, 0.04);
        drawMesh(Models.eyeHappy, e);
      } else {
        // ぎゅっと目（> <）
        M4.translate(e, 0, 0, 0.045);
        if (sd > 0) M4.rotZ(e, Math.PI);
        drawMesh(Models.eyeX, e);
      }
    }
    const mo = M4.copy(body);
    if (mouth === 'open') {
      M4.translate(mo, 0, 0.625, 0.545);
      M4.rotX(mo, -0.25);
      drawMesh(Models.mouthOpen, mo);
    } else {
      M4.translate(mo, 0, 0.675, 0.565);
      M4.rotX(mo, -0.3);
      drawMesh(Models.mouth, mo);
    }
  }
  // ---- 耳 ----
  for (const sd of [-1, 1]) {
    const e = M4.copy(body);
    M4.translate(e, sd * 0.3, 1.1, -0.04);
    M4.rotZ(e, sd * (-0.42 - earZ));
    M4.rotX(e, -0.1 + earX);
    drawMesh(Models.ear, e);
  }
  // ---- しっぽ ----
  {
    const tl = M4.copy(body);
    M4.translate(tl, 0, 0.34, -0.53);
    M4.rotY(tl, Math.sin(t * (run ? 14 : 5)) * 0.3);
    drawMesh(Models.tail, tl);
  }
  // ---- 足 ----
  for (let i = 0; i < 2; i++) {
    const f = M4.copy(m);
    const [fx, fy, fz, fa] = feet[i];
    M4.translate(f, fx, fy, fz);
    if (fa) M4.rotX(f, fa);
    M4.scale(f, Math.min(1.1, sxz), 1, 1);
    drawMesh(Models.foot, f);
  }
  // ---- 手（体のつぶれに合わせて高さも動かす）----
  for (let i = 0; i < 2; i++) {
    const hd = M4.copy(m);
    const [hx, hy, hz] = hands[i];
    M4.translate(hd, hx * sxz, hy * sq, hz);
    drawMesh(Models.hand, hd);
  }
  // ---- マフラーのしっぽ（2本。速さと落下でなびく）----
  {
    const wind = clamp(hsp / PL.RUN, 0, 1) + (air ? clamp(Math.abs(P.vy) / 20, 0, 0.7) : 0);
    for (const sd of [-1, 1]) {
      const fl1 = Math.sin(t * 13 + sd) * (0.08 + wind * 0.14);
      const fl2 = Math.sin(t * 15 + 1.3 + sd) * (0.12 + wind * 0.22);
      const s = M4.copy(body);
      M4.translate(s, 0.2 + sd * 0.05, 0.47, -0.6);
      M4.rotY(s, 0.25 + sd * 0.22);
      M4.rotZ(s, sd * 0.12);
      M4.rotX(s, 0.25 + wind * 1.05 + fl1);
      drawMesh(Models.scarfTail, s);
      M4.translate(s, 0, -0.28, 0);
      M4.rotX(s, 0.1 + wind * 0.35 + fl2);
      M4.scale(s, 0.92, 0.85, 1);
      drawMesh(Models.scarfTail, s);
    }
  }
}

// 丸い影を地面に落とす（着地位置の目安。本物の影と重なるので控えめ）
function drawShadow(x, y, z, r, a = 0.32) {
  if (R.pass === 'shadow') return;
  const g = groundBelow(x, z, y + 0.2, 0);
  if (!g) return;
  const h = y - g.y;
  const k = clamp(1 - h / 14, 0.25, 1);
  Sprites.add(x, g.y + 0.03, z, r * 1.25 * (0.6 + 0.4 * k), 3, 0.12, 0.1, 0.2, a * k * 0.8);
}

// ---------- 粒子 ----------
// 種類：ふつうの粒（土ぼこり）／光る粒（emit）／星（star）／輪（ring）／閃光（flash）
const Fx = {
  list: [],
  add(o) { if (this.list.length < 400) this.list.push(o); },
  dust(x, y, z, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 1 + Math.random() * 2;
      this.add({ x: x + Math.cos(a) * 0.3, y: y + 0.12, z: z + Math.sin(a) * 0.3, vx: Math.cos(a) * s, vy: 0.8 + Math.random() * 1.4, vz: Math.sin(a) * s, life: 0.55, max: 0.55, size: 0.2 + Math.random() * 0.14, col: [0.96, 0.92, 0.84], grav: -1.5, alpha: 0.55, drag: 3 });
    }
  },
  skid(x, y, z) { if (Math.random() < 0.5) this.dust(x, y, z, 1); },
  burst(x, y, z, col, n, sp) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, b = Math.random() * Math.PI - Math.PI / 2, s = sp * (0.5 + Math.random() * 0.7);
      this.add({ x, y, z, vx: Math.cos(a) * Math.cos(b) * s, vy: Math.sin(b) * s + 2, vz: Math.sin(a) * Math.cos(b) * s, life: 0.6, max: 0.6, size: 0.12 + Math.random() * 0.1, col, grav: 10, alpha: 1, emit: 1, star: i % 3 === 0, drag: 1.5, rot: Math.random() * TAU });
    }
    // はじける瞬間の光
    this.add({ flash: true, x, y, z, life: 0.22, max: 0.22, size: 0.5 + sp * 0.12, col: mixc(col, [1, 1, 1], 0.5) });
    if (n >= 10) this.add({ ring: true, air: true, x, y, z, life: 0.35, max: 0.35, size: 0.3, col: mixc(col, [1, 1, 1], 0.4) });
  },
  sparkle(x, y, z, col) {
    this.add({ x: x + (Math.random() - 0.5), y: y + (Math.random() - 0.5), z: z + (Math.random() - 0.5), vx: 0, vy: 0.8, vz: 0, life: 0.7, max: 0.7, size: 0.1, col, grav: 0, alpha: 1, emit: 1, star: true, rot: Math.random() * TAU });
  },
  ring(x, y, z) { this.add({ ring: true, x, y, z, life: 0.45, max: 0.45, size: 0.5, col: [1, 0.97, 0.9] }); },
  update(dt) {
    for (const p of this.list) {
      p.life -= dt;
      if (p.ring || p.flash) continue;
      p.vy -= p.grav * dt;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vz *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    }
    this.list = this.list.filter((p) => p.life > 0);
  },
  draw() {
    for (const p of this.list) {
      const k = p.life / p.max;
      const c = p.col;
      if (p.ring) {
        const r = p.size + (1 - k) * (p.air ? 1.8 : 3.5);
        Sprites.add(p.x, p.y + 0.06, p.z, r, 4, c[0], c[1], c[2], k * 0.9);
        if (p.air) Sprites.add(p.x, p.y, p.z, r * 0.8, 1, c[0], c[1], c[2], k * 0.25);
      } else if (p.flash) {
        Sprites.add(p.x, p.y, p.z, p.size * (1.2 + (1 - k) * 1.5), 1, c[0], c[1], c[2], k * 0.6);
      } else if (p.emit) {
        const s = p.size * (0.5 + 0.5 * k);
        const a = p.alpha * Math.min(1, k * 2.5);
        if (p.star) Sprites.add(p.x, p.y, p.z, s * 3.6, 2, c[0], c[1], c[2], a, (p.rot || 0) + (1 - k) * 2);
        else Sprites.add(p.x, p.y, p.z, s * 2.4, 1, c[0], c[1], c[2], a);
      } else {
        // 土ぼこり：ふくらみながら消える
        const s = p.size * (0.7 + (1 - k) * 1.1);
        Sprites.add(p.x, p.y, p.z, s * 1.5, 0, c[0], c[1], c[2], p.alpha * Math.min(1, k * 1.8) * 0.85);
      }
    }
    this.drawGlows();
    Sprites.flush();
  },
  // ひかりの種・ハートのまわりの光（75_entities.js の描く位置に合わせる）
  drawGlows() {
    if (typeof Level === 'undefined') return;
    const t = Game.time;
    for (const s of Level.seeds) {
      if (s.got || s.hidden) continue;
      const y = s.y + Math.sin(s.t * 2) * 0.2;
      const pulse = 0.85 + Math.sin(s.t * 4) * 0.15;
      Sprites.add(s.x, y + 0.75, s.z, 2.2 * pulse, 1, 0.4, 1, 0.85, 0.32);
      Sprites.add(s.x, y + 0.8, s.z, 2.0, 2, 0.8, 1, 0.95, 0.3, t * 0.6);
      Sprites.add(s.x, y + 0.8, s.z, 1.5, 2, 0.8, 1, 0.95, 0.2, -t * 0.9 + 0.7);
      const g = groundBelow(s.x, s.z, s.y + 0.5, 0);
      if (g) {
        Sprites.add(s.x, g.y + 0.05, s.z, 1.4 * pulse, 5, 0.4, 1, 0.85, 0.4);
        const rk = (t * 0.7 + s.id * 0.3) % 1;
        Sprites.add(s.x, g.y + 0.06, s.z, 0.4 + rk * 1.0, 4, 0.6, 1, 0.9, (1 - rk) * 0.6);
      }
    }
    for (const h of Level.hearts) {
      if (h.got) continue;
      Sprites.add(h.x, h.y + Math.sin(h.t) * 0.15, h.z, 1.1, 1, 1, 0.45, 0.55, 0.3);
    }
  },
};

// ===== 70_level.js =====
// ステージ「そよかぜ空島」：当たり判定と見た目を同時に組み立てる
const Level = {
  static: null,     // まとめた地形メッシュ
  water: null,
  clouds: [],
  acorns: [], seeds: [], hearts: [], enemies: [], movers: [], springs: [],
  start: { x: 0, y: 0, z: 16, yaw: Math.PI },
  seedTotal: 0, acornTotal: 0,
  signs: [],
};

function buildLevel() {
  World.clear();
  World.killY = -28;
  Object.assign(Level, { acorns: [], seeds: [], hearts: [], enemies: [], movers: [], springs: [], signs: [], clouds: [] });
  const g = new Geo(0.09);
  const rng = makeRng(20261125);

  // ---------- 部品 ----------
  const grassCol = (p, n) => (n[1] > 0.5 ? mixc(COL.grassDk, COL.grass, 0.5 + 0.5 * Math.sin(p[0] * 3.1 + p[2] * 2.3)) : p[1] > 0.75 ? COL.grassDk : COL.dirt);
  const dirtCol = (p) => mixc(COL.dirtDk, COL.dirt, clamp(p[1], 0, 1));

  function island(x, z, r, top, depth = 7) {
    World.cyl(x, z, r, top - depth * 0.6, top, 'grass');
    g.cyl(T(x, top - 0.7, z, r, 0.7, r), grassCol, 32);
    g.cyl(T(x, top - 0.7 - depth, z, r, depth, r), dirtCol, 32, { bottom: 0.18, top: 0.98, caps: false, flat: true });
  }
  function block(cx, cy, cz, sx, sy, sz, kind = 'grass') {
    const s = World.boxC(cx, cy, cz, sx, sy, sz, kind);
    g.box(T(cx, cy, cz, sx, sy, sz), kindColor(kind, sy));
    return s;
  }
  function kindColor(kind) {
    if (kind === 'stone') return (p, n) => (n[1] > 0.5 ? COL.stone : mixc(COL.stoneDk, COL.stone, p[1] + 0.5));
    if (kind === 'wood') return (p, n) => (n[1] > 0.5 ? COL.wood : COL.woodDk);
    if (kind === 'ice') return (p, n) => (n[1] > 0.5 ? COL.ice : shade(COL.ice, 0.85));
    return (p, n) => (n[1] > 0.5 ? COL.grass : p[1] > 0.3 ? COL.grassDk : COL.dirt);
  }
  function stump(x, z, r, top) {
    World.cyl(x, z, r, top - 30, top, 'wood');
    g.cyl(T(x, top - 30, z, r, 30, r), (p, n) => (n[1] > 0.5 ? mixc(COL.wood, hex(0xe9c08a), 0.5) : COL.woodDk), 18, { flat: true });
    // 年輪
    g.cyl(T(x, top, z, r * 0.6, 0.02, r * 0.6), shade(COL.wood, 0.9), 18);
  }
  function tree(x, y, z, s = 1) {
    World.cyl(x, z, 0.45 * s, y, y + 3.2 * s, 'wood');
    g.cyl(T(x, y, z, 0.35 * s, 3.2 * s, 0.35 * s), COL.trunk, 8, { top: 0.7, flat: true });
    const leaf = (p) => mixc(COL.leafDk, COL.leaf, clamp(p[1] * 0.5 + 0.5, 0, 1));
    g.sphere(T(x, y + 3.6 * s, z, 1.6 * s, 1.4 * s, 1.6 * s), leaf, 10, 7, { flat: true });
    g.sphere(T(x + 0.8 * s, y + 3.0 * s, z + 0.4 * s, 1.0 * s, 0.9 * s, 1.0 * s), leaf, 8, 6, { flat: true });
    g.sphere(T(x - 0.7 * s, y + 3.2 * s, z - 0.5 * s, 1.0 * s, 0.9 * s, 1.0 * s), leaf, 8, 6, { flat: true });
    // 木の上にも乗れる
    World.cyl(x, z, 1.3 * s, y + 4.4 * s, y + 4.9 * s, 'grass').noCam = true;
  }
  function pine(x, y, z, s = 1) {
    World.cyl(x, z, 0.4 * s, y, y + 4 * s, 'wood');
    g.cyl(T(x, y, z, 0.3 * s, 1.2 * s, 0.3 * s), COL.trunk, 6);
    for (let i = 0; i < 3; i++) {
      g.cyl(T(x, y + (1 + i * 1.1) * s, z, (1.6 - i * 0.4) * s, 1.8 * s, (1.6 - i * 0.4) * s), (p) => mixc(COL.leafDk, COL.leaf, p[1]), 8, { top: 0, flat: true });
    }
  }
  function rock(x, y, z, s) {
    World.cyl(x, z, s * 0.9, y - 1, y + s * 0.9, 'stone');
    g.sphere(T(x, y, z, s, s * 0.9, s * 0.95, rng() * 3), (p) => mixc(COL.stoneDk, COL.stone, p[1] * 0.5 + 0.5), 7, 5, { flat: true });
  }
  function flower(x, y, z) {
    const c = [COL.flowerR, COL.flowerY, COL.flowerW][Math.floor(rng() * 3)];
    g.cyl(T(x, y, z, 0.03, 0.35, 0.03), COL.leafDk, 4, { caps: false });
    g.sphere(T(x, y + 0.38, z, 0.12, 0.07, 0.12), c, 6, 4, { flat: true });
    g.sphere(T(x, y + 0.4, z, 0.05, 0.05, 0.05), COL.flowerY, 4, 3);
  }
  function tuft(x, y, z) {
    for (let i = 0; i < 3; i++) {
      const a = rng() * TAU;
      g.cyl(T(x + Math.cos(a) * 0.12, y, z + Math.sin(a) * 0.12, 0.07, 0.3 + rng() * 0.2, 0.07, a, (rng() - 0.5) * 0.5), COL.grassDk, 3, { top: 0, flat: true, caps: false });
    }
  }
  function fence(x0, z0, x1, z1, y) {
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, z1 - z0) / 1.6));
    const ang = Math.atan2(x1 - x0, z1 - z0);
    for (let i = 0; i <= n; i++) {
      const x = lerp(x0, x1, i / n), z = lerp(z0, z1, i / n);
      g.box(T(x, y + 0.5, z, 0.18, 1, 0.18), COL.woodDk);
    }
    const len = Math.hypot(x1 - x0, z1 - z0);
    g.box(T((x0 + x1) / 2, y + 0.75, (z0 + z1) / 2, 0.1, 0.12, len, ang), COL.wood);
    g.box(T((x0 + x1) / 2, y + 0.4, (z0 + z1) / 2, 0.1, 0.12, len, ang), COL.wood);
    // 柵は低い壁として当たり判定
    const s = World.add({ type: 'box', x0: Math.min(x0, x1) - 0.1, x1: Math.max(x0, x1) + 0.1, z0: Math.min(z0, z1) - 0.1, z1: Math.max(z0, z1) + 0.1, y0: y, y1: y + 0.9, kind: 'wood' });
    s.noCam = true;
  }
  const acornAt = (x, y, z) => Level.acorns.push({ x, y: y + 0.6, z, got: false, t: rng() * TAU });
  const acornLine = (x0, y0, z0, x1, y1, z1, n) => { for (let i = 0; i < n; i++) { const t = n === 1 ? 0 : i / (n - 1); acornAt(lerp(x0, x1, t), lerp(y0, y1, t), lerp(z0, z1, t)); } };
  const acornRing = (x, y, z, r, n) => { for (let i = 0; i < n; i++) { const a = (i / n) * TAU; acornAt(x + Math.cos(a) * r, y, z + Math.sin(a) * r); } };
  const seedAt = (id, x, y, z, name, hidden = false) => Level.seeds.push({ id, x, y: y + 1.0, z, name, got: false, hidden, t: 0 });
  const heartAt = (x, y, z) => Level.hearts.push({ x, y: y + 0.8, z, got: false, t: rng() * TAU });
  const blobAt = (x, y, z, range = 5) => Level.enemies.push({ type: 'blob', x, y, z, hx: x, hz: z, range, yaw: rng() * TAU, vy: 0, alive: true, t: rng() * 5, state: 'walk', st: 0, squish: 1 });
  const spikyAt = (ax, ay, az, bx, by, bz, speed = 5) => Level.enemies.push({ type: 'spiky', ax, ay, az, bx, by, bz, speed, u: 0, dir: 1, x: ax, y: ay, z: az, alive: true, rot: 0 });

  // ================= 中央の島（はじまりの草原） =================
  island(0, 0, 28, 0, 10);
  // 小さな池（氷のように滑る… ではなく見た目の水たまり）
  g.cyl(T(9, 0.01, 6, 3.2, 0.02, 2.4), hex(0x6fd0ff), 20);

  // 木と飾り
  tree(-6, 0, 12, 1.0); tree(10, 0, 14, 0.9); tree(16, 0, -4, 1.1); tree(-18, 0, 12, 1.2); tree(20, 0, 8, 0.8);
  pine(-22, 0, -6, 1.1); pine(-17, 0, -15, 0.9); pine(14, 0, -16, 1.0); pine(22, 0, -12, 0.8);
  rock(4, 0, 20, 1.2); rock(-12, 0, 20, 0.9); rock(18, 0, 18, 1.4); rock(-24, 0, 4, 1.0);
  for (let i = 0; i < 90; i++) {
    const a = rng() * TAU, r = 3 + rng() * 23;
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x, z + 16) < 7) continue; // 塔の周り
    if (Math.hypot(x + 12, z + 2) < 6) continue; // 切り株の周り

// 動く足場・ばねなどの更新
function updateLevel(dt) {
  for (const s of World.solids) { s.dx = s.dy = s.dz = 0; }
  for (const mv of Level.movers) {
    mv.t += dt * mv.speed;
    const k = 0.5 - 0.5 * Math.cos(mv.t * Math.PI); // 0〜1 往復
    const s = mv.s;
    const cx = (s.x0 + s.x1) / 2, cy = (s.y0 + s.y1) / 2, cz = (s.z0 + s.z1) / 2;
    if (mv.axis === 'x') World.move(s, lerp(mv.ax, mv.bx, k) - cx, 0, 0);
    if (mv.axis === 'z') World.move(s, 0, 0, lerp(mv.az, mv.bz, k) - cz);
    if (mv.axis === 'y') World.move(s, 0, lerp(mv.ay, mv.by, k) - cy, 0);
  }
  for (const s of Level.springs) s.boing = Math.max(0, (s.boing || 0) - dt * 3);
}

function drawLevel() {
  // 空
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  drawMesh(Models.sky, T(R.cam[0], R.cam[1], R.cam[2], 300, 300, 300), WHITE, 1, 1);
  gl.enable(gl.CULL_FACE);
  gl.depthMask(true);
  drawMesh(Level.cloudMesh, T(), WHITE, 0.55, 1);
  drawMesh(Level.static, M4.ident());
  for (const mv of Level.movers) {
    const s = mv.s;
    drawMesh(mv.mesh, T((s.x0 + s.x1) / 2, (s.y0 + s.y1) / 2, (s.z0 + s.z1) / 2));
  }
  for (const s of Level.springs) {
    const b = s.boing || 0;
    drawMesh(Models.spring, T((s.x0 + s.x1) / 2, s.y0, (s.z0 + s.z1) / 2, 1, 1 + Math.sin(b * 12) * b * 0.6, 1));
  }
}

// アイテム・敵の動き
function updateEntities(dt) {
  const px = P.x, py = P.y + 0.65, pz = P.z;
  const alive = P.state !== 'dead' && P.state !== 'win';

  // どんぐり
  for (const a of Level.acorns) {
    if (a.got) continue;
    a.t += dt * 3;
    if (alive && Math.abs(a.x - px) < 1 && Math.abs(a.z - pz) < 1 && Math.abs(a.y - py) < 1.2) {
      const d = Math.hypot(a.x - px, a.y - py, a.z - pz);
      if (d < 1.05) {
        a.got = true;
        Game.acorns++;
        Sound.play('acorn');
        Fx.burst(a.x, a.y, a.z, [1, 0.85, 0.4], 6, 3);
        if (Game.acorns === 50) Game.revealSeed(5);
      }
    }
  }
  // ハート
  for (const h of Level.hearts) {
    if (h.got) continue;
    h.t += dt * 2;
    if (alive && Math.hypot(h.x - px, h.y - py, h.z - pz) < 1.2) {
      h.got = true;
      P.hp = P.maxHp;
      Sound.play('heart');
      Fx.burst(h.x, h.y, h.z, COL.heart, 10, 4);
      Game.toast('ハートで元気いっぱい！');
    }
  }
  // ひかりの種
  for (const s of Level.seeds) {
    if (s.got || s.hidden) continue;
    s.t += dt;
    if (Math.random() < dt * 8) Fx.sparkle(s.x, s.y + 0.7, s.z, [0.8, 1, 0.95]);
    if (alive && Math.hypot(s.x - px, s.y + 0.6 - py, s.z - pz) < 1.5) {
      s.got = true;
      Game.getSeed(s);
    }
  }

  // 敵
  for (const e of Level.enemies) {
    if (!e.alive) {
      e.deadT = (e.deadT || 0) + dt;
      continue;
    }
    if (e.type === 'blob') updateBlob(e, dt);
    else if (e.type === 'spiky') updateSpiky(e, dt);
  }
}

function updateBlob(e, dt) {
  e.t += dt;
  e.squish = lerp(e.squish, 1, dt * 8);
  const dx = P.x - e.x, dz = P.z - e.z;
  const dist = Math.hypot(dx, dz);
  const dy = P.y - e.y;
  // 見つけたら追いかける
  const chase = dist < 9 && Math.abs(dy) < 3 && P.state !== 'dead';
  let speed = 1.6;
  let want = e.yaw;
  if (chase) {
    want = Math.atan2(dx, dz);
    speed = 3.6;
    if (e.state !== 'chase') { e.state = 'chase'; e.vy = 5; e.squish = 1.3; }
  } else {
    e.state = 'walk';
    const hx = e.hx - e.x, hz = e.hz - e.z;
    if (Math.hypot(hx, hz) > e.range) want = Math.atan2(hx, hz);
    else if (Math.sin(e.t * 0.7) > 0.95) want = e.yaw + 0.05;
  }
  e.yaw += clamp(angDiff(e.yaw, want), -dt * 4, dt * 4);
  const nx = e.x + Math.sin(e.yaw) * speed * dt;
  const nz = e.z + Math.cos(e.yaw) * speed * dt;
  // 崖から落ちないように：進む先に地面がなければ止まる
  const gAhead = groundBelow(nx + Math.sin(e.yaw) * 0.6, nz + Math.cos(e.yaw) * 0.6, e.y + 0.5, 0);
  if (gAhead && Math.abs(gAhead.y - e.y) < 0.6) {
    const homeD = Math.hypot(nx - e.hx, nz - e.hz);
    if (homeD < e.range + 6) { e.x = nx; e.z = nz; }
  } else if (!chase) e.yaw += Math.PI * 0.5;
  // 重力
  e.vy -= 30 * dt;
  e.y += e.vy * dt;
  const g = groundBelow(e.x, e.z, e.y + 0.5, 0.3);
  if (g && e.y <= g.y) { e.y = g.y; e.vy = 0; if (g.s.dx || g.s.dz || g.s.dy) { e.x += g.s.dx; e.z += g.s.dz; } }
  if (e.y < World.killY) e.alive = false;
  // 主人公との当たり
  if (P.state === 'dead' || P.inv > 0.0 && P.state === 'hurt') return;
  const r = 0.62 + P.r;
  const pd = Math.hypot(P.x - e.x, P.z - e.z);
  if (pd < r && P.y < e.y + 1.2 && P.y + P.h > e.y) {
    const stomp = (P.vy < 0 && P.y > e.y + 0.55) || P.state === 'pound';
    const hitting = P.state === 'punch' && P.stateT < 0.25 || P.kickT > 0;
    if (stomp) {
      killEnemy(e, 'stomp');
      if (P.state !== 'pound') { P.vy = Input.jump ? 17 : 12; P.state = 'air'; P.jumpHeld = true; P.grounded = false; }
    } else if (hitting) {
      killEnemy(e, 'punch');
    } else if (P.inv <= 0) {
      playerHurt(e.x, e.z);
    }
  } else if (pd < r + 0.9 && P.state === 'punch' && P.stateT < 0.25) {
    // パンチは少し先まで届く
    const fx = Math.sin(P.yaw), fz = Math.cos(P.yaw);
    if ((e.x - P.x) * fx + (e.z - P.z) * fz > 0 && Math.abs(P.y - e.y) < 1.2) killEnemy(e, 'punch');
  }
}

function killEnemy(e, how) {
  e.alive = false;
  e.deadT = 0;
  e.how = how;
  Sound.play('stomp');
  Fx.burst(e.x, e.y + 0.5, e.z, COL.enemy, 14, 6);
  Game.shake = 0.12;
  // 倒すとどんぐりが出る
  Level.acorns.push({ x: e.x, y: e.y + 0.8, z: e.z, got: false, t: 0, bonus: true });
  Level.acornTotal++;
}

function updateSpiky(e, dt) {
  const len = Math.hypot(e.bx - e.ax, e.bz - e.az);
  e.u += (e.speed / len) * dt * e.dir;
  if (e.u > 1) { e.u = 1; e.dir = -1; }
  if (e.u < 0) { e.u = 0; e.dir = 1; }
  e.x = lerp(e.ax, e.bx, e.u);
  e.z = lerp(e.az, e.bz, e.u);
  const g = groundBelow(e.x, e.z, Math.max(e.ay, e.by) + 2, 0);
  e.y = (g ? g.y : lerp(e.ay, e.by, e.u)) + 0.75;
  e.rot += (e.speed / 0.75) * dt * e.dir;
  e.yaw = Math.atan2(e.bx - e.ax, e.bz - e.az);
  if (P.state === 'dead') return;
  const d = Math.hypot(P.x - e.x, P.y + 0.6 - e.y, P.z - e.z);
  if (d < 0.9 + P.r) playerHurt(e.x, e.z);
}

// ヒップドロップの衝撃：近くの敵を倒す
function poundShock(x, y, z) {
  for (const e of Level.enemies) {
    if (!e.alive || e.type !== 'blob') continue;
    if (Math.hypot(e.x - x, e.z - z) < 2.6 && Math.abs(e.y - y) < 1) killEnemy(e, 'pound');
  }
}

function drawEntities() {
  const t = Game.time;
  for (const a of Level.acorns) {
    if (a.got) continue;
    drawMesh(Models.acorn, T(a.x, a.y + Math.sin(a.t) * 0.12, a.z, 1.2, 1.2, 1.2, a.t * 1.3));
    drawShadow(a.x, a.y, a.z, 0.3, 0.2);
  }
  for (const h of Level.hearts) {
    if (h.got) continue;
    drawMesh(Models.heart, T(h.x, h.y + Math.sin(h.t) * 0.15, h.z, 1.3, 1.3, 1.3, h.t), WHITE, 0.25);
    drawShadow(h.x, h.y, h.z, 0.4, 0.2);
  }
  for (const s of Level.seeds) {
    if (s.got || s.hidden) continue;
    const pulse = 1 + Math.sin(s.t * 4) * 0.06;
    drawMesh(Models.seed, T(s.x, s.y + Math.sin(s.t * 2) * 0.2, s.z, pulse, pulse, pulse, s.t * 1.5), WHITE, 0.55);
    drawShadow(s.x, s.y, s.z, 0.7, 0.25);
  }
  for (const e of Level.enemies) {
    if (!e.alive) {
      if (e.deadT < 0.3 && e.type === 'blob') {
        const k = 1 - e.deadT / 0.3;
        drawMesh(Models.blob, T(e.x, e.y, e.z, 1 + (1 - k) * 0.6, k * 0.3 + 0.05, 1 + (1 - k) * 0.6, e.yaw));
      }
      continue;
    }
    if (e.type === 'blob') {
      const wob = 1 + Math.sin(e.t * (e.state === 'chase' ? 14 : 7)) * 0.06;
      const sq = e.squish * wob;
      drawMesh(Models.blob, T(e.x, e.y, e.z, 1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq), e.yaw));
      drawShadow(e.x, e.y + 0.1, e.z, 0.7);
    } else {
      const m = T(e.x, e.y, e.z, 1, 1, 1, e.yaw);
      M4.rotX(m, e.rot);
      drawMesh(Models.spiky, m);
      drawShadow(e.x, e.y - 0.6, e.z, 0.75);
    }
  }
  void t;
}

const Game = {

    camReset();
    this.state = 'play'; this.stT = 0;
    this.toast('ひかりの種を ' + Level.seedTotal + ' こ 集めよう！', 4);
  },
  toast(msg, dur = 2.6) { this.toasts.push({ msg, t: 0, dur }); if (this.toasts.length > 3) this.toasts.shift(); },
  getSeed(s) {
    this.seeds++;
    this.lastSeed = s;
    Sound.play('seed');
    Fx.burst(s.x, s.y + 0.7, s.z, [0.7, 1, 0.95], 30, 8);
    P.hp = P.maxHp;
    if (this.seeds >= Level.seedTotal) {
      this.state = 'clear'; this.stT = 0;
      P.state = 'win'; P.vx = P.vz = 0;
      setTimeout(() => Sound.play('clear'), 600);
      const t = this.playTime;
      if (!this.best || t < this.best) { this.best = t; localStorage.setItem('koron-best', String(t)); this.newRecord = true; }
      else this.newRecord = false;
    } else {
      this.state = 'seed'; this.stT = 0;
      P.state = 'win';
    }
  },
  revealSeed(id) {
    const s = Level.seeds.find((q) => q.id === id);
    if (!s || !s.hidden) return;
    s.hidden = false;
    Sound.play('seed');
    Fx.burst(s.x, s.y + 0.7, s.z, [0.7, 1, 0.95], 24, 6);
    this.toast('どんぐり50こ！ スタート地点に ひかりの種が あらわれた！', 4);
  },
  onFall() {
    if (P.state === 'dead') return;
    Sound.play('fall');
    P.hp -= 1;
    if (P.hp <= 0) { playerDie(); return; }
    playerReset(P.safe[0], P.safe[1] + 0.2, P.safe[2], P.yaw);
    P.inv = 2;
    camReset();
    this.toast('落っこちた！', 1.6);
  },
  onDeath() { this.state = 'dead'; this.stT = 0; },
  onPound(x, y, z) { poundShock(x, y, z); },
};

// 敵やアイテムを初期状態に戻す（ステージを作り直す）
function buildLevelState() {
  buildLevel();
}

function fmtTime(t) {
  const m = Math.floor(t / 60), s = Math.floor(t % 60), cs = Math.floor((t * 100) % 100);
  return `${m}:${String(s).padStart(2, '0')}.${String(cs).padStart(2, '0')}`;
}

// ---------------- 更新 ----------------
function update(dt) {
  Game.time += dt;
  Game.stT += dt;
  Game.shake = Math.max(0, Game.shake - dt);
  for (const t of Game.toasts) t.t += dt;
  Game.toasts = Game.toasts.filter((t) => t.t < t.dur);

  if (Game.state === 'title') {
    titleCamera(dt);
    updateLevel(dt);
    if (Input.anyP && Game.stT > 0.3) { Sound.play('select'); Game.newGame(); }
    return;
  }
  if (Game.state === 'pause') {
    if (Input.pauseP || Input.jumpP) { Game.state = 'play'; }
    return;
  }
  if (Input.pauseP && Game.state === 'play') { Game.state = 'pause'; return; }

  if (Game.state === 'play') Game.playTime += dt;

  if (Game.state === 'play' || Game.state === 'dead') {
    updateLevel(dt);
    updatePlayer(dt);
    updateEntities(dt);
    updateCamera(dt);
  } else if (Game.state === 'seed' || Game.state === 'clear') {
    updatePlayer(dt);
    // 種を取った演出：カメラが正面に回る
    const a = P.yaw;
    const d = 5.5;
    Cam.override = {
      eye: [P.x + Math.sin(a) * d, P.y + 2.2, P.z + Math.cos(a) * d],
      target: [P.x, P.y + 1, P.z],
    };
    updateCamera(dt);
    if (Game.state === 'seed' && Game.stT > 2.6) {
      Cam.override = null;
      P.state = 'ground';
      Game.state = 'play';
      Game.toast(`ひかりの種 ${Game.seeds} / ${Level.seedTotal}`, 2.5);
    }
    if (Game.state === 'clear' && Game.stT > 3 && Input.anyP) {
      Cam.override = null;
      Game.state = 'title'; Game.stT = 0;
    }
  }
  if (Game.state === 'dead' && Game.stT > 2.2) {
    if (Input.anyP || Game.stT > 6) {
      // その場の進み具合は残して、スタート地点から再開
      P.hp = P.maxHp;
      const s = Level.start;
      playerReset(s.x, s.y, s.z, s.yaw);
      P.inv = 1.5;
      camReset();
      Game.state = 'play';
    }
  }
  Fx.update(dt);
}

function titleCamera(dt) {
  const a = Game.time * 0.08;
  Cam.override = null;
  Cam.eye = [Math.sin(a) * 46, 22 + Math.sin(a * 0.7) * 4, Math.cos(a) * 46];
  Cam.target = [0, 4, -4];
}

// ---------------- 描画 ----------------
function render() {
  if (!R.ok) return;
  beginFrame(Cam.eye, Cam.target || [0, 0, 0], Cam.fov);
  drawLevel();
  if (Game.state !== 'title') drawPlayer();
  drawEntities();
  // 半透明もの（影・粒）
  setBlend(true);
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(-2, -2);
  if (Game.state !== 'title' && P.state !== 'dead') drawShadow(P.x, P.y, P.z, 0.55, 0.38);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  Fx.draw();
  setBlend(false);
}

// ---------------- 画面の文字・ボタン ----------------
let hudW = 0, hudH = 0, hudDpr = 1;
function resizeHud() {
  hudDpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  if (w !== hudW || h !== hudH || hudCanvas.width !== Math.floor(w * hudDpr)) {
    hudW = w; hudH = h;
    hudCanvas.width = Math.floor(w * hudDpr);
    hudCanvas.height = Math.floor(h * hudDpr);
    layoutTouch(w, h);
  }
}

function txt(s, x, y, size, color = '#fff', align = 'left', stroke = 'rgba(30,40,70,.85)') {
  hud.font = `bold ${size}px "Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif`;
  hud.textAlign = align;
  hud.textBaseline = 'middle';
  hud.lineJoin = 'round';
  hud.lineWidth = Math.max(3, size * 0.2);
  hud.strokeStyle = stroke;
  hud.strokeText(s, x, y);
  hud.fillStyle = color;
  hud.fillText(s, x, y);
}

function drawHeartIcon(x, y, s, full) {
  hud.save();
  hud.translate(x, y);
  hud.scale(s / 20, s / 20);
  hud.beginPath();
  hud.moveTo(0, 6);
  hud.bezierCurveTo(-10, -2, -10, -12, 0, -6);
  hud.bezierCurveTo(10, -12, 10, -2, 0, 6);
  hud.closePath();
  hud.fillStyle = full ? '#ff4f6d' : 'rgba(255,255,255,.25)';
  hud.strokeStyle = 'rgba(30,40,70,.85)';
  hud.lineWidth = 2.5;
  hud.stroke();
  hud.fill();
  hud.restore();
}

function drawAcornIcon(x, y, s) {
  hud.save();
  hud.translate(x, y);
  hud.fillStyle = '#c98a3e'; hud.strokeStyle = 'rgba(30,40,70,.85)'; hud.lineWidth = 2;
  hud.beginPath(); hud.ellipse(0, s * 0.12, s * 0.32, s * 0.4, 0, 0, TAU); hud.fill(); hud.stroke();
  hud.fillStyle = '#7a5230';
  hud.beginPath(); hud.ellipse(0, -s * 0.18, s * 0.38, s * 0.2, 0, 0, TAU); hud.fill(); hud.stroke();
  hud.restore();
}

function drawSeedIcon(x, y, s, on) {
  hud.save();
  hud.translate(x, y);
  hud.beginPath();
  hud.moveTo(0, -s * 0.5); hud.lineTo(s * 0.32, 0); hud.lineTo(0, s * 0.5); hud.lineTo(-s * 0.32, 0); hud.closePath();
  hud.fillStyle = on ? '#9cfff0' : 'rgba(255,255,255,.22)';
  hud.strokeStyle = 'rgba(30,40,70,.85)'; hud.lineWidth = 2;
  hud.fill(); hud.stroke();
  hud.restore();
}

function drawHud() {
  resizeHud();
  hud.setTransform(hudDpr, 0, 0, hudDpr, 0, 0);
  hud.clearRect(0, 0, hudW, hudH);
  const W = hudW, H = hudH;
  const small = Math.min(W, H) < 500;
  const fs = small ? 16 : 20;

  if (!R.ok) {
    txt('この端末では 3D 表示（WebGL2）が使えません', W / 2, H / 2, 18, '#fff', 'center');
    return;
  }

  if (Game.state === 'title') {
    hud.fillStyle = 'rgba(20,40,80,.18)';
    hud.fillRect(0, 0, W, H);
    const ts = clamp(W / 14, 26, 64);
    const bob = Math.sin(Game.time * 2) * 4;
    txt('ころんの', W / 2, H * 0.26 + bob, ts * 0.6, '#fff6d8', 'center');
    txt('空島アドベンチャー', W / 2, H * 0.26 + ts * 0.85 + bob, ts, '#ffd166', 'center');
    if (Math.floor(Game.time * 2) % 2 === 0) txt(Input.touchMode || 'ontouchstart' in window ? 'タップでスタート' : 'Enter / スペースでスタート', W / 2, H * 0.62, fs + 2, '#fff', 'center');
    const lines = 'ontouchstart' in window && Input.touchMode !== false
      ? ['左側をなぞって移動 ／ 右側をドラッグでカメラ', 'ジャンプ・パンチ・しゃがむ はボタンで']
      : ['移動：WASD / 矢印　ジャンプ：スペース　パンチ：J　しゃがむ：Shift', 'カメラ：Q・E またはマウスでドラッグ　遠近：R　ポーズ：Esc'];
    lines.forEach((l, i) => txt(l, W / 2, H * 0.74 + i * (fs + 8), fs * 0.75, '#e8f4ff', 'center'));
    if (Game.best) txt('ベストクリア ' + fmtTime(Game.best), W / 2, H * 0.9, fs * 0.8, '#ffe9a8', 'center');
    return;
  }

  // 体力
  for (let i = 0; i < P.maxHp; i++) drawHeartIcon(26 + i * 34, 30, small ? 28 : 32, i < P.hp);
  // どんぐり
  drawAcornIcon(26, 70, 26);
  txt('× ' + Game.acorns, 44, 71, fs + 2);
  // 種
  for (let i = 0; i < Level.seedTotal; i++) drawSeedIcon(W / 2 - (Level.seedTotal - 1) * 14 + i * 28, 28, 26, i < Game.seeds);
  // 時間
  txt(fmtTime(Game.playTime), W - (Input.touchMode ? 70 : 20), 30, fs, '#fff', 'right');

  // メッセージ
  Game.toasts.forEach((t, i) => {
    const a = Math.min(1, t.t * 4, (t.dur - t.t) * 2);
    hud.globalAlpha = a;
    txt(t.msg, W / 2, H * 0.2 + i * (fs + 14), fs + 2, '#fff', 'center');
    hud.globalAlpha = 1;
  });

  if (Game.state === 'seed' && Game.lastSeed) {
    const k = Math.min(1, Game.stT * 3);
    txt('ひかりの種 ゲット！', W / 2, H * 0.32 - (1 - k) * 30, clamp(W / 16, 26, 52) * k, '#9cfff0', 'center');
    txt(Game.lastSeed.name, W / 2, H * 0.32 + 48, fs, '#fff', 'center');
  }
  if (Game.state === 'clear') {
    hud.fillStyle = `rgba(255,250,220,${Math.min(0.35, Game.stT * 0.2)})`;
    hud.fillRect(0, 0, W, H);
    txt('ぜんぶ 集めた！ クリア！', W / 2, H * 0.3, clamp(W / 16, 26, 54), '#ffd166', 'center');
    txt('タイム ' + fmtTime(Game.playTime) + (Game.newRecord ? '  ベスト更新！' : ''), W / 2, H * 0.3 + 56, fs + 4, '#fff', 'center');
    txt('どんぐり ' + Game.acorns + ' こ', W / 2, H * 0.3 + 92, fs, '#fff', 'center');
    if (Game.stT > 3) txt('タップ / Enter でタイトルへ', W / 2, H * 0.75, fs, '#fff', 'center');
  }
  if (Game.state === 'dead') {
    hud.fillStyle = `rgba(30,10,30,${Math.min(0.45, Game.stT * 0.3)})`;
    hud.fillRect(0, 0, W, H);
    txt('ころんは たおれてしまった…', W / 2, H * 0.38, clamp(W / 20, 22, 40), '#fff', 'center');
    if (Game.stT > 2.2) txt('タップ / Enter で スタート地点から再開', W / 2, H * 0.5, fs, '#ffe9a8', 'center');
  }
  if (Game.state === 'pause') {
    hud.fillStyle = 'rgba(20,30,60,.5)';
    hud.fillRect(0, 0, W, H);
    txt('ポーズ', W / 2, H * 0.3, 44, '#fff', 'center');
    const got = Level.seeds.filter((s) => s.got).map((s) => '◆ ' + s.name);
    const left = Level.seeds.filter((s) => !s.got).length;
    got.forEach((g, i) => txt(g, W / 2, H * 0.42 + i * (fs + 6), fs * 0.85, '#9cfff0', 'center'));
    txt('のこり ' + left + ' こ', W / 2, H * 0.42 + got.length * (fs + 6) + 10, fs * 0.85, '#fff', 'center');
    txt('ジャンプ / Esc で つづける', W / 2, H * 0.85, fs, '#ffe9a8', 'center');
  }

  // タッチ操作ボタン
  if (Input.touchMode && (Game.state === 'play' || Game.state === 'pause')) drawTouchUI();
}

function drawTouchUI() {
  hud.save();
  for (const k in Input.btns) {
    const b = Input.btns[k];
    hud.beginPath();
    hud.arc(b.x, b.y, b.r, 0, TAU);
    hud.fillStyle = b.down ? 'rgba(255,255,255,.55)' : 'rgba(255,255,255,.22)';
    hud.fill();
    hud.lineWidth = 2.5;
    hud.strokeStyle = 'rgba(255,255,255,.7)';
    hud.stroke();
    txt(b.label, b.x, b.y, k === 'pause' || k === 'camera' ? 16 : Math.max(11, b.r * 0.34), '#fff', 'center');
  }
  if (Input.stick) {
    const s = Input.stick;
    hud.beginPath(); hud.arc(s.ox, s.oy, 60, 0, TAU);
    hud.fillStyle = 'rgba(255,255,255,.15)'; hud.fill();
    hud.strokeStyle = 'rgba(255,255,255,.5)'; hud.lineWidth = 2; hud.stroke();
    let dx = s.x - s.ox, dy = s.y - s.oy; const d = Math.hypot(dx, dy);
    if (d > 60) { dx *= 60 / d; dy *= 60 / d; }
    hud.beginPath(); hud.arc(s.ox + dx, s.oy + dy, 26, 0, TAU);
    hud.fillStyle = 'rgba(255,255,255,.6)'; hud.fill();
  } else {
    txt('ここをなぞって移動', 90, hudH - 40, 13, 'rgba(255,255,255,.75)', 'center');
  }
  hud.restore();
}

// ---------------- メインループ ----------------
let lastT = performance.now();
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1;
  Game.fps = lerp(Game.fps, 1 / Math.max(dt, 1e-3), 0.05);
  pollInput();
  // 物理は細かく刻む（1/120 秒ずつ）
  const step = 1 / 120;
  let acc = dt, first = true;
  while (acc > 1e-6) {
    const h = Math.min(step, acc);
    update(h);
    if (first) { clearPressed(); first = false; }
    acc -= h;
  }
  render();
  drawHud();
  requestAnimationFrame(frame);
}

function boot() {
  try {
    initGL();
    if (R.ok) { buildModels(); buildLevel(); }
  } catch (e) {
    R.ok = false;
    console.error(e);
  }
  Cam.eye = [40, 20, 40]; Cam.target = [0, 0, 0];
  window.KORON = { Game, P, Cam, Level, World, Input, R };
  requestAnimationFrame(frame);
}
boot();

})();</script>
