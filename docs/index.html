      this.playing = true; this.step = 0; this.next = Sound.ctx.currentTime + 0.15;
    },
    stop() { this.playing = false; },
    // key: 半音いくつ上げ下げするか、bpm: テンポ。次の音から切りかわる
    setStyle(o) {
      const key = (o && o.key) || 0, bpm = (o && o.bpm) || 128;
      pitch = Math.pow(2, key / 12);
      STEP = 60 / bpm / 2;
      this.key = key; this.bpm = bpm;
    },
    key: 0, bpm: 128,
    update() {
      const ctx = Sound.ctx;
      if (!ctx || !this.playing || ctx.state !== 'running') return;
      if (!Sound.bgmOn) { this.next = ctx.currentTime + 0.1; return; } // 止めている間は進めない
      // タブを離れていたら先頭からではなく今から再開
      if (this.next < ctx.currentTime - 0.2) this.next = ctx.currentTime + 0.05;
      while (this.next < ctx.currentTime + 0.25) {
        this.playStep(this.step, this.next);
        this.step = (this.step + 1) % STEPS;
        this.next += STEP;
      }
    },
    playStep(i, t) {
      const bus = Sound.bgmBus;
      const s8 = i % 8;
      const ch = chordAt[i];
      // メロディ：やわらかい矩形波＋1オクターブ下の三角波
      const n = mel[i];
      if (n.f) {
        const d = n.len * STEP * 0.92, f = n.f * pitch;
        Sound.voice(f, f, d + 0.05, 'square', 0.07, 0, { lp: 2200, attack: 0.01 }, bus, t);
        Sound.voice(f * 0.5, f * 0.5, d + 0.05, 'triangle', 0.09, 0, { attack: 0.01 }, bus, t);
      }
      // ベース：ルート→5度（ぽんぽん跳ねる）
      if (s8 % 2 === 0) {
        const root = ch[0] * pitch;
        const f = s8 === 2 || s8 === 6 ? root * 1.5 : root;
        Sound.voice(f, f, STEP * 1.6, 'triangle', 0.32, 0, { attack: 0.005 }, bus, t);
      }
      // 和音のきざみ（裏拍）
      if (s8 % 2 === 1) {
        for (let k = 1; k < 4; k++) Sound.voice(ch[k] * pitch, ch[k] * pitch, STEP * 0.7, 'square', 0.022, 0, { lp: 1600, attack: 0.004 }, bus, t);
      }
      // 打楽器：バスドラ（1・3拍目）、シェイカー（毎回）、スネア（2・4拍目）
      if (s8 === 0 || s8 === 4) Sound.voice(150, 45, 0.16, 'sine', 0.45, 0, null, bus, t);
      Sound.noiseTo(0.04, s8 % 2 ? 0.05 : 0.03, 7000, 7000, 'highpass', 0, 0.7, bus, t);
      if (s8 === 2 || s8 === 6) Sound.noiseTo(0.12, 0.09, 1800, 1200, 'bandpass', 0, 0.9, bus, t);
    },
  };
  return M;
})();

// ===== 40_world.js =====
// 当たり判定の世界（足場＝箱・坂・円柱）
// 箱 : {type:'box', x0,y0,z0,x1,y1,z1}
// 坂 : 箱に ramp:{axis:'x'|'z', a, b}（軸の始点の高さ a → 終点の高さ b、y1 = max(a,b)）
// 円柱: {type:'cyl', x,z,r,y0,y1}
// 回転箱: {type:'obox', cx,cz, hx,hz（半分の大きさ）, ang（Y軸まわりの角度）, y0,y1}
// 共通: kind（'grass' 'stone' 'wood' 'ice' 'spring' 'lava'）, dx,dy,dz（このフレームの移動量）
//       rotY（このフレームの回転量。cx,cz を中心に回る。50_player.js が乗っている主人公を一緒に回す）
const World = {
  solids: [],
  killY: -40,
  clear() { this.solids = []; },
  add(s) {
    s.dx = s.dy = s.dz = 0;
    s.kind = s.kind || 'grass';
    this.solids.push(s);
    return s;
  },
  box(x0, y0, z0, x1, y1, z1, kind) {
    return this.add({ type: 'box', x0: Math.min(x0, x1), y0: Math.min(y0, y1), z0: Math.min(z0, z1), x1: Math.max(x0, x1), y1: Math.max(y0, y1), z1: Math.max(z0, z1), kind });
  },
  // 中心とサイズで箱
  boxC(cx, cy, cz, sx, sy, sz, kind) {
    return this.box(cx - sx / 2, cy - sy / 2, cz - sz / 2, cx + sx / 2, cy + sy / 2, cz + sz / 2, kind);
  },
  ramp(x0, z0, x1, z1, y0, axis, a, b, kind) {
    const s = this.box(x0, y0, z0, x1, Math.max(a, b), z1, kind);
    s.ramp = { axis, a, b };
    return s;
  },
  cyl(x, z, r, y0, y1, kind) {
    return this.add({ type: 'cyl', x, z, r, y0, y1, kind });
  },
  // 回転できる箱（中心 cx,cz、大きさ sx×sz、角度 ang）
  obox(cx, cz, sx, sz, ang, y0, y1, kind) {
    const s = this.add({ type: 'obox', cx, cz, hx: sx / 2, hz: sz / 2, ang, y0, y1, kind });
    oboxBounds(s);
    return s;
  },
  move(s, dx, dy, dz) {
    if (s.type === 'cyl') { s.x += dx; s.z += dz; if (s.cx !== undefined) { s.cx = s.x; s.cz = s.z; } }
    else if (s.type === 'obox') { s.cx += dx; s.cz += dz; oboxBounds(s); }
    else { s.x0 += dx; s.x1 += dx; s.z0 += dz; s.z1 += dz; }
    s.y0 += dy; s.y1 += dy;
    s.dx += dx; s.dy += dy; s.dz += dz;
  },
  // Y軸まわりに回す（回転箱・円柱）。乗っている主人公は 50_player.js が rotY を見て一緒に回す
  rotate(s, da) {
    if (s.type === 'obox') { s.ang += da; oboxBounds(s); }
    if (s.type === 'cyl') { s.cx = s.x; s.cz = s.z; s.spin = (s.spin || 0) + da; }
    s.rotY = (s.rotY || 0) + da;
  },
};

// 回転箱：ワールド→箱のローカル座標（M4.rotY と同じ向き）
function oboxLocal(s, x, z) {
  const c = Math.cos(s.ang), sn = Math.sin(s.ang);
  const dx = x - s.cx, dz = z - s.cz;
  return [c * dx - sn * dz, sn * dx + c * dz];
}
// 回転箱を囲む軸平行の箱（x0〜z1）も持っておく（カメラ判定などの大まかな判定用）
function oboxBounds(s) {
  const c = Math.abs(Math.cos(s.ang)), sn = Math.abs(Math.sin(s.ang));
  const ex = c * s.hx + sn * s.hz, ez = sn * s.hx + c * s.hz;
  s.x0 = s.cx - ex; s.x1 = s.cx + ex; s.z0 = s.cz - ez; s.z1 = s.cz + ez;
}

// 上面の高さ
function topAt(s, x, z) {
  if (!s.ramp) return s.y1;
  const r = s.ramp;
  const t = r.axis === 'x' ? (x - s.x0) / (s.x1 - s.x0) : (z - s.z0) / (s.z1 - s.z0);
  return lerp(r.a, r.b, clamp(t, 0, 1)) + (s.y1 - Math.max(r.a, r.b)); // 動く坂にも対応
}

// (x,z) が足場の上か（pad だけ外側まで許す）
function overXZ(s, x, z, pad) {
  if (s.type === 'cyl') return Math.hypot(x - s.x, z - s.z) <= s.r + pad;
  if (s.type === 'obox') {
    if (x < s.x0 - pad || x > s.x1 + pad || z < s.z0 - pad || z > s.z1 + pad) return false;
    const l = oboxLocal(s, x, z);
    return Math.abs(l[0]) <= s.hx + pad && Math.abs(l[1]) <= s.hz + pad;
  }
  return x >= s.x0 - pad && x <= s.x1 + pad && z >= s.z0 - pad && z <= s.z1 + pad;
}

// 足元の地面を探す：yFrom 以下で一番高い上面。戻り値 {y, s} または null
function groundBelow(x, z, yFrom, pad = 0) {
  let best = null;
  for (const s of World.solids) {
    if (s.off) continue;
    if (!overXZ(s, x, z, pad)) continue;
    let top;
    if (s.ramp) top = topAt(s, clamp(x, s.x0, s.x1), clamp(z, s.z0, s.z1));
    else top = s.y1;
    if (top <= yFrom + 1e-4 && (!best || top > best.y)) best = { y: top, s };
  }
  return best;
}

// 頭上の天井
function ceilingAbove(x, z, yHead, yHeadNew, pad) {
  let best = null;
  for (const s of World.solids) {
    if (s.off) continue;
    if (!overXZ(s, x, z, -pad)) continue;
    if (s.y0 >= yHead - 1e-3 && s.y0 < yHeadNew && (!best || s.y0 < best)) best = s.y0;
  }
  return best;
}

// 横方向の押し戻し。p:{x,y,z,r,h}。戻り値：一番強く当たった壁 {nx,nz,s} または null
const STEP_H = 0.45;
function pushOutXZ(p) {
  let wall = null, wallPush = 0;
  for (let iter = 0; iter < 2; iter++) {
    for (const s of World.solids) {
      if (s.off) continue;
      if (p.y + p.h <= s.y0 + 0.02) continue;
      let cx, cz;
      if (s.type === 'obox') {
        // ローカル座標で箱と同じ計算をして、法線をワールドに戻す
        if (p.y >= s.y1 - STEP_H) continue;
        if (p.x < s.x0 - p.r || p.x > s.x1 + p.r || p.z < s.z0 - p.r || p.z > s.z1 + p.r) continue;
        const l = oboxLocal(s, p.x, p.z);
        const qx = clamp(l[0], -s.hx, s.hx), qz = clamp(l[1], -s.hz, s.hz);
        const ex = l[0] - qx, ez = l[1] - qz;
        const e2 = ex * ex + ez * ez;
        if (e2 >= p.r * p.r) continue;
        let lnx, lnz, push;
        if (e2 > 1e-10) { const d = Math.sqrt(e2); lnx = ex / d; lnz = ez / d; push = p.r - d; }
        else {
          const ml = l[0] + s.hx, mr = s.hx - l[0], mb = l[1] + s.hz, mf = s.hz - l[1];
          const m = Math.min(ml, mr, mb, mf);
          if (m === ml) { lnx = -1; lnz = 0; } else if (m === mr) { lnx = 1; lnz = 0; } else if (m === mb) { lnx = 0; lnz = -1; } else { lnx = 0; lnz = 1; }
          push = m + p.r;
        }
        const c = Math.cos(s.ang), sn = Math.sin(s.ang);
        const nx = c * lnx + sn * lnz, nz = -sn * lnx + c * lnz;
        p.x += nx * push; p.z += nz * push;
        if (push > wallPush) { wallPush = push; wall = { nx, nz, s }; }
        continue;
      }
      if (s.type === 'cyl') {
        const dx = p.x - s.x, dz = p.z - s.z;
        const d = Math.hypot(dx, dz);
        if (d >= s.r + p.r) continue;
        if (p.y >= s.y1 - STEP_H) continue;
        const nx = d > 1e-6 ? dx / d : 1, nz = d > 1e-6 ? dz / d : 0;
        const push = s.r + p.r - d;
        p.x += nx * push; p.z += nz * push;
        if (push > wallPush) { wallPush = push; wall = { nx, nz, s }; }
        continue;
      }
      cx = clamp(p.x, s.x0, s.x1); cz = clamp(p.z, s.z0, s.z1);
      const top = s.ramp ? topAt(s, cx, cz) : s.y1;
      if (p.y >= top - STEP_H) continue;
      if (s.ramp && p.y + p.h <= s.y0) continue;
      let dx = p.x - cx, dz = p.z - cz;
      const d2 = dx * dx + dz * dz;
      if (d2 >= p.r * p.r) continue;
      let nx, nz, push;
      if (d2 > 1e-10) {
        const d = Math.sqrt(d2);
        nx = dx / d; nz = dz / d; push = p.r - d;
      } else {
        // 中心が箱の中：一番近い辺へ出す
        const l = p.x - s.x0, r = s.x1 - p.x, b = p.z - s.z0, f = s.z1 - p.z;
        const m = Math.min(l, r, b, f);
        if (m === l) { nx = -1; nz = 0; } else if (m === r) { nx = 1; nz = 0; } else if (m === b) { nx = 0; nz = -1; } else { nx = 0; nz = 1; }
        push = m + p.r;
      }
      p.x += nx * push; p.z += nz * push;
      if (push > wallPush) { wallPush = push; wall = { nx, nz, s }; }
    }
  }
  return wall;
}

// 線分とワールドの交差（カメラのめり込み防止用）。戻り値 t（0〜1）
function raycast(a, b) {
  let tMin = 1;
  const d = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
  for (const s of World.solids) {
    if (s.noCam || s.off) continue;
    let x0, x1, z0, z1;
    if (s.type === 'cyl') { x0 = s.x - s.r * 0.8; x1 = s.x + s.r * 0.8; z0 = s.z - s.r * 0.8; z1 = s.z + s.r * 0.8; }
    else { x0 = s.x0; x1 = s.x1; z0 = s.z0; z1 = s.z1; }
    const lo = [x0, s.y0, z0], hi = [x1, s.ramp ? (s.y0 + s.y1) / 2 : s.y1, z1];
    let t0 = 0, t1 = tMin, hit = true;
    for (let i = 0; i < 3; i++) {
      if (Math.abs(d[i]) < 1e-9) {
        if (a[i] < lo[i] || a[i] > hi[i]) { hit = false; break; }
      } else {
        let ta = (lo[i] - a[i]) / d[i], tb = (hi[i] - a[i]) / d[i];
        if (ta > tb) [ta, tb] = [tb, ta];
        t0 = Math.max(t0, ta); t1 = Math.min(t1, tb);
        if (t0 > t1) { hit = false; break; }
      }
    }
    if (hit && t0 > 0 && t0 < tMin) tMin = t0;
  }
  return tMin;
}

// ===== 50_player.js =====
// 主人公「ころん」の動きと当たり判定
const PL = {
  R: 0.42, H: 1.3,
  GRAV: 40, MAXFALL: 34,
  WALK: 4.2, RUN: 9.2, ACC: 34, DEC: 30, AIR_ACC: 16,
  TURN: 12,
  J1: 13.2, J2: 15.6, J3: 19.5,
  CHAIN_WIN: 0.24,    // 着地してから次のジャンプで段が上がる受付時間
  // ここから下は追加（手ざわり用）
  COYOTE: 0.1,        // 崖から落ちた直後でもジャンプできる時間
  BUFFER: 0.14,       // ジャンプの先行入力を覚えておく時間
  WALL_WIN: 0.2,      // 壁に当たってから壁キックを受け付ける時間
  WALL_SLIDE: 6.5,    // 壁に押しつけているときの落下速度の上限
  LONG_V: 10.5, LONG_MUL: 1.75,   // 幅とび
  BACK_V: 20.5,       // バク宙
  SIDE_V: 20,         // くるりんジャンプ（切り返し中のジャンプ）
  WALLKICK_V: 15.5, WALLKICK_H: 8.5,
  POUNDJUMP_V: 18,    // ヒップドロップ着地直後のジャンプ
  ICE_ACC: 7, ICE_DEC: 2.2,
};

const P = {
  x: 0, y: 0, z: 0, vx: 0, vy: 0, vz: 0,
  r: PL.R, h: PL.H,
  yaw: 0,            // 向き（+z 方向が 0、反時計回り）
  speed: 0,          // 水平方向の速さ（向き方向。マイナスは後ろ向きに進む）
  grounded: true, groundS: null,
  state: 'ground',   // ground | air | pound | punch | hurt | dead | win
  jumpN: 0,          // 連続ジャンプの段数
  landT: 0,          // 着地してからの時間
  airT: 0,
  jumpHeld: false,
  stateT: 0,
  flip: 0,           // 三段ジャンプ・バク宙の回転
  flipDir: 1,
  wall: null, wallT: 0,
  hp: 3, maxHp: 3,
  inv: 0,            // 無敵時間
  safe: [0, 0, 0],   // 最後に安全に立った位置
  safeT: 0,
  anim: 0,           // 歩きアニメの位相
  squash: 1,
  crouching: false,
  punchHit: false,
  longJump: false,
  kickT: 0,
  dust: 0,
  // 追加した状態
  coyote: 0,         // 残りコヨーテ時間
  jumpBuf: 0,        // 残り先行入力時間
  attackBuf: 0,
  skidT: 0,          // 切り返しブレーキ中（0 より大きい間）
  skidYaw: 0,        // 切り返したい向き
  sideFlip: false,   // くるりんジャンプ中
  dive: false,       // 空中ダイブ中
  slideT: 0,         // ダイブ着地後のすべり
  poundT: 0,         // ヒップドロップ着地後の受付
  punchN: 0,         // パンチの連続段数
  wallSlide: false,
  slope: 0,          // 足元の坂の傾き（進む向きに上り＝プラス）
  fallFrom: 0,       // 空中で一番高かった所
};

function playerReset(x, y, z, yaw) {
  Object.assign(P, {
    x, y, z, vx: 0, vy: 0, vz: 0, yaw, speed: 0, grounded: true, groundS: null, state: 'ground',
    jumpN: 0, landT: 1, airT: 0, flip: 0, wall: null, wallT: 0, inv: 0, stateT: 0, squash: 1,
    crouching: false, longJump: false, kickT: 0, coyote: 0, jumpBuf: 0, attackBuf: 0, skidT: 0,
    sideFlip: false, dive: false, slideT: 0, poundT: 0, punchN: 0, wallSlide: false, fallFrom: y,
  });
  P.safe = [x, y, z];
}

function playerHurt(fromX, fromZ, dmg = 1) {
  if (P.inv > 0 || P.state === 'dead' || P.state === 'win') return;
  P.hp -= dmg;
  Sound.play('hurt');
  Fx.burst(P.x, P.y + 0.8, P.z, [1, 0.9, 0.4], 10, 5);
  Game.shake = 0.35;
  Game.hurtFlash = 1;
  if (P.hp <= 0) { playerDie(); return; }
  const dx = P.x - fromX, dz = P.z - fromZ, d = Math.hypot(dx, dz) || 1;
  // 後ろ向きにはじかれる（向きはそのまま、敵の方を見る）
  P.yaw = Math.atan2(-dx, -dz);
  P.speed = -8;
  P.vx = (dx / d) * 8; P.vz = (dz / d) * 8; P.vy = 9;
  P.grounded = false; P.groundS = null;
  P.state = 'hurt'; P.stateT = 0;
  P.flip = 0; P.longJump = false; P.dive = false; P.skidT = 0;
  P.inv = 2.0;
}

function playerDie() {
  P.hp = 0;
  P.state = 'dead'; P.stateT = 0;
  P.vx = P.vz = 0; P.vy = 12;
  Game.onDeath();
}

// 入力方向（カメラ基準）→ ワールド方向。毎フレーム同じ入れ物を使う
const inp = { m: 0, ax: 0, az: 0 };
function readInputDir() {
  const m = Math.min(1, Math.hypot(Input.mx, Input.my));
  if (m < 0.05) { inp.m = 0; inp.ax = 0; inp.az = 0; return inp; }
  const cy = Cam.yaw;
  // カメラの前（奥）方向 = (-sin, -cos)（カメラは yaw 方向の後ろにいる）
  const fx = -Math.sin(cy), fz = -Math.cos(cy);
  const rx = -fz, rz = fx;
  const ax = fx * Input.my - rx * Input.mx;
  const az = fz * Input.my - rz * Input.mx;
  const l = Math.hypot(ax, az) || 1;
  inp.m = m; inp.ax = ax / l; inp.az = az / l;
  return inp;
}
// 古い名前でも呼べるように
function inputDir() { return readInputDir(); }

function doJump(vy, name) {
  P.vy = vy;
  P.grounded = false;
  P.groundS = null;
  P.state = 'air';
  P.airT = 0;
  P.jumpHeld = true;
  P.jumpBuf = 0; P.coyote = 0;
  P.squash = 1.35;
  P.skidT = 0; P.slideT = 0; P.poundT = 0;
  P.fallFrom = P.y;
  Sound.play(name);
  Fx.dust(P.x, P.y, P.z, 6);
}

function setVelFromYaw() {
  P.vx = Math.sin(P.yaw) * P.speed;
  P.vz = Math.cos(P.yaw) * P.speed;
}

// 足元の坂の傾き（進む向きに対して）。上りがプラス
function slopeAhead() {
  const s = P.groundS;
  if (!s || !s.ramp) return 0;
  const fx = Math.sin(P.yaw), fz = Math.cos(P.yaw);
  const x0 = clamp(P.x, s.x0, s.x1), z0 = clamp(P.z, s.z0, s.z1);
  const x1 = clamp(P.x + fx * 0.5, s.x0, s.x1), z1 = clamp(P.z + fz * 0.5, s.z0, s.z1);
  const d = Math.hypot(x1 - x0, z1 - z0);
  if (d < 1e-3) return 0;
  return (topAt(s, x1, z1) - topAt(s, x0, z0)) / d;
}

// 坂の「下り方向」（ワールド）。平らなら null
const downhill = { x: 0, z: 0, k: 0 };
function rampDownhill(s) {
  if (!s || !s.ramp) return null;
  const r = s.ramp;
  const len = r.axis === 'x' ? s.x1 - s.x0 : s.z1 - s.z0;
  const k = (r.b - r.a) / len; // 軸の正方向に進んだときの上がり方
  if (Math.abs(k) < 0.05) return null;
  downhill.x = r.axis === 'x' ? -Math.sign(k) : 0;
  downhill.z = r.axis === 'z' ? -Math.sign(k) : 0;
  downhill.k = Math.abs(k);
  return downhill;
}

function startPunch() {
  P.state = 'punch'; P.stateT = 0; P.punchHit = false;
  P.punchN = 1;
  Sound.play('punch');
  if (P.speed > 5) P.speed += 2;
  P.attackBuf = 0;
}

function updatePlayer(dt) {
  P.stateT += dt;
  P.inv = Math.max(0, P.inv - dt);
  P.squash = lerp(P.squash, 1, 1 - Math.exp(-dt * 12));
  // 先行入力を覚える
  if (Input.jumpP) P.jumpBuf = PL.BUFFER; else P.jumpBuf = Math.max(0, P.jumpBuf - dt);
  if (Input.attackP) P.attackBuf = 0.12; else P.attackBuf = Math.max(0, P.attackBuf - dt);
  if (!Input.jump) P.jumpHeld = false;

  if (P.state === 'dead') {
    P.vy -= PL.GRAV * 0.6 * dt;
    P.y += P.vy * dt;
    P.flip += dt * 6;
    return;
  }
  if (P.state === 'win') {
    P.vx = P.vz = 0; P.speed = 0;
    P.anim += dt * 6;
    P.jumpBuf = 0;
    return;
  }

  readInputDir();
  const onGround = P.grounded;

  // 動く足場に乗っていたら一緒に動く
  if (onGround && P.groundS) {
    P.x += P.groundS.dx; P.y += P.groundS.dy; P.z += P.groundS.dz;
    if (P.groundS.rotY) {
      const s = P.groundS, c = Math.cos(s.rotY), sn = Math.sin(s.rotY);
      const rx = P.x - s.cx, rz = P.z - s.cz;
      P.x = s.cx + rx * c + rz * sn; P.z = s.cz - rx * sn + rz * c;
      P.yaw += s.rotY;
    }
  }

  P.crouching = onGround && Input.crouch && P.state === 'ground' && P.skidT <= 0;
  P.wallSlide = false;

  // ---------- 地上 ----------
  if (P.state === 'ground') {
    P.landT += dt;
    P.poundT = Math.max(0, P.poundT - dt);
    const ice = P.groundS && P.groundS.kind === 'ice';
    P.slope = slopeAhead();

    if (P.skidT > 0) {
      // 切り返しブレーキ：前を向いたまま急停止。この間にジャンプで「くるりんジャンプ」
      P.skidT -= dt;
      P.speed = approach(P.speed, 0, PL.DEC * 2.2 * dt);
      if (Math.random() < dt * 40) Fx.skid(P.x, P.y, P.z);
      if (P.skidT <= 0 || P.speed <= 0.5) {
        P.skidT = 0;
        P.yaw = P.skidYaw;
        P.speed = Math.min(P.speed, 1.5);
      }
      setVelFromYaw();
    } else if (ice) {
      groundIce(dt);
    } else {
      groundNormal(dt);
    }
    P.anim += dt * (2 + Math.abs(P.speed) * 1.5);
    // 足音（左右の足が着くたび）
    if (P.speed > 1.2 && !P.crouching) {
      const ph = Math.floor(P.anim / Math.PI);
      if (ph !== P.stepPh) { P.stepPh = ph; Sound.play('step', clamp(P.speed / PL.RUN, 0.4, 1)); }
    }
    if (P.speed > 7 && Math.random() < dt * 10) Fx.dust(P.x, P.y, P.z, 1);

    if (P.jumpBuf > 0) groundJump();
    else if (P.attackBuf > 0 && P.skidT <= 0) startPunch();
  }
  // ---------- パンチ（3回まで続けられる。3回目はまわしげり） ----------
  else if (P.state === 'punch') {
    P.speed = approach(P.speed, 0, (P.punchN === 3 ? 10 : 14) * dt);
    if (inp.m > 0 && P.stateT < 0.1) {
      // 出だしだけ少し向きを変えられる
      const want = Math.atan2(inp.ax, inp.az);
      P.yaw += clamp(angDiff(P.yaw, want), -PL.TURN * dt, PL.TURN * dt);
    }
    setVelFromYaw();
    P.anim += dt * 4;
    const len = P.punchN === 3 ? 0.42 : 0.32;
    if (P.attackBuf > 0 && P.stateT > 0.1 && P.punchN < 3) {
      P.punchN++;
      P.stateT = 0; P.punchHit = false; P.attackBuf = 0;
      if (P.punchN === 3) {
        P.kickT = 0.32; P.speed = Math.max(P.speed, 0) + 3; P.flip = 0; Sound.play('kick');
      } else { P.speed = Math.max(P.speed, 0) + 1.5; Sound.play('punch2'); }
    } else if (P.stateT > len) { P.state = 'ground'; P.punchN = 0; }
    if (P.jumpBuf > 0 && P.grounded) { P.state = 'ground'; P.punchN = 0; groundJump(); }
  }
  // ---------- 空中 ----------
  else if (P.state === 'air' || P.state === 'hurt') {
    P.airT += dt;
    P.coyote = Math.max(0, P.coyote - dt);
    if (P.state === 'air') airControl(dt);
    if (P.flip) P.flip += dt * (P.sideFlip ? 11 : 9.5) * P.flipDir;
    let g = PL.GRAV;
    if (P.state === 'air' && !P.jumpHeld && P.vy > 4 && !P.flip && !P.longJump) g *= 2.2; // 早く離すと低く
    P.vy = Math.max(P.vy - g * dt, -PL.MAXFALL);
    if (P.wallSlide && P.vy < -PL.WALL_SLIDE) P.vy = approach(P.vy, -PL.WALL_SLIDE, 120 * dt);
    if (P.y > P.fallFrom) P.fallFrom = P.y;
  }
  // ---------- ヒップドロップ ----------
  else if (P.state === 'pound') {
    if (P.stateT < 0.24) { P.vy = 0; P.flip = (P.stateT / 0.24) * TAU; P.squash = 0.9; }
    else { P.flip = 0; P.vy = -32; }
    P.vx = P.vz = 0;
  }

  P.kickT = Math.max(0, P.kickT - dt);

  moveAndCollide(dt);

  // 安全な位置を記録（落下したときの復帰用）
  if (P.grounded && P.groundS && !P.groundS.dx && !P.groundS.dz && !P.groundS.dy && P.groundS.kind !== 'lava' && !P.groundS.noSafe) {
    P.safeT += dt;
    if (P.safeT > 0.3) { P.safe[0] = P.x; P.safe[1] = P.y; P.safe[2] = P.z; }
  } else P.safeT = 0;

  if (P.y < World.killY) Game.onFall();
}

// 地上のふつうの走り
function groundNormal(dt) {
  let slideDown = null;
  // しゃがんだまま坂にいると、すべり降りる
  if (P.crouching) slideDown = rampDownhill(P.groundS);
  if (slideDown && slideDown.k > 0.2) {
    const want = Math.atan2(slideDown.x, slideDown.z);
    P.yaw += clamp(angDiff(P.yaw, want), -6 * dt, 6 * dt);
    P.speed = Math.min(P.speed + 22 * slideDown.k * dt, PL.RUN * 1.3);
    if (Math.random() < dt * 20) Fx.dust(P.x, P.y, P.z, 1);
    setVelFromYaw();
    return;
  }
  if (P.slideT > 0) {
    // ダイブ着地後のおなかすべり
    P.slideT -= dt;
    P.speed = approach(P.speed, 0, 12 * dt);
    if (Math.random() < dt * 25) Fx.skid(P.x, P.y, P.z);
    setVelFromYaw();
    return;
  }
  if (inp.m > 0) {
    let target = P.crouching ? PL.WALK * 0.35 * inp.m : lerp(PL.WALK * 0.5, PL.RUN, smooth(inp.m)) * (inp.m > 0.15 ? 1 : 0.4);
    // 坂：上りは少し遅く、下りは少し速く
    if (P.slope > 0.05) target *= 1 - Math.min(0.35, P.slope * 0.6);
    else if (P.slope < -0.05) target *= 1 + Math.min(0.2, -P.slope * 0.4);
    const want = Math.atan2(inp.ax, inp.az);
    const diff = angDiff(P.yaw, want);
    if (Math.abs(diff) > 2.3 && P.speed > 5.5 && !P.crouching) {
      // 急な切り返し：ブレーキ（スキッド）
      P.skidT = 0.32; P.skidYaw = want;
      Sound.play('skid');
      Fx.dust(P.x, P.y, P.z, 3);
    } else {
      // 速いほど曲がりにくいが、止まっているときはすぐ向く
      const turn = PL.TURN * dt * (P.speed > 7 ? 0.75 : P.speed < 1.5 ? 2 : 1);
      P.yaw += clamp(diff, -turn, turn);
      // 大きく曲がっている間は少しだけ減速（曲がりやすく）
      if (Math.abs(diff) > 1.2 && P.speed > 4) target = Math.min(target, P.speed - 4 * dt);
      // 動き出しはすぐに歩きの速さへ
      if (P.speed < PL.WALK * 0.5 * inp.m && target > P.speed) P.speed = Math.max(P.speed, Math.min(target, PL.WALK * 0.5 * inp.m));
      P.speed = approach(P.speed, target, (target > P.speed ? PL.ACC : PL.DEC) * dt);
    }
  } else {
    P.speed = approach(P.speed, 0, PL.DEC * dt);
  }
  setVelFromYaw();
}

// 氷の上：勢い（速度ベクトル）が残り、ゆっくりしか変わらない
function groundIce(dt) {
  let tx = 0, tz = 0;
  if (inp.m > 0) {
    const sp = lerp(PL.WALK * 0.5, PL.RUN * 1.1, smooth(inp.m));
    tx = inp.ax * sp; tz = inp.az * sp;
    const want = Math.atan2(inp.ax, inp.az);
    P.yaw += clamp(angDiff(P.yaw, want), -PL.TURN * 0.6 * dt, PL.TURN * 0.6 * dt);
  }
  const k = (inp.m > 0 ? PL.ICE_ACC : PL.ICE_DEC) * dt;
  const dx = tx - P.vx, dz = tz - P.vz, d = Math.hypot(dx, dz);
  if (d > k) { P.vx += (dx / d) * k; P.vz += (dz / d) * k; } else { P.vx = tx; P.vz = tz; }
  // speed は「向き方向の速さ」としておく（見た目・ジャンプ用）
  const v = Math.hypot(P.vx, P.vz);
  P.speed = v * Math.max(0, Math.cos(angDiff(P.yaw, Math.atan2(P.vx, P.vz))));
  if (v > 4 && Math.abs(angDiff(P.yaw, Math.atan2(P.vx, P.vz))) > 1 && Math.random() < dt * 15) Fx.skid(P.x, P.y, P.z);
}

// 地上（またはコヨーテ時間中）のジャンプ。技の分かれ道
function groundJump() {
  const ice = P.groundS && P.groundS.kind === 'ice';
  if (ice) {
    // 氷の上では、すべっている向きに跳ぶ
    const v = Math.hypot(P.vx, P.vz);
    if (v > 1) { P.yaw = Math.atan2(P.vx, P.vz); P.speed = v; }
  }
  P.sideFlip = false; P.dive = false;
  if (P.skidT > 0) {
    // くるりんジャンプ（切り返しの途中で跳ぶと、くるっと向きを変えて高く跳ぶ）
    P.yaw = P.skidYaw;
    P.speed = 3.5;
    setVelFromYaw();
    doJump(PL.SIDE_V, 'flip');
    P.flip = 0.001; P.flipDir = -1; P.sideFlip = true;
    P.jumpN = 0;
    Fx.burst(P.x, P.y + 0.3, P.z, [1, 1, 1], 8, 4);
  } else if (P.poundT > 0) {
    // ヒップドロップ着地のすぐ後のジャンプ：高く跳ねる
    P.speed = Math.min(P.speed, 2);
    setVelFromYaw();
    doJump(PL.POUNDJUMP_V, 'jump3');
    P.flip = 0.001; P.flipDir = 1;
    P.jumpN = 0;
  } else if (P.crouching && P.speed > 4.5) {
    // 幅とび
    P.speed = Math.max(P.speed, 8) * PL.LONG_MUL;
    setVelFromYaw();
    doJump(PL.LONG_V, 'longjump');
    P.longJump = true;
    P.jumpN = 0;
  } else if (P.crouching) {
    // バク宙
    P.speed = -4;
    setVelFromYaw();
    doJump(PL.BACK_V, 'flip');
    P.flip = 0.001; P.flipDir = -1;
    P.jumpN = 0;
  } else {
    const chain = P.landT < PL.CHAIN_WIN && P.speed > 3 && P.jumpN > 0 && P.jumpN < 3;
    P.jumpN = chain ? P.jumpN + 1 : 1;
    if (P.jumpN === 3 && P.speed < 6) P.jumpN = 1;
    const vy = [0, PL.J1, PL.J2, PL.J3][P.jumpN] + Math.max(0, P.speed) * 0.12;
    doJump(vy, ['', 'jump', 'jump2', 'jump3'][P.jumpN]);
    if (P.jumpN === 3) { P.flip = 0.001; P.flipDir = 1; }
  }
}

// 空中での操作
function airControl(dt) {
  // コヨーテジャンプ（崖から出た直後）
  if (P.jumpBuf > 0 && P.coyote > 0) {
    P.state = 'ground'; P.landT = 1; P.crouching = false;
    groundJump();
    return;
  }
  if (inp.m > 0 && !P.longJump && !P.dive) {
    const fwd = Math.sin(P.yaw) * inp.ax + Math.cos(P.yaw) * inp.az;
    const side = Math.cos(P.yaw) * inp.ax - Math.sin(P.yaw) * inp.az;
    P.speed = approach(P.speed, PL.RUN * Math.max(0.35, fwd) * inp.m, PL.AIR_ACC * dt * (fwd < 0 ? 1.6 : 1));
    P.yaw += side * dt * 2.4 * (P.flip ? 0.3 : 1);
  } else if (inp.m > 0) {
    const side = Math.cos(P.yaw) * inp.ax - Math.sin(P.yaw) * inp.az;
    P.yaw += side * dt * 1.2;
  }
  setVelFromYaw();

  // 壁にくっついて落ちるときは少しゆっくり（壁キックしやすく）
  if (P.wall && P.wallT < 0.05 && P.vy < 0 && inp.m > 0) {
    const into = -(inp.ax * P.wall.nx + inp.az * P.wall.nz);
    if (into > 0.3) {
      P.wallSlide = true;
      if (Math.random() < 0.3) Fx.skid(P.x - P.wall.nx * 0.4, P.y + 0.6, P.z - P.wall.nz * 0.4);
    }
  }

  if (P.wall && P.wallT < PL.WALL_WIN && P.jumpBuf > 0 && P.airT > 0.04) {
    // 壁キック
    const w = P.wall;
    P.yaw = Math.atan2(w.nx, w.nz);
    P.speed = PL.WALLKICK_H;
    setVelFromYaw();
    doJump(PL.WALLKICK_V, 'wall');
    P.jumpN = 0; P.longJump = false; P.dive = false; P.flip = 0; P.sideFlip = false;
    P.squash = 0.8;
    Fx.burst(P.x - w.nx * 0.4, P.y + 0.9, P.z - w.nz * 0.4, [1, 1, 1], 8, 3);
    P.wall = null;
    Game.shake = Math.max(Game.shake, 0.06);
  } else if (Input.crouchP && P.airT > 0.04) {
    // ヒップドロップ
    P.state = 'pound'; P.stateT = 0;
    P.vx = P.vz = 0; P.speed = 0; P.vy = 0; P.flip = 0;
    P.longJump = false; P.dive = false; P.sideFlip = false;
    Sound.play('poundSpin');
  } else if (P.attackBuf > 0 && P.airT > 0.05 && !P.longJump && !P.dive) {
    P.attackBuf = 0;
    if (P.speed > 6.5 && !P.flip) {
      // ダイブ（前へ飛びこむ）
      P.dive = true; P.longJump = true;
      P.speed = Math.min(Math.max(P.speed + 3, 11), 13);
      P.vy = Math.max(P.vy, 5);
      P.kickT = 0.35; P.punchHit = false;
      setVelFromYaw();
      Sound.play('longjump');
    } else {
      // 空中キック（少し浮く）
      P.vy = Math.max(P.vy, 4);
      P.punchHit = false;
      P.kickT = 0.3;
      Sound.play('kick');
    }
  }
}

function moveAndCollide(dt) {
  const prevY = P.y;
  const steps = 3;
  const h = dt / steps;
  let wall = null;
  for (let i = 0; i < steps; i++) {
    P.x += P.vx * h;
    P.z += P.vz * h;
    const w = pushOutXZ(P);
    if (w) wall = w;
  }
  // 壁に当たったら速度を壁沿いに
  if (wall) {
    const vn = P.vx * wall.nx + P.vz * wall.nz;
    if (vn < 0) {
      if (P.state === 'ground' && P.speed > 6 && vn < -6 && Math.abs(vn) > P.speed * 0.85) {
        // 走って壁に正面衝突：はね返る
        P.speed = -3; Sound.play('land', 0.8); Game.shake = 0.12; P.skidT = 0;
      }
      P.vx -= vn * wall.nx; P.vz -= vn * wall.nz;
      if (P.state !== 'ground') {
        const along = Math.hypot(P.vx, P.vz);
        if (P.state === 'air') P.speed = Math.min(P.speed, along + 1);
        if (P.dive) { P.dive = false; P.longJump = false; P.speed = -2; P.vy = Math.min(P.vy, 2); }
      }
    }
    if (!P.grounded && P.state === 'air' && P.vy < 6) { P.wall = wall; P.wallT = 0; }
  }
  if (P.wall) { P.wallT += dt; if (P.wallT > PL.WALL_WIN) P.wall = null; }

  // 縦方向
  if (P.grounded) {
    const g = groundBelow(P.x, P.z, P.y + STEP_H, P.r * 0.5);
    if (g && P.y - g.y <= 0.5 && P.vy <= 0) {
      P.y = g.y; P.groundS = g.s; P.vy = 0;
    } else {
      // 足場から出た：コヨーテ時間のはじまり
      P.grounded = false; P.groundS = null;
      if (P.state === 'ground' || P.state === 'punch') {
        P.coyote = P.skidT > 0 || P.slideT > 0 ? 0.05 : PL.COYOTE;
        P.state = 'air'; P.airT = 0; P.jumpHeld = false;
        P.skidT = 0; P.slideT = 0; P.punchN = 0;
        P.fallFrom = P.y;
        if (P.speed < 0) P.speed *= 0.5;
      }
      P.vy = Math.min(P.vy, 0);
    }
  } else {
    const ny = P.y + P.vy * dt;
    if (P.vy > 0) {
      const c = ceilingAbove(P.x, P.z, P.y + P.h, ny + P.h, P.r * 0.3);
      if (c !== null) { P.y = c - P.h; P.vy = -1; Sound.play('land', 0.5); }
      else P.y = ny;
    } else {
      const g = groundBelow(P.x, P.z, prevY + 0.05, P.r * 0.5);
      if (g && ny <= g.y) { P.y = g.y; landOn(g.s); }
      else P.y = ny;
    }
  }
}

function landOn(s) {
  const fallV = P.vy;
  const drop = P.fallFrom - P.y;
  P.grounded = true; P.groundS = s; P.vy = 0;
  P.landT = 0; P.flip = 0; P.wall = null; P.coyote = 0;
  P.sideFlip = false;
  P.squash = clamp(1 + fallV * 0.012, 0.6, 0.85);
  P.fallFrom = P.y;
  if (s.kind === 'spring') {
    P.state = 'air'; P.grounded = false; P.groundS = null;
    P.vy = 27; P.airT = 0; P.jumpHeld = true; P.flip = 0.001; P.flipDir = 1;
    P.longJump = false; P.dive = false;
    s.boing = 1;
    Sound.play('spring');
    return;
  }
  if (s.kind === 'lava') {
    playerHurt(P.x + Math.sin(P.yaw), P.z + Math.cos(P.yaw));
    P.vy = 16; P.grounded = false; P.groundS = null; P.state = 'hurt';
    return;
  }
  if (P.state === 'pound') {
    Sound.play('pound');
    Game.shake = 0.3;
    Fx.ring(P.x, P.y + 0.05, P.z);
    Fx.dust(P.x, P.y, P.z, 14);
    Game.onPound(P.x, P.y, P.z);
    P.state = 'ground'; P.speed = 0; P.landT = 1;
    P.stateT = 0;
    P.poundT = 0.28; // この間にジャンプすると高く跳ねる
    P.squash = 0.55;
    return;
  }
  if (P.dive) {
    // ダイブの着地：おなかですべる
    P.dive = false; P.longJump = false;
    P.slideT = 0.4; P.speed = Math.min(P.speed, 10);
    Sound.play('land', 0.8);
    Fx.dust(P.x, P.y, P.z, 6);
  }
  if (P.longJump) { P.speed *= 0.45; P.longJump = false; }
  if (P.state === 'hurt') { P.speed = 0; P.vx = P.vz = 0; }
  if (fallV < -8) {
    Sound.play('land', clamp(-fallV / 30, 0.35, 1));
    Fx.dust(P.x, P.y, P.z, fallV < -22 ? 9 : 5);
  }
  if (fallV < -30 || drop > 9) { Game.shake = Math.max(Game.shake, 0.15); P.squash = 0.6; }
  P.state = 'ground';
  P.speed = Math.max(0, P.speed);
  P.skidT = 0;
}

// ===== 55_camera.js =====
// カメラ（主人公の後ろを追いかける。ドラッグ・Q/E・右スティックで回せる）
// 考え方：
//  ・ふだんは「ひもでつながったカメラ」：前の位置から主人公へ引っぱられるだけなので、
//    横に走ると自然に回り、手前に走っても勝手にぐるっと回らない
//  ・しばらく手で回していないときだけ、走っている向きの後ろへ「ゆっくり」寄せる
//  ・上下は「最後に立っていた高さ」を基準にして、ジャンプのたびに揺れない
//  ・壁や塔の中に入らないよう、5本の線で調べて手前に寄る
const Cam = {
  yaw: Math.PI, pitch: 0.38, dist: 10.5,
  zoomLv: 1, dists: [6.5, 10.5, 15],
  tx: 0, ty: 0, tz: 0,
  eye: [0, 5, 10],
  target: [0, 0, 0],
  manualT: 9,
  fov: 0.95,
  shown: 10.5,
  override: null,  // 演出用 {eye, target}
  baseY: 0,        // 上下の基準（最後に立っていた高さ）
  lastWant: 0, vWantS: 0,
  vy: 0,           // 注視点の上下の速さ（ばね）
  resetT: 0,       // 後ろへ回り込み中
  pitchAuto: 0.36,
  aheadX: 0, aheadZ: 0,
  distS: 10.5,
};
const camWant = [0, 0, 0];
const camTmpA = [0, 0, 0], camTmpB = [0, 0, 0];

function camReset() {
  Cam.yaw = P.yaw + Math.PI;
  Cam.tx = P.x; Cam.ty = P.y + 1.2; Cam.tz = P.z;
  Cam.baseY = P.y; Cam.vy = 0; Cam.lastWant = P.y + 1.2; Cam.vWantS = 0;
  Cam.pitch = 0.36;
  Cam.dist = Cam.distS = Cam.dists[Cam.zoomLv];
  Cam.shown = Cam.dist;
  Cam.manualT = 9;
  Cam.aheadX = Cam.aheadZ = 0;
  Cam.override = null;
}

// 線分 a→b とワールドの交差（カメラ用）。円柱はきちんと丸で、細い柱・飾りは無視する
function camRay(ax, ay, az, bx, by, bz) {
  let tMin = 1;
  const dx = bx - ax, dy = by - ay, dz = bz - az;
  const sol = World.solids;
  for (let i = 0; i < sol.length; i++) {
    const s = sol[i];
    if (s.noCam || s.off) continue; // 消えている足場には当たらない
    if (s.type === 'cyl') {
      if (s.r < 0.8) continue; // 木の幹などは無視（見えなくなっても一瞬）
      // XZ 平面で円と交差
      const ox = ax - s.x, oz = az - s.z;
      const A = dx * dx + dz * dz;
      const C = ox * ox + oz * oz - s.r * s.r;
      let t0;
      if (C <= 0) t0 = 0; // 始点が円の中（主人公が円柱の上にいるときなど）
      else {
        if (A < 1e-9) continue;
        const B = ox * dx + oz * dz;
        const disc = B * B - A * C;
        if (disc < 0) continue;
        t0 = (-B - Math.sqrt(disc)) / A;
        if (t0 < 0 || t0 >= tMin) continue;
      }
      // その点の高さが円柱の高さの範囲内か（上面を少し下げて、乗っているときに引っかからない）
      const y = ay + dy * t0;
      if (y < s.y0 || y > s.y1 - 0.05) {
        // 上面・下面から入る場合
        const yc = dy > 0 ? s.y0 : s.y1 - 0.05;
        if (Math.abs(dy) < 1e-9) continue;
        const tc = (yc - ay) / dy;
        if (tc <= 0 || tc >= tMin) continue;
        const px = ax + dx * tc - s.x, pz = az + dz * tc - s.z;
        if (px * px + pz * pz > s.r * s.r) continue;
        if (C <= 0 && tc < 0.02) continue;
        tMin = tc;
        continue;
      }
      if (t0 > 0.001) tMin = t0;
      continue;
    }
    // 箱（坂は上面の真ん中の高さまで）
    const x0 = s.x0, x1 = s.x1, z0 = s.z0, z1 = s.z1, y0 = s.y0;
    const y1 = s.ramp ? (s.y0 + s.y1) * 0.5 : s.y1 - 0.05;
    if (x1 - x0 < 0.5 && z1 - z0 < 0.5) continue;
    let t0 = 0, t1 = tMin;
    // x
    if (Math.abs(dx) < 1e-9) { if (ax < x0 || ax > x1) continue; }
    else {
      let ta = (x0 - ax) / dx, tb = (x1 - ax) / dx;
      if (ta > tb) { const q = ta; ta = tb; tb = q; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) continue;
    }
    if (Math.abs(dy) < 1e-9) { if (ay < y0 || ay > y1) continue; }
    else {
      let ta = (y0 - ay) / dy, tb = (y1 - ay) / dy;
      if (ta > tb) { const q = ta; ta = tb; tb = q; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) continue;
    }
    if (Math.abs(dz) < 1e-9) { if (az < z0 || az > z1) continue; }
    else {
      let ta = (z0 - az) / dz, tb = (z1 - az) / dz;
      if (ta > tb) { const q = ta; ta = tb; tb = q; }
      if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
      if (t0 > t1) continue;
    }
    if (t0 > 0.001 && t0 < tMin) tMin = t0;
  }
  return tMin;
}

function updateCamera(dt) {
  // ---- 遠近 ----
  if (Input.zoomP) { Cam.zoomLv = (Cam.zoomLv + 1) % 3; Sound.play('cursor'); }
  if (Input.zoomStep) { Cam.zoomLv = clamp(Cam.zoomLv + Input.zoomStep, 0, 2); }
  Cam.dist = Cam.dists[Cam.zoomLv];
  Cam.distS = lerp(Cam.distS, Cam.dist, 1 - Math.exp(-dt * 6));

  // ---- 手動操作 ----
  const W = window.innerWidth, H = window.innerHeight;
  // タッチは画面の大きさに合わせる（横いっぱいなぞると約 1 周弱）
  const sens = Input.touchMode ? 6.5 / Math.max(W, H, 320) : 0.0055;
  let manual = false;
  if (Input.camDX || Input.camDY) {
    Cam.yaw -= Input.camDX * sens;
    Cam.pitch += Input.camDY * sens * 0.75;
    manual = true;
  }
  if (Input.camKey) { Cam.yaw -= Input.camKey * dt * 2.6; manual = true; }
  if (Input.camRX || Input.camRY) {
    Cam.yaw -= Input.camRX * Math.abs(Input.camRX) * dt * 3.4;
    Cam.pitch += Input.camRY * dt * 1.6;
    manual = true;
  }
  Cam.pitch = clamp(Cam.pitch, -0.12, 1.25);
  if (manual) { Cam.manualT = 0; Cam.resetT = 0; } else Cam.manualT += dt;

  if (Input.camResetP) { Cam.resetT = 0.6; Sound.play('cursor'); }

  // ---- 注視点（左右） ----
  const sp = Math.hypot(P.vx, P.vz);
  // 進む方向を少し先まで見せる
  const ahead = P.state === 'dead' ? 0 : clamp(sp / PL.RUN, 0, 1.3) * 1.1;
  const ax = sp > 0.1 ? (P.vx / sp) * ahead : 0, az = sp > 0.1 ? (P.vz / sp) * ahead : 0;
  Cam.aheadX = lerp(Cam.aheadX, ax, 1 - Math.exp(-dt * 2.5));
  Cam.aheadZ = lerp(Cam.aheadZ, az, 1 - Math.exp(-dt * 2.5));
  const oldTx = Cam.tx, oldTz = Cam.tz;
  Cam.tx = lerp(Cam.tx, P.x + Cam.aheadX, 1 - Math.exp(-dt * 9));
  Cam.tz = lerp(Cam.tz, P.z + Cam.aheadZ, 1 - Math.exp(-dt * 9));

  // ---- 注視点（上下）：立った高さを基準に、ばねでなめらかに ----
  if (P.state === 'dead') {
    // たおれたら、その高さで止める（島をつきぬけて雲の下まで追いかけない）。落ちてたおれたときは雲の上から見る
    Cam.baseY = Math.max(Cam.baseY, World.killY + 6);
  }
  else if (P.grounded) Cam.baseY = P.y;
  else if (P.y < Cam.baseY) Cam.baseY = P.y;                   // 下へ落ちるときはついていく
  else if (P.y > Cam.baseY + 3.2) Cam.baseY = P.y - 3.2;       // ばね・壁キックで高く上がるとき
  const tyWant = Cam.baseY + 1.2;
  // 目標の動く速さ（落下中などは追いかけ遅れが出ないように足す。段差で一気に変わったときは使わない）
  let vWant = (tyWant - Cam.lastWant) / Math.max(dt, 1e-4);
  if (Math.abs(tyWant - Cam.lastWant) > 0.3) vWant = 0;
  Cam.lastWant = tyWant;
  Cam.vWantS = lerp(Cam.vWantS, vWant, 1 - Math.exp(-dt * 8));
  // 臨界減衰ばね（行きすぎず、急に止まらない）。主人公が画面の端に近いほど固く
  const off = Math.abs(P.y + 1.2 - Cam.ty);
  const w = 5 + clamp((off - 2) / 2, 0, 1) * 3;
  const acc = w * w * (tyWant - Cam.ty) + 2 * w * (Cam.vWantS - Cam.vy);
  Cam.vy += acc * dt;
  Cam.ty += Cam.vy * dt;

  // ---- 向き：ひもでつながったカメラ ----
  if (!manual && Cam.resetT <= 0 && P.state !== 'dead') {
    // 前のフレームのカメラ位置から、動いた注視点を見たときの角度
    const ex = oldTx + Math.sin(Cam.yaw) * Cam.distS, ez = oldTz + Math.cos(Cam.yaw) * Cam.distS;
    const lx = ex - Cam.tx, lz = ez - Cam.tz;
    if (lx * lx + lz * lz > 0.01) Cam.yaw += angDiff(Cam.yaw, Math.atan2(lx, lz));
  }
  // ---- 手で動かしていない間だけ、ゆっくり後ろへ寄せる ----
  if (Cam.resetT > 0) {
    Cam.resetT -= dt;
    Cam.yaw += angDiff(Cam.yaw, P.yaw + Math.PI) * (1 - Math.exp(-dt * 10));
    Cam.pitch = lerp(Cam.pitch, 0.36, 1 - Math.exp(-dt * 8));
  } else if (Cam.manualT > 1.6 && P.state !== 'dead') {
    const d = angDiff(Cam.yaw, P.yaw + Math.PI);
    // 手前（カメラの方）へ走るときは回さない。横〜奥へ走っているときだけ
    if (P.grounded && sp > 4 && Math.abs(d) < 2.0) {
      Cam.yaw += d * clamp(sp / PL.RUN, 0, 1) * dt * 0.7;
    }
    // 上下の角度：高い所から下を見るときは少し見下ろす
    let pw = 0.36;
    if (!P.grounded && P.vy < -10) pw = 0.55;
    Cam.pitchAuto = lerp(Cam.pitchAuto, pw, 1 - Math.exp(-dt * 1.5));
    if (Cam.manualT > 3) Cam.pitch = lerp(Cam.pitch, Cam.pitchAuto, 1 - Math.exp(-dt * 0.8));
  }

  // ---- めり込み防止 ----
  const cp = Math.cos(Cam.pitch), spi = Math.sin(Cam.pitch);
  const dist = Cam.distS;
  const ox = Math.sin(Cam.yaw) * cp, oy = spi, oz = Math.cos(Cam.yaw) * cp;
  camWant[0] = Cam.tx + ox * dist; camWant[1] = Cam.ty + oy * dist; camWant[2] = Cam.tz + oz * dist;
  // 中心と、横・上下にずらした 4 本（画面の端が壁に入らないように）
  const rx = Math.cos(Cam.yaw) * 0.35, rz = -Math.sin(Cam.yaw) * 0.35;
  let t = camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0], camWant[1], camWant[2]);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0] + rx, camWant[1], camWant[2] + rz) + 0.04);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0] - rx, camWant[1], camWant[2] - rz) + 0.04);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0], camWant[1] + 0.3, camWant[2]) + 0.04);
  t = Math.min(t, camRay(Cam.tx, Cam.ty, Cam.tz, camWant[0], camWant[1] - 0.3, camWant[2]) + 0.04);
  const dWant = Math.max(0.4, dist * clamp(t, 0, 1) - 0.3);
  // さえぎられたらすぐ手前へ（壁の中を映さない）、離れるときはゆっくり
  Cam.shown = dWant < Cam.shown ? dWant : lerp(Cam.shown, dWant, 1 - Math.exp(-dt * 2.5));
  const eye = camTmpA;
  eye[0] = Cam.tx + ox * Cam.shown;
  eye[1] = Cam.ty + oy * Cam.shown;
  eye[2] = Cam.tz + oz * Cam.shown;
  // 地面の下に入らない
  const g = groundBelow(eye[0], eye[2], eye[1] + 0.6, 0.1);
  if (g && eye[1] < g.y + 0.4) eye[1] = g.y + 0.4;

  const tgt = camTmpB;
  tgt[0] = Cam.tx; tgt[1] = Cam.ty; tgt[2] = Cam.tz;
  if (Cam.override) {
    eye[0] = Cam.override.eye[0]; eye[1] = Cam.override.eye[1]; eye[2] = Cam.override.eye[2];
    tgt[0] = Cam.override.target[0]; tgt[1] = Cam.override.target[1]; tgt[2] = Cam.override.target[2];
  }
  if (Game.shake > 0) {
    const s = Math.min(Game.shake, 0.4) * 0.5;
    eye[0] += (Math.random() - 0.5) * s; eye[1] += (Math.random() - 0.5) * s; eye[2] += (Math.random() - 0.5) * s;
  }
  // 描画側に渡す（中身だけ書きかえる）
  Cam.eye[0] = eye[0]; Cam.eye[1] = eye[1]; Cam.eye[2] = eye[2];
  Cam.target[0] = tgt[0]; Cam.target[1] = tgt[1]; Cam.target[2] = tgt[2];
}

// ===== 60_models.js =====
// モデル（主人公・アイテム・敵・飾り）と、それを描く関数
// 色はシェーダーで線形化→トーンマップされるので、少し落ち着いた色で決めている
const COL = {
  body: hex(0xffa64a), bodyDk: hex(0xe47f2c), bodyLt: hex(0xffc477), belly: hex(0xfff0d4),
  scarf: hex(0x23b3a4), scarfDk: hex(0x168a80), scarfLt: hex(0xf3eedb),
  eye: hex(0x2a1c18), eyeLo: hex(0x5b3a2c), white: [1, 1, 1], cheek: hex(0xff8a95),
  foot: hex(0xd8752a), hand: hex(0xfff1d6), mouth: hex(0x7a2a2a), tongue: hex(0xff7d8a),
  grass: hex(0x86cf62), grassDk: hex(0x5fab4b), dirt: hex(0xbd8a5e), dirtDk: hex(0x8c6446),
  stone: hex(0xc4bfcc), stoneDk: hex(0x928ca3), wood: hex(0xc99059), woodDk: hex(0x97663f),
  ice: hex(0xc4ecff), lava: hex(0xff6a2a),
  acorn: hex(0xc98a3e), acornDk: hex(0x9a6129), acornCap: hex(0x7a5230), acornCapLt: hex(0x9b7048),
  seed: hex(0x9cfff0), seedDk: hex(0x3fcfc0), seedLt: hex(0xf0fffb), seedCore: hex(0xfff7a8),
  leaf: hex(0x62bf5c), leafDk: hex(0x3f9a4c), trunk: hex(0x9a6a42),
  flowerR: hex(0xff7593), flowerY: hex(0xffe066), flowerW: hex(0xffffff),
  enemy: hex(0xa486e6), enemyDk: hex(0x6c52b0), enemyLt: hex(0xd4c2ff),
  spike: hex(0x4e5068), spikeDk: hex(0x34364a), spikeTip: hex(0xfff3c4),
  heart: hex(0xff4f6d), heartLt: hex(0xff8ea0), cloud: hex(0xffffff), water: hex(0x5cc8ff),
};

const Models = {};

// 球面上にほぼ均等に点を並べる（フィボナッチ球）
function fibPoints(n) {
  const out = [];
  for (let i = 0; i < n; i++) {
    const y = 1 - (2 * (i + 0.5)) / n, r = Math.sqrt(1 - y * y), ph = i * 2.39996;
    out.push([Math.cos(ph) * r, y, Math.sin(ph) * r]);
  }
  return out;
}
// 向き dir に y 軸を合わせる行列（位置 p）
function alignY(p, dir, sx, sy, sz) {
  const y = v3.norm(dir);
  const a = Math.abs(y[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0];
  const x = v3.norm(v3.cross(a, y));
  const z = v3.cross(x, y);
  const m = new Float32Array(16);
  m[0] = x[0] * sx; m[1] = x[1] * sx; m[2] = x[2] * sx;
  m[4] = y[0] * sy; m[5] = y[1] * sy; m[6] = y[2] * sy;
  m[8] = z[0] * sz; m[9] = z[1] * sz; m[10] = z[2] * sz;
  m[12] = p[0]; m[13] = p[1]; m[14] = p[2]; m[15] = 1;
  return m;
}

function buildModels() {
  // ================= ころん（足元が原点、前が +z）=================
  {
    const g = new Geo();
    // 頭と体がひとつになった、おもちのような丸い体
    const head = (p) => {
      if (p[1] > 0.55) return mixc(COL.body, COL.bodyLt, (p[1] - 0.55) * 1.6);
      return mixc(COL.bodyDk, COL.body, clamp(p[1] * 0.7 + 0.75, 0, 1));
    };
    g.sphere(T(0, 0.7, 0, 0.6, 0.6, 0.56), head, 28, 18);
    // 下側のふくらみ（おなかは白っぽい）
    const lower = (p) => {
      const base = mixc(COL.bodyDk, COL.body, clamp(p[1] * 0.5 + 0.6, 0, 1));
      const k = smooth(clamp((p[2] - 0.25) / 0.3, 0, 1)) * smooth(clamp((0.85 - Math.abs(p[1] + 0.05)) / 0.25, 0, 1));
      return mixc(base, COL.belly, k);
    };
    g.sphere(T(0, 0.42, 0, 0.57, 0.4, 0.53), lower, 26, 14);
    // 口のまわり（ふっくらした白いマズル）
    g.sphere(T(0, 0.66, 0.44, 0.22, 0.14, 0.12), COL.belly, 16, 10);
    // 鼻
    g.sphere(T(0, 0.725, 0.555, 0.05, 0.035, 0.035), COL.eye, 10, 6);
    g.sphere(T(-0.015, 0.735, 0.585, 0.014, 0.01, 0.006), COL.white, 5, 3);
    // ほっぺ
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.35, 0.7, 0.425, 0.095, 0.058, 0.035, sx * 0.72), COL.cheek, 12, 6);
    // マフラー（しま模様）
    const stripe = (p) => {
      const u = Math.atan2(p[2], p[0]);
      return Math.floor((u / Math.PI) * 5 + 10) % 2 ? COL.scarf : mixc(COL.scarf, COL.scarfLt, 0.75);
    };
    g.torus(T(0, 0.5, 0, 1, 1, 0.97, 0, -0.06), stripe, 0.565, 0.1, 30, 10);
    // 結び目（背中側）
    g.sphere(T(0.2, 0.49, -0.56, 0.11, 0.1, 0.09, 0.4), COL.scarf, 10, 8);
    // 頭のてっぺんのくるんとした毛
    g.arc(T(0, 1.36, 0.02, 1, 1, 1, Math.PI / 2), COL.bodyLt, 0.075, 0.026, -0.9, Math.PI * 0.95, 10, 6);
    Models.body = g.mesh();
  }
  // 目（1つぶん）：黒目に大小2つのハイライト
  Models.eye = new Geo()
    .sphere(T(0, 0, 0, 0.088, 0.13, 0.052), (p) => mixc(COL.eye, COL.eyeLo, clamp(-p[1] * 1.4 - 0.2, 0, 1)), 14, 10)
    .sphere(T(0.026, 0.05, 0.042, 0.034, 0.038, 0.02), COL.white, 8, 6)
    .sphere(T(-0.028, -0.045, 0.045, 0.016, 0.016, 0.01), COL.white, 6, 4)
    .mesh();
  // にっこり目（^）と、ぎゅっと目
  Models.eyeHappy = new Geo().arc(T(0, -0.03, 0), COL.eye, 0.065, 0.019, 0.15, Math.PI - 0.15, 10, 5).mesh();
  // ぎゅっと目（> の形。左目は 180° 回して < にする）
  {
    const g = new Geo();
    const p0 = [-0.045, 0.045, 0], p1 = [0.04, 0, 0], p2 = [-0.045, -0.045, 0];
    for (const [a, c] of [[p0, p1], [p2, p1]]) {
      const d = v3.sub(c, a);
      g.cyl(alignY(a, d, 0.019, v3.len(d), 0.019), COL.eye, 6);
      g.sphere(T(a[0], a[1], a[2], 0.019, 0.019, 0.019), COL.eye, 6, 4);
    }
    g.sphere(T(p1[0], p1[1], p1[2], 0.02, 0.02, 0.02), COL.eye, 6, 4);
    Models.eyeX = g.mesh();
  }
  // 口（ω の形）と、開いた口
  {
    const g = new Geo();
    for (const sx of [-1, 1]) g.arc(T(sx * 0.034, 0, 0), COL.eye, 0.034, 0.011, Math.PI + 0.15, TAU - 0.1, 8, 5);
    Models.mouth = g.mesh();
    const o = new Geo();
    o.sphere(T(0, 0, 0, 0.065, 0.055, 0.03), COL.mouth, 12, 8);
    o.sphere(T(0, -0.025, 0.012, 0.04, 0.022, 0.02), COL.tongue, 10, 6);
    Models.mouthOpen = o.mesh();
  }
  // 耳（根もとが原点）
  Models.ear = new Geo()
    .sphere(T(0, 0.13, 0, 0.17, 0.165, 0.08), (p) => mixc(COL.body, COL.bodyLt, p[1] * 0.5 + 0.3), 14, 10)
    .sphere(T(0, 0.13, 0.04, 0.1, 0.1, 0.05), COL.cheek, 12, 8)
    .mesh();
  // しっぽ（ふわふわの丸）
  Models.tail = new Geo().sphere(T(0, 0, 0, 0.15, 0.14, 0.14), (p) => mixc(COL.body, COL.belly, p[2] * -0.5 + 0.5), 12, 8).mesh();
  // 足（底はクリーム色）、手
  Models.foot = new Geo().sphere(T(0, 0.085, 0.05, 0.155, 0.1, 0.205), (p, n) => (n[1] < -0.55 ? COL.belly : mixc(COL.foot, COL.body, p[1] * 0.5 + 0.5)), 14, 8).mesh();
  Models.hand = new Geo().sphere(T(0, 0, 0, 0.12, 0.12, 0.12), (p) => (p[1] < -0.35 || p[2] > 0.55 ? COL.belly : COL.body), 12, 8).mesh();
  // マフラーのしっぽ（上端が原点、下へ垂れる。先はしま）
  Models.scarfTail = new Geo()
    .cyl(T(0, -0.3, 0, 0.08, 0.3, 0.028), (p) => (p[1] < 0.18 ? COL.scarfLt : COL.scarf), 10)
    .mesh();

  // ================= どんぐり =================
  // たくさん置かれるので、遠く用のあらい形（lod）も作る。k: 細かさ（1 がふつう）
  const acornGeo = (k) => {
    const g = new Geo();
    const nut = (p) => mixc(COL.acornDk, COL.acorn, clamp(p[1] * 0.6 + 0.6, 0, 1));
    g.sphere(T(0, -0.02, 0, 0.26, 0.31, 0.26), nut, Math.round(16 * k), Math.max(4, Math.round(12 * k)));
    g.cyl(T(0, -0.36, 0, 0.06, 0.08, 0.06), COL.acornDk, Math.max(4, Math.round(6 * k)), { top: 0.2, bottom: 1 }); // とがった先
    // 帽子（あみ目もよう）
    const cap = (p, n) => {
      const u = Math.atan2(p[2], p[0]);
      const k = (Math.floor(u * 2.6 + p[1] * 6) + Math.floor(u * 2.6 - p[1] * 6)) % 2 === 0;
      return n[1] < -0.2 ? shade(COL.acornCap, 0.75) : k ? COL.acornCapLt : COL.acornCap;
    };
    g.sphere(T(0, 0.15, 0, 0.3, 0.17, 0.3), cap, Math.round(16 * k), Math.max(4, Math.round(8 * k)), { flat: true });
    g.cyl(T(0, 0.28, 0, 0.035, 0.13, 0.035, 0, 0, 0.25), COL.acornCap, Math.max(3, Math.round(6 * k)));
    return g;
  };
  Models.acorn = acornGeo(1).mesh();
  Models.acorn.lod = [{ d: 14, mesh: acornGeo(0.6).mesh() }, { d: 30, mesh: acornGeo(0.4).mesh() }];
  // ================= ひかりの種（芽の出た光る結晶）=================
  {
    const g = new Geo();
    const cry = (p) => {
      const y = p[1];
      return y < 1 ? mixc(COL.seedDk, COL.seed, y) : mixc(COL.seed, COL.seedLt, y - 1);
    };
    // 下は短め、上は長めの8角すい2つ
    const lo = (p) => cry([0, p[1] * 0.75, 0]);
    const hi = (p) => cry([0, 0.75 + p[1] * 1.25, 0]);
    g.cyl(T(0, 0, 0, 0.5, 0.55, 0.5), lo, 8, { bottom: 0, top: 1, flat: true, caps: false });
    g.cyl(T(0, 0.55, 0, 0.5, 0.95, 0.5), hi, 8, { bottom: 1, top: 0, flat: true, caps: false });
    // 寄りそう小さな結晶
    for (const [sx, sz, s, rz] of [[0.38, 0.1, 0.45, -0.5], [-0.33, -0.15, 0.38, 0.55]]) {
      const m = T(sx, 0.28, sz, 1, 1, 1, 0, 0, rz);
      g.cyl(M4.scale(M4.copy(m), 0.2 * s / 0.45, 0.25 * s / 0.45, 0.2 * s / 0.45), lo, 6, { bottom: 0, top: 1, flat: true, caps: false });
      const m2 = M4.translate(M4.copy(m), 0, 0.25 * s / 0.45, 0);
      g.cyl(M4.scale(m2, 0.2 * s / 0.45, 0.5 * s / 0.45, 0.2 * s / 0.45), hi, 6, { bottom: 1, top: 0, flat: true, caps: false });
    }
    // てっぺんの小さな芽（双葉）
    g.cyl(T(0, 1.42, 0, 0.025, 0.16, 0.025), COL.leafDk, 5);
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.11, 1.6, 0, 0.12, 0.035, 0.07, 0, 0, sx * -0.35), COL.leaf, 10, 6);
    Models.seed = g.mesh();
  }
  // ================= ハート =================
  {
    const g = new Geo();
    const hc = (p) => mixc(COL.heart, COL.heartLt, clamp(p[1] * 0.6 + 0.2, 0, 1));
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.13, 0.02, 0, 0.19, 0.31, 0.15, 0, 0, sx * -0.72), hc, 16, 12);
    g.sphere(T(-0.16, 0.16, 0.115, 0.05, 0.035, 0.02, 0, 0, 0.6), COL.white, 8, 4);
    Models.heart = g.mesh();
  }
  // ================= 敵：もこもこ（ふわふわの紫。踏める）=================
  // k: 細かさ（遠く用に k を小さくしたあらい形も作る）
  const blobGeo = (k) => {
    const g = new Geo();
    const sg = (a) => Math.max(4, Math.round(a * k));
    const fur = (p) => mixc(COL.enemyDk, COL.enemy, clamp(p[1] * 0.5 + 0.55, 0, 1));
    g.sphere(T(0, 0.56, 0, 0.6, 0.52, 0.6), fur, sg(18), sg(12));
    // まわりにふわふわの玉をくっつけて、もこもこの輪郭に
    for (const q of fibPoints(30)) {
      if (q[1] < -0.35) continue;
      if (q[2] > 0.45 && Math.abs(q[0]) < 0.62 && q[1] < 0.55) continue; // 顔はあける
      const p = [q[0] * 0.58, 0.56 + q[1] * 0.5, q[2] * 0.58];
      const s = 0.2 + (q[1] + 1) * 0.04;
      const lt = clamp(q[1] * 0.5 + 0.5, 0, 1);
      g.sphere(T(p[0], p[1], p[2], s, s * 0.9, s), (pp) => mixc(COL.enemyDk, mixc(COL.enemy, COL.enemyLt, lt * 0.45), clamp(pp[1] * 0.5 + 0.5 + lt * 0.3, 0, 1)), sg(10), sg(7));
    }
    // 目（白目＋黒目）と、怒りまゆ
    for (const sx of [-1, 1]) {
      g.sphere(T(sx * 0.2, 0.66, 0.5, 0.13, 0.15, 0.08, sx * 0.3), COL.white, sg(12), sg(8));
      g.sphere(T(sx * 0.17, 0.63, 0.57, 0.06, 0.08, 0.04, sx * 0.3), COL.eye, sg(10), sg(6));
      if (k >= 0.8) g.sphere(T(sx * 0.155, 0.66, 0.6, 0.02, 0.022, 0.01), COL.white, 6, 4);
      g.box(T(sx * 0.22, 0.83, 0.55, 0.2, 0.05, 0.06, sx * 0.3, 0, sx * -0.45), COL.enemyDk);
    }
    // 口とキバ
    g.arc(T(0, 0.48, 0.585, 1, 1, 1, 0, -0.2), COL.eye, 0.07, 0.014, 0.3, Math.PI - 0.3, 8, 4);
    g.cyl(T(0.05, 0.47, 0.595, 0.025, 0.05, 0.02, 0, Math.PI), COL.white, 5, { top: 0 });
    // 足
    for (const sx of [-1, 1]) g.sphere(T(sx * 0.28, 0.09, 0.1, 0.17, 0.1, 0.22), COL.enemyDk, sg(10), sg(6));
    return g;
  };
  Models.blob = blobGeo(1).mesh();
  Models.blob.lod = [{ d: 16, mesh: blobGeo(0.6).mesh() }, { d: 34, mesh: blobGeo(0.4).mesh() }];
  // ================= 敵：トゲコロ（トゲ玉。踏めない）=================
  const spikyGeo = (k) => {
    const g = new Geo();
    g.sphere(T(0, 0, 0, 0.66, 0.66, 0.66), (p) => mixc(COL.spikeDk, COL.spike, p[1] * 0.4 + 0.6), Math.round(16 * k), Math.max(5, Math.round(12 * k)));
    for (const q of fibPoints(26)) {
      const m = alignY([q[0] * 0.55, q[1] * 0.55, q[2] * 0.55], q, 0.17, 0.52, 0.17);
      g.cyl(m, (p) => (p[1] > 0.62 ? COL.spikeTip : mixc(COL.spike, hex(0x8a8ca8), p[1])), Math.max(4, Math.round(7 * k)), { top: 0, caps: false });
    }
    return g;
  };
  Models.spiky = spikyGeo(1).mesh();
  Models.spiky.lod = [{ d: 18, mesh: spikyGeo(0.6).mesh() }];
  // ---- 影・粒・輪（他のファイルからも使う）----
  Models.shadow = new Geo().disc(T(), [0, 0, 0], 20).mesh();
  Models.puff = new Geo().sphere(T(), WHITE, 8, 6, { flat: true }).mesh();
  Models.ring = new Geo().torus(T(), WHITE, 1, 0.08, 28, 4).mesh();
  Models.cube = new Geo().box(T(), WHITE).mesh();
  Models.flag = (() => {
    const g = new Geo();
    g.cyl(T(0, 0, 0, 0.08, 3, 0.08), COL.white, 8);
    g.sphere(T(0, 3.05, 0, 0.16, 0.16, 0.16), COL.flowerY, 8, 6);
    return g.mesh();
  })();
  Models.flagCloth = new Geo().box(T(0.5, 2.6, 0, 1, 0.6, 0.05), COL.scarf).mesh();
  // デバッグ用の名前（R.stats で使う）
  for (const k in Models) if (Models[k] && Models[k].count) Models[k].name = k;
}

// ---------- ころんを描く ----------
// P の状態を読んで、姿勢・表情・マフラーのなびきを決める。
// ポーズが切り替わるときは、前のポーズから短い時間で混ぜてつなぐ（PoseMix）。
// drawPlayer は影用（R.pass === 'shadow'）と本番で1フレームに2回呼ばれるので、
// 混ぜ具合や「直前に何をしたか」の記録は本番の描画のときだけ進める。
const POSE_N = 24; // 手(3×2) 足(4×2) と、体の角度・位置・耳 10こ
const PoseMix = {
  key: '',                         // いまのポーズの名前
  from: new Float32Array(POSE_N),  // 切り替わる直前に描いていたポーズ
  last: new Float32Array(POSE_N),  // 前のフレームに描いたポーズ
  cur: new Float32Array(POSE_N),   // 作業用
  fade: 1, dur: 0.1,
  lastNow: 0,
  wallSide: 1,                     // 壁ずり落ち：壁が体の右(+1)か左(-1)か
  wasWall: false, wallKickT: 9,    // 壁キックしてからの時間
  wasPoundT: 0, poundJump: false,  // ヒップドロップ後の大ジャンプ中
  sideFrom: Math.PI,               // くるりんジャンプ：もとの向きと新しい向きの差
};
// ポーズごとのつなぎ時間（秒）。書いていないものは 0.1
const POSE_DUR = {
  skid: 0.05, side: 0.06, dive: 0.07, slide: 0.06, bslide: 0.12, p1: 0.04, p2: 0.04, p3: 0.05,
  kick: 0.04, wall: 0.1, wkick: 0.06, up: 0.05, ground: 0.08, pland: 0.04, pjump: 0.06, pspin: 0.05, pound: 0.05,
};
function poseDur(from, to) {
  if (from === 'slide' && to === 'ground') return 0.22; // おなかすべりから、よいしょと起きあがる
  if (from === 'skid' && to === 'ground') return 0.14;
  if (from === 'wall') return 0.08;
  return POSE_DUR[to] || 0.1;
}

function drawPlayer() {
  if (P.inv > 0 && P.state !== 'dead' && Math.floor(P.inv * 14) % 2 === 0) return;
  const shadowPass = R.pass === 'shadow';
  const PM = PoseMix;
  const t = Game.time;
  const st = P.state;
  const air = !P.grounded && st !== 'win' && st !== 'dead';
  // 本番の描画のときだけ時間を進める（影用では進めない）
  let dt = 0, snap = PM.key === '';
  if (!shadowPass) {
    const now = performance.now() / 1000;
    const gap = now - PM.lastNow;
    if (gap > 0.5) snap = true; // しばらく描いていなかった（タイトルなど）
    dt = clamp(gap, 0, 0.1);
    PM.lastNow = now;
    // ---- 直前にしたことを覚える ----
    // 壁キック：壁にくっついていた次の瞬間に、上へはね返った
    if (!air) PM.wallKickT = 9;
    else if (PM.wasWall && !P.wall && P.vy > 8 && P.airT < 0.08) PM.wallKickT = 0;
    else PM.wallKickT += dt;
    PM.wasWall = air && !!P.wall;
    // ヒップドロップ着地の直後に跳んだ
    if (!air) PM.poundJump = false;
    else if (PM.wasPoundT > 0 && P.flip && P.vy > 10) PM.poundJump = true;
    PM.wasPoundT = P.grounded ? P.poundT : 0;
    // ブレーキ中：くるりんジャンプしたときに、もとの向きから回って見せるため
    if (P.skidT > 0) PM.sideFrom = -angDiff(P.yaw, P.skidYaw) || Math.PI;
  }
  const ph = P.anim;
  const hsp = Math.hypot(P.vx, P.vz);
  // 崖から歩いて出た直後（コヨーテ時間）は、まだ走りの形のまま
  const coyote = air && st === 'air' && P.coyote > 0 && P.vy <= 0 && !P.flip;
  const groundLike = st === 'ground' || st === 'punch' || coyote;
  const run = groundLike && Math.abs(P.speed) > 0.3 ? clamp(Math.abs(P.speed) / PL.RUN, 0.25, 1) : 0;
  const flipping = air && P.flip && Math.abs(P.flip) < TAU * 0.92;
  const curling = flipping && !P.sideFlip && !PM.poundJump;
  const poundSpin = st === 'pound' && P.stateT < 0.22;

  // ---- 体の姿勢 ----
  let lean = 0, roll = 0, twist = 0, bob = 0, sq = P.squash;
  let pitch = 0;          // 体のまん中を軸に前へ倒す（ダイブ・おなかすべり）
  let yawOff = 0;         // 向きのずらし（壁ずり落ち）
  let offX = 0, offZ = 0; // 体の位置のずらし（壁から少しはなす）
  let spin = 0;           // その場での1回転（まわしげり）。1回転で元にもどるので混ぜない
  let eyes = 'open', mouth = 'smile', earX = 0, earZ = 0;
  let key = 'ground';
  // 手足の位置（side=+1 が右）
  const hands = [[-0.6, 0.56, 0.04], [0.6, 0.56, 0.04]];
  const feet = [[-0.23, 0, 0, 0], [0.23, 0, 0, 0]]; // x, y, z, 角度

  if (groundLike) {
    // 呼吸
    sq *= 1 + Math.sin(t * 3.2) * 0.022;
    hands[0][1] += Math.sin(t * 3.2) * 0.015; hands[1][1] += Math.sin(t * 3.2) * 0.015;
    if (run) {
      const s1 = Math.sin(ph), c1 = Math.cos(ph);
      bob = Math.abs(Math.sin(ph)) * 0.11 * run;
      lean = run * 0.3;
      roll = s1 * 0.07 * run;
      twist = s1 * 0.16 * run;
      sq *= 1 + (Math.abs(c1) - 0.5) * 0.06 * run; // 一歩ごとに少し伸び縮み
      for (let i = 0; i < 2; i++) {
        const sd = i ? 1 : -1, s = sd * s1, c = sd * c1;
        feet[i][2] = s * 0.34 * run;
        feet[i][1] = Math.max(0, c) * 0.2 * run;
        feet[i][3] = -c * 0.6 * run;
        hands[i][2] = -s * 0.32 * run + 0.02;
        hands[i][1] = 0.55 + Math.abs(s) * 0.06 * run;
        hands[i][0] = sd * (0.6 - 0.05 * run);
      }
      earX = -0.35 * run + Math.sin(ph * 2) * 0.12 * run;
    } else {
      // 立ち止まり：ときどき耳がぴくっと動く
      const tw = (t % 4.3) < 0.18 ? Math.sin((t % 4.3) / 0.18 * Math.PI) * 0.3 : 0;
      earZ = tw;
    }
    if (coyote) { mouth = 'open'; hands[0][1] += 0.12; hands[1][1] += 0.12; } // あれっ、足もとがない
  }
  if (st === 'ground') {
    if (P.skidT > 0) {
      // ブレーキ：前に出した足でふんばって、体は後ろへのけぞる。手はばたばた
      key = 'skid';
      const wob = Math.sin(t * 38) * 0.06;
      lean = -0.42; bob = -0.02; sq *= 0.93;
      roll = wob * 0.5;
      twist = clamp(angDiff(P.yaw, P.skidYaw), -1, 1) * 0.22; // 行きたい方へ少し顔を向ける
      feet[0] = [-0.27, -0.17, 0.4, -0.2];  // 前の足：つま先を上げて地面をける
      feet[1] = [0.25, 0.02, -0.02, 0.42];  // 後ろの足：ぺたっと地面に
      hands[0] = [-0.74, 0.92 + wob, -0.2]; hands[1] = [0.74, 0.92 - wob, -0.2];
      eyes = 'hurt'; mouth = 'open'; earX = 0.8; earZ = 0.15;
    } else if (P.slideT > 0) {
      // おなかすべり：腹ばいで両手を前へ、足は後ろでぱたぱた
      key = 'slide';
      pitch = 1.25;
      sq = lerp(sq, 1, 0.6);
      roll = Math.sin(t * 16) * 0.05;
      hands[0] = [-0.4, 1.2, 0.56]; hands[1] = [0.4, 1.2, 0.56];
      for (let i = 0; i < 2; i++) {
        const sd = i ? 1 : -1;
        const kk = Math.sin(t * 14 + i * Math.PI); // ひざを曲げて、足のうらを上に向けてぱたぱた
        feet[i] = [sd * 0.2, -0.02 + kk * 0.04, -0.32 - kk * 0.06, 1.85 + kk * 0.4];
      }
      eyes = 'happy'; mouth = 'open'; earX = -0.9;
    } else if (P.crouching && P.groundS && P.groundS.ramp && P.speed > 3) {
      // しゃがんで坂すべり：おしりですべって、両手をあげる
      key = 'bslide';
      lean = -0.28; sq = Math.min(sq, 0.82);
      roll = Math.sin(t * 9) * 0.05;
      feet[0] = [-0.22, -0.06, 0.36, -0.45]; feet[1] = [0.22, -0.06, 0.36, -0.45];
      hands[0] = [-0.62, 1.0, 0.02]; hands[1] = [0.62, 1.0, 0.02];
      eyes = 'happy'; mouth = 'open'; earX = -0.55;
    } else if (P.poundT > 0) {
      // ヒップドロップの着地：足をひらいて、どすん
      key = 'pland';
      feet[0] = [-0.33, 0, 0.06, 0]; feet[1] = [0.33, 0, 0.06, 0];
      hands[0] = [-0.7, 0.4, 0.14]; hands[1] = [0.7, 0.4, 0.14];
      eyes = 'hurt'; mouth = 'open'; earX = 0.6; earZ = 0.25;
    } else if (P.crouching) {
      key = 'crouch';
      sq = Math.min(sq, 0.74);
      hands[0] = [-0.55, 0.34, 0.2]; hands[1] = [0.55, 0.34, 0.2];
      earX = 0.7;
    }
  }
  if (air && st !== 'pound' && !coyote) {
    const up = P.vy > 0;
    key = up ? 'up' : 'down';
    sq *= 1 + clamp(P.vy * 0.006, -0.06, 0.1);
    mouth = up ? 'open' : 'smile';
    if (up) {
      // 上昇中：両手を上げてばんざい、足は前後に
      hands[0] = [-0.58, 0.98, 0.0]; hands[1] = [0.58, 0.98, 0.0];
      if (P.jumpN === 2) { hands[0] = [-0.7, 0.8, -0.05]; hands[1] = [0.42, 1.05, 0.15]; }
      feet[0] = [-0.22, 0.14, 0.18, -0.5]; feet[1] = [0.22, 0.04, -0.16, 0.4];
      earX = -0.4;
    } else {
      // 落下中：手を広げて、耳がふわっと
      const fl = Math.sin(t * 22) * 0.04;
      hands[0] = [-0.7, 0.82 + fl, 0.02]; hands[1] = [0.7, 0.82 - fl, 0.02];
      feet[0] = [-0.24, 0.02, 0.08, 0.3]; feet[1] = [0.24, 0.06, -0.04, -0.2];
      earX = 0.22;
    }
    if (P.longJump && !P.dive) {
      // 幅とび：体を前に倒し、手を前に伸ばす
      key = 'long';
      lean = 1.15;
      hands[0] = [-0.42, 0.75, 0.42]; hands[1] = [0.42, 0.75, 0.42];
      feet[0] = [-0.22, 0.12, -0.25, 0.9]; feet[1] = [0.22, 0.12, -0.25, 0.9];
      earX = -0.6;
      mouth = 'open';
    }
    if (PM.wallKickT < 0.32 && P.vy > 0 && !flipping) {
      // 壁キックの直後：手を前に、足は後ろへけり出した形で、壁からぴょーん
      key = 'wkick';
      lean = 0.3 * (1 - PM.wallKickT / 0.32);
      hands[0] = [-0.6, 1.05, 0.22]; hands[1] = [0.6, 1.05, 0.22];
      feet[0] = [-0.2, 0.16, -0.34, 0.95]; feet[1] = [0.2, 0.06, -0.26, 0.7];
      eyes = 'open'; mouth = 'open'; earX = -0.7;
    }
    if (curling) {
      // 宙返り中は丸くなる
      key = 'curl';
      hands[0] = [-0.45, 0.6, 0.38]; hands[1] = [0.45, 0.6, 0.38];
      feet[0] = [-0.2, 0.22, 0.25, -1.0]; feet[1] = [0.2, 0.22, 0.25, -1.0];
      eyes = 'happy';
      earX = -0.5;
    } else if (flipping && P.sideFlip) {
      // くるりんジャンプ：手足を大の字に広げて、横向きにくるっと（回転は下の行列で）
      key = 'side';
      hands[0] = [-0.8, 0.98, 0.04]; hands[1] = [0.8, 0.98, 0.04];
      feet[0] = [-0.34, 0.03, 0, 0.15]; feet[1] = [0.34, 0.03, 0, 0.15];
      eyes = 'happy'; mouth = 'open'; earX = -0.2; earZ = 0.35;
    } else if (flipping && PM.poundJump) {
      // ヒップドロップ後の大ジャンプ：両手をそろえてまっすぐ上へ、きりもみ回転
      key = 'pjump';
      sq *= 1.08;
      hands[0] = [-0.22, 1.33, 0.03]; hands[1] = [0.22, 1.33, 0.03];
      feet[0] = [-0.1, -0.05, 0, 0.4]; feet[1] = [0.1, -0.05, 0, 0.4];
      eyes = 'happy'; mouth = 'open'; earX = -0.35;
    }
    if (P.kickT > 0 && !P.dive) {
      // 空中キック：片足をぴんと前へ、体は少し後ろへ
      key = 'kick';
      feet[1] = [0.18, 0.4, 0.55, -1.35]; feet[0] = [-0.2, 0.2, -0.12, 0.5];
      hands[0] = [-0.66, 0.85, -0.12]; hands[1] = [0.6, 0.72, -0.2];
      lean = -0.3;
      eyes = 'hurt'; mouth = 'open'; earX = 0.4;
    }
    if (P.dive) {
      // ダイブ：体を前へ倒し、両手を頭の先へのばして飛びこむ
      key = 'dive';
      lean = 0;
      pitch = 1.0 + clamp(-P.vy * 0.025, -0.15, 0.25);
      sq = lerp(sq, 1.06, 0.7);
      hands[0] = [-0.32, 1.36, 0.34]; hands[1] = [0.32, 1.36, 0.34];
      feet[0] = [-0.2, 0.04, -0.16, 1.1]; feet[1] = [0.2, 0.1, -0.12, 1.25];
      eyes = 'open'; mouth = 'open'; earX = -0.9;
    }
    if (P.wallSlide && P.wall) {
      // 壁ずり落ち：体を横向きにして壁に手と足をつき、ずずずと落ちる
      key = 'wall';
      const W = Math.atan2(-P.wall.nx, -P.wall.nz); // 壁の方向
      if (!shadowPass && PM.key !== 'wall') PM.wallSide = angDiff(P.yaw, W) >= 0 ? 1 : -1;
      const sd = PM.wallSide, A = 1.1;
      yawOff = angDiff(P.yaw, W - sd * A);
      const wx = sd * Math.sin(A), wz = Math.cos(A); // 体から見た壁の方向
      offX = -wx * 0.16; offZ = -wz * 0.16;
      const jit = Math.sin(t * 34) * 0.012;
      bob = jit;
      lean = -0.1; roll = sd * 0.12;
      const iw = sd > 0 ? 1 : 0;
      hands[iw] = [wx * 0.58, 1.02 + jit, wz * 0.58];
      hands[1 - iw] = [-sd * 0.7, 0.74, 0.16];
      feet[iw] = [wx * 0.44, 0.3, wz * 0.44, -0.4];
      feet[1 - iw] = [-sd * 0.2, -0.02, -0.04, 0.25];
      eyes = 'hurt'; mouth = 'smile';
      earX = 0.35 + Math.sin(t * 25) * 0.1;
    }
  }
  if (st === 'pound') {
    if (poundSpin) {
      key = 'pspin';
      hands[0] = [-0.45, 0.62, 0.36]; hands[1] = [0.45, 0.62, 0.36];
      feet[0] = [-0.2, 0.24, 0.26, -1.0]; feet[1] = [0.2, 0.24, 0.26, -1.0];
      eyes = 'happy';
    } else {
      // 急降下：足をそろえて下へ、手は上へ
      key = 'pound';
      sq *= 1.1;
      hands[0] = [-0.42, 1.08, -0.05]; hands[1] = [0.42, 1.08, -0.05];
      feet[0] = [-0.13, -0.04, 0, 0.15]; feet[1] = [0.13, -0.04, 0, 0.15];
      eyes = 'hurt';
      earX = 0.5;
    }
  }
  if (st === 'punch') {
    const n = P.punchN || 1;
    mouth = 'open';
    if (n < 3) {
      // 1発目は右手、2発目は左手のストレート。すばやく出して、ゆっくりもどす
      key = 'p' + n;
      const s = P.stateT, T0 = 0.07;
      const k = s < T0 ? smooth(s / T0) : 1 - smooth(clamp((s - T0) / 0.25, 0, 1)) * 0.8;
      const sd = n === 1 ? 1 : -1;
      const iP = n === 1 ? 1 : 0, iB = 1 - iP;
      hands[iP] = [sd * (0.3 - k * 0.1), 0.68, 0.14 + k * 0.64];
      hands[iB] = [-sd * 0.56, 0.6, -0.05 - 0.2 * k];
      twist = -sd * k * 0.5;
      lean = 0.2 * k;
      roll = sd * 0.04 * k;
      feet[iB][2] = 0.16 * k; feet[iP][2] = -0.12 * k;
      if (n === 2) eyes = 'hurt';
    } else {
      // 3発目：まわしげり。その場で1回転しながら、右足を横へのばす
      key = 'p3';
      const u = clamp(P.stateT / 0.42, 0, 1);
      spin = -smooth(clamp(u / 0.78, 0, 1)) * TAU;
      const ext = Math.sin(clamp(u / 0.85, 0, 1) * Math.PI);
      feet[1] = [0.28 + ext * 0.56, 0.06 + ext * 0.4, 0.04 + ext * 0.12, -0.2 - ext * 0.5];
      feet[0] = [-0.14, 0, 0.02, 0.05];
      hands[0] = [-0.48, 0.78, 0.28]; hands[1] = [0.58, 0.84, -0.18];
      lean = -0.08 * ext; roll = ext * 0.3; bob = ext * 0.1;
      twist = 0;
      eyes = 'hurt'; earX = 0.3 * ext; earZ = 0.3 * ext;
    }
  }
  if (st === 'hurt' || st === 'dead') {
    key = 'hurt';
    const fl = Math.sin(t * 30) * 0.06;
    lean = -0.35;
    hands[0] = [-0.72, 0.95 + fl, 0.05]; hands[1] = [0.72, 0.95 - fl, 0.05];
    feet[0] = [-0.25, 0.1, 0.18, -0.6]; feet[1] = [0.25, 0.05, 0.1, -0.4];
    eyes = 'hurt'; mouth = 'open'; earX = 0.4;
  }
  if (st === 'win') {
    // 勝利ポーズ：ぴょんぴょん跳ねて、両手を上げる
    key = 'win';
    const hop = Math.abs(Math.sin(ph * 0.75));
    bob = hop * 0.32;
    sq *= 1 + (hop - 0.5) * 0.14;
    const w = Math.sin(ph * 2) * 0.08;
    hands[0] = [-0.52, 1.18 - w, 0.08]; hands[1] = [0.52, 1.18 + w, 0.08];
    feet[0] = [-0.22, hop * 0.06, 0.05, -0.3 * hop]; feet[1] = [0.22, hop * 0.06, 0.05, -0.3 * hop];
    eyes = 'happy'; mouth = 'open';
    roll = Math.sin(ph * 0.75) * 0.08;
    earX = -0.2 * hop; earZ = 0.15 * hop;
  }

  // ---- 前のポーズからなめらかにつなぐ ----
  {
    const c = PM.cur;
    c.set(hands[0], 0); c.set(hands[1], 3); c.set(feet[0], 6); c.set(feet[1], 10);
    c[14] = lean; c[15] = roll; c[16] = twist; c[17] = bob; c[18] = pitch;
    c[19] = yawOff; c[20] = offX; c[21] = offZ; c[22] = earX; c[23] = earZ;
    if (!shadowPass) {
      if (snap) { PM.key = key; PM.fade = 1; }
      else if (key !== PM.key) { PM.dur = poseDur(PM.key, key); PM.key = key; PM.from.set(PM.last); PM.fade = 0; }
      PM.fade = Math.min(1, PM.fade + dt / PM.dur);
    }
    if (PM.fade < 1) {
      const w = smooth(PM.fade), f = PM.from;
      for (let i = 0; i < POSE_N; i++) c[i] = f[i] + (c[i] - f[i]) * w;
    }
    if (!shadowPass) PM.last.set(c);
    for (let i = 0; i < 3; i++) { hands[0][i] = c[i]; hands[1][i] = c[3 + i]; }
    for (let i = 0; i < 4; i++) { feet[0][i] = c[6 + i]; feet[1][i] = c[10 + i]; }
    lean = c[14]; roll = c[15]; twist = c[16]; bob = c[17]; pitch = c[18];
    yawOff = c[19]; offX = c[20]; offZ = c[21]; earX = c[22]; earZ = c[23];
  }

  // ---- 体の行列 ----
  const m = Tt(P.x, P.y, P.z);
  M4.rotY(m, P.yaw + yawOff + spin);
  if (P.flip && st !== 'dead') {
    // 宙返り：回りすぎないよう1回転でとめ、終わりぎわはゆっくり
    const a = Math.min(Math.abs(P.flip), TAU);
    const e = a < TAU * 0.85 ? a : TAU * 0.85 + (a - TAU * 0.85) * 0.6 + smooth((a - TAU * 0.85) / (TAU * 0.15)) * TAU * 0.06;
    M4.translate(m, 0, 0.65, 0);
    if (P.sideFlip) {
      // くるりんジャンプ：もとの向きからくるっと振り向きつつ、横に1回転
      M4.rotY(m, PM.sideFrom * (1 - smooth(clamp(a / (TAU * 0.6), 0, 1))));
      M4.rotZ(m, (PM.sideFrom >= 0 ? 1 : -1) * e);
    } else if (PM.poundJump) {
      M4.rotY(m, -e); // きりもみ
    } else {
      M4.rotX(m, Math.sign(P.flip) * e);
    }
    M4.translate(m, 0, -0.65, 0);
  }
  if (st === 'dead') { M4.translate(m, 0, 0.7, 0); M4.rotZ(m, P.flip); M4.translate(m, 0, -0.7, 0); }
  M4.translate(m, offX, bob, offZ);
  if (twist) M4.rotY(m, twist);
  if (lean) M4.rotX(m, lean);
  if (pitch) { M4.translate(m, 0, 0.6, 0); M4.rotX(m, pitch); M4.translate(m, 0, -0.6, 0); }
  if (roll) M4.rotZ(m, roll);
  // つぶれ・伸び（体積を保つように横も変える）
  const sxz = 1 / Math.sqrt(sq);
  const body = Mt(m);
  M4.scale(body, sxz, sq, sxz);
  drawMesh(Models.body, body);

  // ---- 顔 ----
  if (!shadowPass) {
    // まばたき：3.4秒ごと、ときどき2回
    const bt = (t + 0.4) % 3.4, cyc = Math.floor((t + 0.4) / 3.4);
    let blink = 1;
    if (bt < 0.14) blink = 0.08 + Math.abs(bt - 0.07) / 0.07 * 0.92;
    else if (cyc % 3 === 1 && bt > 0.24 && bt < 0.38) blink = 0.08 + Math.abs(bt - 0.31) / 0.07 * 0.92;
    if (P.crouching) blink = Math.min(blink, 0.55);
    for (const sd of [-1, 1]) {
      const e = Mt(body);
      M4.translate(e, sd * 0.2, 0.86, 0.474);
      M4.rotY(e, sd * 0.36);
      if (eyes === 'open') {
        M4.scale(e, 1, blink, 1);
        drawMesh(Models.eye, e);
      } else if (eyes === 'happy') {
        M4.translate(e, 0, -0.01, 0.04);
        drawMesh(Models.eyeHappy, e);
      } else {
        // ぎゅっと目（> <）
        M4.translate(e, 0, 0, 0.045);
        if (sd > 0) M4.rotZ(e, Math.PI);
        drawMesh(Models.eyeX, e);
      }
    }
    const mo = Mt(body);
    if (mouth === 'open') {
      M4.translate(mo, 0, 0.625, 0.545);
      M4.rotX(mo, -0.25);
      drawMesh(Models.mouthOpen, mo);
    } else {
      M4.translate(mo, 0, 0.675, 0.565);
      M4.rotX(mo, -0.3);
      drawMesh(Models.mouth, mo);
    }
  }
  // ---- 耳 ----
  for (const sd of [-1, 1]) {
    const e = Mt(body);
    M4.translate(e, sd * 0.3, 1.1, -0.04);
    M4.rotZ(e, sd * (-0.42 - earZ));
    M4.rotX(e, -0.1 + earX);
    drawMesh(Models.ear, e);
  }
  // ---- しっぽ ----
  {
    const tl = Mt(body);
    M4.translate(tl, 0, 0.34, -0.53);
    M4.rotY(tl, Math.sin(t * (run ? 14 : 5)) * 0.3);
    drawMesh(Models.tail, tl);
  }
  // ---- 足 ----
  for (let i = 0; i < 2; i++) {
    const f = Mt(m);
    const [fx, fy, fz, fa] = feet[i];
    M4.translate(f, fx, fy, fz);
    if (fa) M4.rotX(f, fa);
    M4.scale(f, Math.min(1.1, sxz), 1, 1);
    drawMesh(Models.foot, f);
  }
  // ---- 手（体のつぶれに合わせて高さも動かす）----
  for (let i = 0; i < 2; i++) {
    const hd = Mt(m);
    const [hx, hy, hz] = hands[i];
    M4.translate(hd, hx * sxz, hy * sq, hz);
    drawMesh(Models.hand, hd);
  }
  // ---- マフラーのしっぽ（2本。速さと落下でなびく）----
  {
    const wind = clamp(hsp / PL.RUN, 0, 1) + (air ? clamp(Math.abs(P.vy) / 20, 0, 0.7) : 0);
    for (const sd of [-1, 1]) {
      const fl1 = Math.sin(t * 13 + sd) * (0.08 + wind * 0.14);
      const fl2 = Math.sin(t * 15 + 1.3 + sd) * (0.12 + wind * 0.22);
      const s = Mt(body);
      M4.translate(s, 0.2 + sd * 0.05, 0.47, -0.6);
      M4.rotY(s, 0.25 + sd * 0.22);
      M4.rotZ(s, sd * 0.12);
      M4.rotX(s, 0.25 + wind * 1.05 + fl1);
      drawMesh(Models.scarfTail, s);
      M4.translate(s, 0, -0.28, 0);
      M4.rotX(s, 0.1 + wind * 0.35 + fl2);
      M4.scale(s, 0.92, 0.85, 1);
      drawMesh(Models.scarfTail, s);
    }
  }
}

// 丸い影を地面に落とす（着地位置の目安。本物の影と重なるので控えめ）
function drawShadow(x, y, z, r, a = 0.32) {
  if (R.pass === 'shadow') return;
  const g = groundBelow(x, z, y + 0.2, 0);
  if (!g) return;
  const h = y - g.y;
  const k = clamp(1 - h / 14, 0.25, 1);
  Sprites.add(x, g.y + 0.03, z, r * 1.25 * (0.6 + 0.4 * k), 3, 0.12, 0.1, 0.2, a * k * 0.8);
}

// ---------- 粒子 ----------
// 種類：ふつうの粒（土ぼこり）／光る粒（emit）／星（star）／輪（ring）／閃光（flash）
const Fx = {
  list: [],
  // 上限は画質しだい（Perf.fxMax）。画質が低いときは、出す数も減らす（scaleN）
  add(o) { if (this.list.length < Perf.fxMax) this.list.push(o); },
  scaleN(n) { return Perf.q.fx >= 1 ? n : Math.max(1, Math.round(n * Perf.q.fx)); },
  dust(x, y, z, n) {
    n = this.scaleN(n);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, s = 1 + Math.random() * 2;
      this.add({ x: x + Math.cos(a) * 0.3, y: y + 0.12, z: z + Math.sin(a) * 0.3, vx: Math.cos(a) * s, vy: 0.8 + Math.random() * 1.4, vz: Math.sin(a) * s, life: 0.55, max: 0.55, size: 0.2 + Math.random() * 0.14, col: [0.96, 0.92, 0.84], grav: -1.5, alpha: 0.55, drag: 3 });
    }
  },
  skid(x, y, z) { if (Math.random() < 0.5) this.dust(x, y, z, 1); },
  burst(x, y, z, col, n, sp) {
    const n0 = n;
    n = this.scaleN(n);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * TAU, b = Math.random() * Math.PI - Math.PI / 2, s = sp * (0.5 + Math.random() * 0.7);
      this.add({ x, y, z, vx: Math.cos(a) * Math.cos(b) * s, vy: Math.sin(b) * s + 2, vz: Math.sin(a) * Math.cos(b) * s, life: 0.6, max: 0.6, size: 0.12 + Math.random() * 0.1, col, grav: 10, alpha: 1, emit: 1, star: i % 3 === 0, drag: 1.5, rot: Math.random() * TAU });
    }
    // はじける瞬間の光
    this.add({ flash: true, x, y, z, life: 0.22, max: 0.22, size: 0.5 + sp * 0.12, col: mixc(col, [1, 1, 1], 0.5) });
    if (n0 >= 10) this.add({ ring: true, air: true, x, y, z, life: 0.35, max: 0.35, size: 0.3, col: mixc(col, [1, 1, 1], 0.4) });
  },
  sparkle(x, y, z, col) {
    this.add({ x: x + (Math.random() - 0.5), y: y + (Math.random() - 0.5), z: z + (Math.random() - 0.5), vx: 0, vy: 0.8, vz: 0, life: 0.7, max: 0.7, size: 0.1, col, grav: 0, alpha: 1, emit: 1, star: true, rot: Math.random() * TAU });
  },
  ring(x, y, z) { this.add({ ring: true, x, y, z, life: 0.45, max: 0.45, size: 0.5, col: [1, 0.97, 0.9] }); },
  update(dt) {
    // 消えた粒は、配列を作り直さずに詰めて取りのぞく
    const L = this.list;
    let j = 0;
    for (let i = 0; i < L.length; i++) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) continue;
      L[j++] = p;
      if (p.ring || p.flash) continue;
      p.vy -= p.grav * dt;
      if (p.drag) { const k = Math.exp(-p.drag * dt); p.vx *= k; p.vz *= k; }
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
    }
    L.length = j;
  },
  draw() {
    for (const p of this.list) {
      const k = p.life / p.max;
      const c = p.col;
      if (p.ring) {
        const r = p.size + (1 - k) * (p.air ? 1.8 : 3.5);
        Sprites.add(p.x, p.y + 0.06, p.z, r, 4, c[0], c[1], c[2], k * 0.9);
        if (p.air) Sprites.add(p.x, p.y, p.z, r * 0.8, 1, c[0], c[1], c[2], k * 0.25);
      } else if (p.flash) {
        Sprites.add(p.x, p.y, p.z, p.size * (1.2 + (1 - k) * 1.5), 1, c[0], c[1], c[2], k * 0.6);
      } else if (p.emit) {
        const s = p.size * (0.5 + 0.5 * k);
        const a = p.alpha * Math.min(1, k * 2.5);
        if (p.star) Sprites.add(p.x, p.y, p.z, s * 3.6, 2, c[0], c[1], c[2], a, (p.rot || 0) + (1 - k) * 2);
        else Sprites.add(p.x, p.y, p.z, s * 2.4, 1, c[0], c[1], c[2], a);
      } else {
        // 土ぼこり：ふくらみながら消える
        const s = p.size * (0.7 + (1 - k) * 1.1);
        Sprites.add(p.x, p.y, p.z, s * 1.5, 0, c[0], c[1], c[2], p.alpha * Math.min(1, k * 1.8) * 0.85);
      }
    }
    this.drawGlows();
    Sprites.flush();
  },
  // ひかりの種・ハートのまわりの光（75_entities.js の描く位置に合わせる）
  drawGlows() {
    if (typeof Level === 'undefined') return;
    const t = Game.time;
    for (const s of Level.seeds) {
      if (s.got || s.hidden) continue;
      const y = s.y + Math.sin(s.t * 2) * 0.2;
      const pulse = 0.85 + Math.sin(s.t * 4) * 0.15;
      Sprites.add(s.x, y + 0.75, s.z, 2.2 * pulse, 1, 0.4, 1, 0.85, 0.32);
      Sprites.add(s.x, y + 0.8, s.z, 2.0, 2, 0.8, 1, 0.95, 0.3, t * 0.6);
      Sprites.add(s.x, y + 0.8, s.z, 1.5, 2, 0.8, 1, 0.95, 0.2, -t * 0.9 + 0.7);
      const g = groundBelow(s.x, s.z, s.y + 0.5, 0);
      if (g) {
        Sprites.add(s.x, g.y + 0.05, s.z, 1.4 * pulse, 5, 0.4, 1, 0.85, 0.4);
        const rk = (t * 0.7 + s.id * 0.3) % 1;
        Sprites.add(s.x, g.y + 0.06, s.z, 0.4 + rk * 1.0, 4, 0.6, 1, 0.9, (1 - rk) * 0.6);
      }
    }
    for (const h of Level.hearts) {
      if (h.got) continue;
      Sprites.add(h.x, h.y + Math.sin(h.t) * 0.15, h.z, 1.1, 1, 1, 0.45, 0.55, 0.3);
    }
  },
};

// ===== 70_level.js =====
// ステージ「そよかぜ空島」：当たり判定と見た目を同時に組み立てる
//
// 地図（上が北＝ -z、右が東＝ +x）
//   中央：はじまりの草原（半径28、高さ0）。スタートは南側 (0,16)
//   北  ：風の塔（らせん足場 → 落ちる足場 → バク宙で屋上）……… 種1
//   北西：見晴らしの崖と風車（3段ジャンプ）……………………… 種0
//   東  ：動く足場 → 回る橋 → 上下する足場 → 東の浮島 ………… 種2
//   西  ：トゲコロの坂 → 高台（敵を全部たおすと出る）………… 種3
//   南  ：橋 → えんとつ島（えんとつの中を壁キック）…………… 種4
//   中央：どんぐり50こで出る ……………………………………………… 種5
//   南西：幅とびの桟橋 → ちぎれ雲の小島（帰りは風の筒）……… 種6
//   南東：杭3本をヒップドロップ → 雲の飛び石が浮かぶ → 小屋の島 … 種7
//   ひみつ：中央の島の北東のがけ下に小さな足場（どんぐり・ハート・ばね）
const Level = {
  static: null,     // まとめた地形メッシュ
  water: null,
  clouds: [],
  acorns: [], seeds: [], hearts: [], enemies: [], movers: [], springs: [],
  spinners: [], fallers: [], stakes: [], risers: [], launchers: [], mills: [], flags: [],
  start: { x: 0, y: 0, z: 16, yaw: Math.PI },
  seedTotal: 0, acornTotal: 0,
  signs: [],
  stakeDone: false, arenaDone: false,
  _cache: null,     // 2回目以降の組み立てではメッシュを作り直さない
};

// 2回目以降の組み立て用：形状を作らない Geo の代わり
const NOGEO = { box() { return this; }, cyl() { return this; }, sphere() { return this; }, disc() { return this; }, torus() { return this; } };

// ステージの一覧（id の順）。各ステージは defineStage で登録する
//   id, name, killY（落下とみなす高さ）, start（スタート位置）, env（空・霧・光）, music（BGM の調とテンポ）,
//   tint（地形・敵にかける色）, titleCam（タイトル・ステージ選びの背景のカメラ）, unlock（開く条件）, build(K)
const STAGES = [];
function defineStage(def) { STAGES[def.id] = def; return def; }

// ステージの空・霧・光を R に入れる（R の中身を書きかえる。10_gl.js が毎フレーム読む）
function applyStageEnv(st) {
  const e = st.env;
  if (!e || typeof R === 'undefined' || !R.sky) return;
  R.sky.top = e.top.slice(); R.sky.bottom = e.bottom.slice(); R.sky.sun = e.sun.slice();
  R.fogCol = e.fogCol.slice(); R.fog = e.fog.slice();
  R.light = v3.norm(e.light.slice());
}

function buildLevel(id) {
  if (id === undefined || id === null) id = Level.stageId || 0;
  const st = STAGES[id] || STAGES[0];
  Level.stageId = st.id; Level.stage = st;
  World.clear();
  World.killY = st.killY;
  Object.assign(Level, {
    acorns: [], seeds: [], hearts: [], enemies: [], movers: [], springs: [], signs: [], clouds: [],
    spinners: [], fallers: [], stakes: [], risers: [], launchers: [], mills: [], flags: [],
    stakeDone: false, arenaDone: false,
    updaters: [], drawers: [], poundHooks: [], acornSeed: null, arenaSeed: null,
    tint: st.tint || WHITE,
    start: Object.assign({}, st.start),
  });
  applyStageEnv(st);
  // 地形メッシュはステージごと、共通の部品（ばね・杭など）は全ステージで使い回す
  const caches = Level._caches || (Level._caches = {});
  const cache = caches[st.id] || (caches[st.id] = {});
  const shared = Level._shared || (Level._shared = {});
  const g = cache.static ? NOGEO : new Geo(0.09);
  const rng = makeRng(st.seed || 20261125);
  const once = (key, make) => shared[key] || (shared[key] = make());
  const onceStage = (key, make) => cache[key] || (cache[key] = make());

  // ---------- 部品 ----------
  const grassCol = (p, n) => (n[1] > 0.5 ? mixc(COL.grassDk, COL.grass, 0.5 + 0.5 * Math.sin(p[0] * 3.1 + p[2] * 2.3)) : p[1] > 0.75 ? COL.grassDk : COL.dirt);
  const dirtCol = (p) => mixc(COL.dirtDk, COL.dirt, clamp(p[1], 0, 1));
  const rockCol = (p) => mixc(COL.stoneDk, COL.stone, clamp(p[1] * 0.8 + 0.2 + 0.15 * Math.sin(p[1] * 9), 0, 1));

  function island(x, z, r, top, depth = 7) {
    World.cyl(x, z, r, top - depth * 0.6, top, 'grass');
    g.cyl(T(x, top - 0.7, z, r, 0.7, r), grassCol, 32);
    g.cyl(T(x, top - 0.7 - depth, z, r, depth, r), dirtCol, 32, { bottom: 0.18, top: 0.98, caps: false, flat: true });
  }
  function kindColor(kind) {
    if (kind === 'stone') return (p, n) => (n[1] > 0.5 ? COL.stone : mixc(COL.stoneDk, COL.stone, p[1] + 0.5));
    if (kind === 'wood') return (p, n) => (n[1] > 0.5 ? COL.wood : COL.woodDk);
    if (kind === 'ice') return (p, n) => (n[1] > 0.5 ? COL.ice : shade(COL.ice, 0.85));
    if (kind === 'cloud') return (p, n) => (n[1] > 0.5 ? COL.cloud : hex(0xd6e4f4));
    if (kind === 'snow') return (p, n) => (n[1] > 0.5 ? hex(0xf4f8ff) : p[1] > 0.3 ? hex(0xdfe8f6) : hex(0x8a8fa8));
    return (p, n) => (n[1] > 0.5 ? COL.grass : p[1] > 0.3 ? COL.grassDk : COL.dirt);
  }
  function block(cx, cy, cz, sx, sy, sz, kind = 'grass') {
    const s = World.boxC(cx, cy, cz, sx, sy, sz, kind);
    g.box(T(cx, cy, cz, sx, sy, sz), kindColor(kind));
    return s;
  }
  // 回転した向きの動かない板（桟橋など）
  function oblock(cx, cz, sx, sz, ang, y0, y1, kind = 'stone') {
    const s = World.obox(cx, cz, sx, sz, ang, y0, y1, kind);
    g.box(T(cx, (y0 + y1) / 2, cz, sx, y1 - y0, sz, ang), kindColor(kind));
    return s;
  }
  function stump(x, z, r, top, depth = 30) {
    World.cyl(x, z, r, top - depth, top, 'wood');
    g.cyl(T(x, top - depth, z, r, depth, r), (p, n) => (n[1] > 0.5 ? mixc(COL.wood, hex(0xe9c08a), 0.5) : COL.woodDk), 18, { flat: true });
    g.cyl(T(x, top, z, r * 0.62, 0.02, r * 0.62), hex(0xd9a86c), 18); // 年輪
    g.cyl(T(x, top + 0.005, z, r * 0.5, 0.02, r * 0.5), hex(0xf0cf98), 18);
  }
  function tree(x, y, z, s = 1) {
    World.cyl(x, z, 0.45 * s, y, y + 3.2 * s, 'wood');
    g.cyl(T(x, y, z, 0.35 * s, 3.2 * s, 0.35 * s), COL.trunk, 8, { top: 0.7, flat: true });
    const leaf = (p) => mixc(COL.leafDk, COL.leaf, clamp(p[1] * 0.5 + 0.5, 0, 1));
    g.sphere(T(x, y + 3.6 * s, z, 1.6 * s, 1.4 * s, 1.6 * s), leaf, 10, 7, { flat: true });
    g.sphere(T(x + 0.8 * s, y + 3.0 * s, z + 0.4 * s, 1.0 * s, 0.9 * s, 1.0 * s), leaf, 8, 6, { flat: true });
    g.sphere(T(x - 0.7 * s, y + 3.2 * s, z - 0.5 * s, 1.0 * s, 0.9 * s, 1.0 * s), leaf, 8, 6, { flat: true });
    // 木の上にも乗れる
    World.cyl(x, z, 1.3 * s, y + 4.4 * s, y + 4.9 * s, 'grass').noCam = true;
    return y + 4.9 * s;
  }
  function pine(x, y, z, s = 1) {
    World.cyl(x, z, 0.4 * s, y, y + 4 * s, 'wood');
    g.cyl(T(x, y, z, 0.3 * s, 1.2 * s, 0.3 * s), COL.trunk, 6);
    for (let i = 0; i < 3; i++) {
      g.cyl(T(x, y + (1 + i * 1.1) * s, z, (1.6 - i * 0.4) * s, 1.8 * s, (1.6 - i * 0.4) * s), (p) => mixc(COL.leafDk, COL.leaf, p[1]), 8, { top: 0, flat: true });
    }
  }
  function rock(x, y, z, s) {
    World.cyl(x, z, s * 0.9, y - 1, y + s * 0.9, 'stone');
    g.sphere(T(x, y, z, s, s * 0.9, s * 0.95, rng() * 3), (p) => mixc(COL.stoneDk, COL.stone, p[1] * 0.5 + 0.5), 7, 5, { flat: true });
  }
  function flower(x, y, z) {
    const c = [COL.flowerR, COL.flowerY, COL.flowerW][Math.floor(rng() * 3)];
    g.cyl(T(x, y, z, 0.03, 0.35, 0.03), COL.leafDk, 4, { caps: false });
    g.sphere(T(x, y + 0.38, z, 0.12, 0.07, 0.12), c, 6, 4, { flat: true });
    g.sphere(T(x, y + 0.4, z, 0.05, 0.05, 0.05), COL.flowerY, 4, 3);
  }
  function tuft(x, y, z) {
    for (let i = 0; i < 3; i++) {
      const a = rng() * TAU;
      g.cyl(T(x + Math.cos(a) * 0.12, y, z + Math.sin(a) * 0.12, 0.07, 0.3 + rng() * 0.2, 0.07, a, (rng() - 0.5) * 0.5), COL.grassDk, 3, { top: 0, flat: true, caps: false });
    }
  }
  // 花と草をまく（avoid: [[x,z,r],...] の中には置かない）
  function scatter(cx, cz, r0, r1, y, n, avoid = []) {
