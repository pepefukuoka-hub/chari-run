    for (let i = 0; i < n; i++) {
      const a = rng() * TAU, r = r0 + rng() * (r1 - r0);
      const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      const k = rng();
      if (avoid.some(([ax, az, ar]) => Math.hypot(x - ax, z - az) < ar)) continue;
      if (k < 0.45) flower(x, y, z); else tuft(x, y, z);
    }
  }
  function fence(x0, z0, x1, z1, y) {
    const n = Math.max(1, Math.round(Math.hypot(x1 - x0, z1 - z0) / 1.6));
    const ang = Math.atan2(x1 - x0, z1 - z0);
    for (let i = 0; i <= n; i++) {
      const x = lerp(x0, x1, i / n), z = lerp(z0, z1, i / n);
      g.box(T(x, y + 0.5, z, 0.18, 1, 0.18), COL.woodDk);
    }
    const len = Math.hypot(x1 - x0, z1 - z0);
    g.box(T((x0 + x1) / 2, y + 0.75, (z0 + z1) / 2, 0.1, 0.12, len, ang), COL.wood);
    g.box(T((x0 + x1) / 2, y + 0.4, (z0 + z1) / 2, 0.1, 0.12, len, ang), COL.wood);
    // 柵は低い壁として当たり判定（軸にそった柵だけ）
    const s = World.add({ type: 'box', x0: Math.min(x0, x1) - 0.1, x1: Math.max(x0, x1) + 0.1, z0: Math.min(z0, z1) - 0.1, z1: Math.max(z0, z1) + 0.1, y0: y, y1: y + 0.9, kind: 'wood' });
    s.noCam = true;
  }
  // 看板：近づくとヒントが出る
  function sign(x, y, z, yaw, lines) {
    World.cyl(x, z, 0.18, y, y + 1.1, 'wood').noCam = true;
    g.cyl(T(x, y, z, 0.09, 1.25, 0.09), COL.woodDk, 6);
    g.box(T(x, y + 1.3, z, 1.3, 0.8, 0.12, yaw), (p, n) => (Math.abs(n[2]) > 0.5 ? hex(0xf3d7a6) : COL.wood));
    g.box(T(x + Math.sin(yaw) * 0.07, y + 1.38, z + Math.cos(yaw) * 0.07, 0.9, 0.08, 0.02, yaw), COL.woodDk);
    g.box(T(x + Math.sin(yaw) * 0.07, y + 1.2, z + Math.cos(yaw) * 0.07, 0.7, 0.08, 0.02, yaw), COL.woodDk);
    Level.signs.push({ x, y, z, lines, armed: true });
  }
  // 小屋（屋根も坂として乗れる）
  function hut(x, y, z, sx, sz, wall) {
    World.boxC(x, y + 1.1, z, sx, 2.2, sz, 'wood');
    g.box(T(x, y + 1.1, z, sx, 2.2, sz), (p, n) => (n[1] > 0.5 ? COL.woodDk : mixc(hex(0xf2e2c4), hex(0xe6cfa8), (Math.floor((p[0] + p[2] + 1) * 6) % 2))));
    // 扉と窓
    g.box(T(x, y + 0.75, z + sz / 2 + 0.02, 0.8, 1.5, 0.05), COL.woodDk);
    g.box(T(x + sx * 0.3, y + 1.4, z + sz / 2 + 0.02, 0.55, 0.5, 0.05), hex(0x7fd3ff));
    // 屋根（x 方向に山形）
    const hw = sx / 2 + 0.35, rise = 1.1;
    World.ramp(x - hw, z - sz / 2 - 0.3, x, z + sz / 2 + 0.3, y + 2.2 - 0.3, 'x', y + 2.2, y + 2.2 + rise, 'wood').noCam = true;
    World.ramp(x, z - sz / 2 - 0.3, x + hw, z + sz / 2 + 0.3, y + 2.2 - 0.3, 'x', y + 2.2 + rise, y + 2.2, 'wood').noCam = true;
    const ang = Math.atan2(rise, hw), len = Math.hypot(hw, rise);
    const roofC = (p, n) => (n[1] > 0.3 ? (wall || hex(0xe0614a)) : hex(0xa8432f));
    g.box(T(x - hw / 2, y + 2.2 + rise / 2, z, len + 0.1, 0.18, sz + 0.6, 0, 0, ang), roofC);
    g.box(T(x + hw / 2, y + 2.2 + rise / 2, z, len + 0.1, 0.18, sz + 0.6, 0, 0, -ang), roofC);
    // えんとつ
    g.box(T(x + hw * 0.45, y + 3.2, z - sz * 0.2, 0.4, 0.9, 0.4), COL.stone);
  }
  // 旗（ゴールの目印）。布は動的に描く
  function flag(x, y, z, col) {
    World.cyl(x, z, 0.12, y, y + 3.4, 'wood').noCam = true;
    g.cyl(T(x, y, z, 0.07, 3.4, 0.07), COL.white, 8);
    g.sphere(T(x, y + 3.45, z, 0.15, 0.15, 0.15), COL.flowerY, 8, 6);
    Level.flags.push({ x, y: y + 3.25, z, col: col || COL.scarf, t: rng() * 5 });
  }
  // 風車（羽根は動的に描く）。向き yaw に羽根が向く
  function windmill(x, y, z, yaw) {
    World.cyl(x, z, 1.25, y, y + 5, 'stone');
    g.cyl(T(x, y, z, 1.35, 5, 1.35), (p, n) => (n[1] > 0.5 ? COL.stone : mixc(hex(0xf6efe2), hex(0xe2d6c2), (Math.floor(p[1] * 6) % 2))), 12, { top: 0.72, flat: true });
    g.cyl(T(x, y + 5, z, 1.2, 1.4, 1.2), hex(0xd8604a), 12, { top: 0, flat: true });
    g.box(T(x + Math.sin(yaw) * 1.0, y + 1.0, z + Math.cos(yaw) * 1.0, 0.8, 1.6, 0.8, yaw), COL.woodDk);
    Level.mills.push({ x: x + Math.sin(yaw) * 1.25, y: y + 4.6, z: z + Math.cos(yaw) * 1.25, yaw, a: 0 });
  }
  // 動く足場（往復）
  function mover(cx, cy, cz, sx, sy, sz, kind, axis, a, b, speed, t0 = 0) {
    const s = World.boxC(cx, cy, cz, sx, sy, sz, kind);
    s.noSafe = true;
    const mv = { s, axis, speed, t: t0 };
    if (axis === 'x') { mv.ax = a; mv.bx = b; }
    if (axis === 'z') { mv.az = a; mv.bz = b; }
    if (axis === 'y') { mv.ay = a; mv.by = b; }
    Level.movers.push(mv);
    return mv;
  }
  // 回る橋（中心のまわりを回り続ける細長い板）
  function spinner(cx, top, cz, sx, sz, speed, kind = 'wood') {
    const s = World.obox(cx, cz, sx, sz, 0, top - 0.5, top, kind);
    s.noSafe = true; s.noCam = true;
    Level.spinners.push({ s, speed, mesh: null, sx, sz });
    // 軸の飾り
    g.cyl(T(cx, top - 6, cz, 0.35, 5.6, 0.35), COL.stoneDk, 8);
    return s;
  }
  // 乗るとぐらぐらして落ちる足場
  function faller(cx, top, cz, sx, sz) {
    const s = World.boxC(cx, top - 0.3, cz, sx, 0.6, sz, 'wood');
    s.noSafe = true;
    Level.fallers.push({ s, base: s.y0, state: 'idle', t: 0, vy: 0, sx, sz });
    return s;
  }
  // ヒップドロップで打ちこむ杭（地面 y から 0.9 出ている）
  function stake(x, y, z) {
    const s = World.cyl(x, z, 0.55, y - 2, y + 0.9, 'wood');
    s.noCam = true;
    Level.stakes.push({ s, x, z, ground: y, down: false });
    // 杭のまわりの土
    g.cyl(T(x, y + 0.01, z, 0.95, 0.03, 0.95), COL.dirtDk, 12);
  }
  // 杭を全部打つと雲の下から浮かんでくる足場
  function riser(cx, top, cz, sx, sz) {
    const s = World.boxC(cx, top - 0.35 - 30, cz, sx, 0.7, sz, 'cloud');
    s.off = true;
    Level.risers.push({ s, top, t: 0, active: false, sx, sz });
  }
  // 風の筒：乗ると決まった向きへ大きく飛ばされる（帰り道用）
  function launcher(x, y, z, yaw, vy, sp) {
    const s = World.cyl(x, z, 0.95, y - 0.6, y + 0.2, 'stone');
    s.noSafe = true;
    s.launch = { yaw, vy, sp };
    g.cyl(T(x, y - 0.6, z, 1.15, 0.75, 1.15), COL.stoneDk, 14, { flat: true });
    Level.launchers.push({ s, x, y: y + 0.2, z, yaw, t: 0 });
  }

  const acornAt = (x, y, z) => Level.acorns.push({ x, y: y + 0.6, z, got: false, t: rng() * TAU });
  const acornLine = (x0, y0, z0, x1, y1, z1, n) => { for (let i = 0; i < n; i++) { const t = n === 1 ? 0 : i / (n - 1); acornAt(lerp(x0, x1, t), lerp(y0, y1, t), lerp(z0, z1, t)); } };
  const acornRing = (x, y, z, r, n, a0 = 0) => { for (let i = 0; i < n; i++) { const a = (i / n) * TAU + a0; acornAt(x + Math.cos(a) * r, y, z + Math.sin(a) * r); } };
  const seedAt = (id, x, y, z, name, hidden = false) => Level.seeds.push({ id, x, y: y + 1.0, z, name, got: false, hidden, t: 0 });
  const heartAt = (x, y, z) => Level.hearts.push({ x, y: y + 0.8, z, got: false, t: rng() * TAU });
  const blobAt = (x, y, z, range = 5, arena = false) => Level.enemies.push({ type: 'blob', x, y, z, hx: x, hz: z, range, yaw: rng() * TAU, vy: 0, alive: true, t: rng() * 5, state: 'walk', st: 0, squish: 1, arena });
  const spikyAt = (ax, ay, az, bx, by, bz, speed = 5) => Level.enemies.push({ type: 'spiky', ax, ay, az, bx, by, bz, speed, u: 0, dir: 1, x: ax, y: ay, z: az, alive: true, rot: 0 });
  const hopperAt = (x, y, z, range = 4, arena = false) => Level.enemies.push({ type: 'hopper', x, y, z, hx: x, hz: z, range, yaw: rng() * TAU, vx: 0, vz: 0, vy: 0, air: false, alive: true, t: rng() * 5, st: 0.5 + rng(), squish: 1, arena });

  const K = { st, g, rng, once, onceStage, grassCol, dirtCol, rockCol, island, kindColor, block, oblock, stump, tree, pine, rock, flower, tuft, scatter, fence, sign, hut, flag, windmill, mover, spinner, faller, stake, riser, launcher, acornAt, acornLine, acornRing, seedAt, heartAt, blobAt, spikyAt, hopperAt };
  st.build(K);

  // どんぐりの総数
  Level.acornTotal = Level.acorns.length;
  Level.seedTotal = Level.seeds.length;
  st.seedTotal = Level.seedTotal;

  // まとめた地形メッシュ（2回目以降は作り直さない）
  if (!cache.static) { cache.static = g.mesh(); cache.staticTris = g.pos.length / 9; }
  Level.static = cache.static;
  Level.staticTris = cache.staticTris;

  // ---- 動く物のメッシュ ----
  const boxMesh = (sx, sy, sz, kind, jit = 0.06) => once(`box:${sx}:${sy}:${sz}:${kind}`, () => new Geo(jit).box(T(0, 0, 0, sx, sy, sz), kindColor(kind)).mesh());
  for (const mv of Level.movers) {
    const s = mv.s;
    mv.mesh = boxMesh(s.x1 - s.x0, s.y1 - s.y0, s.z1 - s.z0, s.kind);
  }
  for (const sp of Level.spinners) {
    sp.mesh = once(`spin:${sp.sx}:${sp.sz}:${sp.s.kind}`, () => {
      const gg = new Geo(0.06);
      gg.box(T(0, 0, 0, sp.sx, 0.5, sp.sz), kindColor(sp.s.kind));
      for (let i = 0; i < 9; i++) gg.box(T(-sp.sx / 2 + 0.6 + i * ((sp.sx - 1.2) / 8), 0.26, 0, 0.12, 0.03, sp.sz), COL.woodDk);
      gg.cyl(T(0, 0.25, 0, 0.5, 0.08, 0.5), hex(0xffd166), 12);
      return gg.mesh();
    });
  }
  for (const f of Level.fallers) {
    f.mesh = once(`fall:${f.sx}:${f.sz}`, () => {
      const gg = new Geo(0.12);
      gg.box(T(0, 0, 0, f.sx, 0.6, f.sz), (p, n) => (n[1] > 0.5 ? hex(0xd9a066) : hex(0xa36a3a)));
      gg.box(T(0.3, 0.31, -0.2, 1.4, 0.02, 0.08, 0.6), hex(0x6b4325)); // ひび
      gg.box(T(-0.4, 0.31, 0.4, 0.9, 0.02, 0.08, -0.9), hex(0x6b4325));
      return gg.mesh();
    });
  }
  for (const r of Level.risers) {
    r.mesh = once(`rise:${r.sx}:${r.sz}`, () => {
      const gg = new Geo(0.03);
      gg.box(T(0, 0, 0, r.sx, 0.7, r.sz), kindColor('cloud'));
      for (const [ox, oz] of [[-0.8, -0.8], [0.8, -0.7], [-0.7, 0.8], [0.8, 0.8]]) gg.sphere(T(ox, -0.2, oz, 0.75, 0.5, 0.75), COL.cloud, 8, 5, { flat: true });
      return gg.mesh();
    });
  }
  Models.stake = once('stake', () => {
    const gg = new Geo(0.08);
    gg.cyl(T(0, 0, 0, 0.55, 2.7, 0.55), (p, n) => (n[1] > 0.5 ? hex(0xe9c08a) : COL.woodDk), 10, { flat: true });
    gg.cyl(T(0, 2.7, 0, 0.62, 0.2, 0.62), hex(0xd8604a), 10, { flat: true });
    return gg.mesh();
  });
  Models.spring = once('spring', () => {
    const gg = new Geo();
    gg.cyl(T(0, 0, 0, 0.8, 0.15, 0.8), COL.stoneDk, 14);
    for (let i = 0; i < 3; i++) gg.torus(T(0, 0.18 + i * 0.12, 0, 0.55, 1, 0.55), COL.spikeTip, 1, 0.08, 14, 5);

// 動く足場・ばねなどの更新
function updateLevel(dt) {
  for (const s of World.solids) { s.dx = s.dy = s.dz = 0; if (s.rotY) s.rotY = 0; }
  for (const mv of Level.movers) {
    mv.t += dt * mv.speed;
    const k = 0.5 - 0.5 * Math.cos(mv.t * Math.PI); // 0〜1 往復
    const s = mv.s;
    const cx = (s.x0 + s.x1) / 2, cy = (s.y0 + s.y1) / 2, cz = (s.z0 + s.z1) / 2;
    if (mv.axis === 'x') World.move(s, lerp(mv.ax, mv.bx, k) - cx, 0, 0);
    if (mv.axis === 'z') World.move(s, 0, 0, lerp(mv.az, mv.bz, k) - cz);
    if (mv.axis === 'y') World.move(s, 0, lerp(mv.ay, mv.by, k) - cy, 0);
  }
  // 回る橋
  for (const sp of Level.spinners) World.rotate(sp.s, sp.speed * dt);
  // 落ちる足場：乗る → ぐらぐら（1秒）→ 落ちる → 消える → 元の場所に戻る
  const onS = P.grounded ? P.groundS : null;
  for (const f of Level.fallers) {
    const s = f.s;
    f.t += dt;
    if (f.state === 'idle') {
      if (onS === s) { f.state = 'shake'; f.t = 0; Sound.play('land'); }
    } else if (f.state === 'shake') {
      if (f.t > 1.0) { f.state = 'fall'; f.t = 0; f.vy = 0; }
    } else if (f.state === 'fall') {
      f.vy = Math.min(f.vy + 30 * dt, 30);
      World.move(s, 0, -f.vy * dt, 0);
      if (f.t > 2.2) { f.state = 'gone'; f.t = 0; s.off = true; }
    } else if (f.state === 'gone' && f.t > 2.5) {
      // 主人公が元の場所にいなければ戻す
      const cx = (s.x0 + s.x1) / 2, cz = (s.z0 + s.z1) / 2;
      const inside = Math.abs(P.x - cx) < f.sx / 2 + 0.6 && Math.abs(P.z - cz) < f.sz / 2 + 0.6 && Math.abs(P.y - f.base) < 2;
      if (!inside) {
        World.move(s, 0, f.base - s.y0, 0);
        s.dy = 0;
        s.off = false; f.state = 'idle'; f.t = 0;
        Fx.burst(cx, s.y1, cz, [1, 0.95, 0.8], 6, 2);
      }
    }
  }
  // 杭：打ちこまれたら沈む
  for (const st of Level.stakes) {
    const s = st.s;
    if (st.down && s.y1 > st.ground + 0.06) World.move(s, 0, -Math.min(dt * 7, s.y1 - (st.ground + 0.06)), 0);
  }
  // 雲の飛び石：下から浮かんでくる
  for (const r of Level.risers) {
    if (!r.active) continue;
    r.t += dt;
    const s = r.s;
    const k = clamp(r.t / 1.6, 0, 1);
    const want = r.top - 30 * Math.pow(1 - k, 3);
    if (r.t <= 0) continue;
    s.off = false;
    World.move(s, 0, want - s.y1, 0);
  }
  // 風の筒：乗ったら飛ばす
  for (const L of Level.launchers) {
    L.t += dt;
    if (P.grounded && P.groundS === L.s && (P.state === 'ground' || P.state === 'punch')) {
      const k = L.s.launch;
      P.grounded = false; P.groundS = null;
      P.state = 'air'; P.airT = 0; P.stateT = 0;
      P.yaw = k.yaw; P.speed = k.sp;
      P.vx = Math.sin(k.yaw) * k.sp; P.vz = Math.cos(k.yaw) * k.sp; P.vy = k.vy;
      P.longJump = true; P.jumpHeld = true; P.flip = 0.001; P.flipDir = 1; P.jumpN = 0;
      Sound.play('spring');
      Fx.burst(L.x, L.y + 0.3, L.z, [0.7, 0.9, 1], 16, 6);
    }
  }
  for (const m of Level.mills) m.a += dt * 0.9;
  // ステージ専用の仕掛け（つらら・風など）
  for (const f of Level.updaters) f(dt);
  for (const f of Level.flags) f.t += dt;
  for (const s of Level.springs) s.boing = Math.max(0, (s.boing || 0) - dt * 3);
}

// ヒップドロップで杭を打つ（75_entities.js の poundShock から呼ぶ）
function poundStakes(x, y, z) {
  for (const st of Level.stakes) {
    if (st.down) continue;
    const s = st.s;
    if (Math.hypot(x - s.x, z - s.z) < s.r + 0.45 && Math.abs(y - s.y1) < 0.35) {
      st.down = true;
      Sound.play('stomp');
      Fx.burst(s.x, s.y1, s.z, [0.9, 0.75, 0.5], 12, 5);
      const left = Level.stakes.filter((q) => !q.down).length;
      if (left > 0) Game.toast(`杭を打った！ あと ${left} 本`, 2);
      else if (!Level.stakeDone) {
        Level.stakeDone = true;
        Level.risers.forEach((r, i) => { r.active = true; r.t = -i * 0.45; });
        Sound.play('seed');
        Game.toast('南東の雲の下から 飛び石が うかんできた！', 4);
      }
    }
  }
}

const FALL_TINT = [1, 0.85, 0.75], STAKE_TINT = [0.85, 0.85, 0.85];
function drawLevel() {
  // 空
  gl.depthMask(false);
  gl.disable(gl.CULL_FACE);
  drawMesh(Models.sky, T(R.cam[0], R.cam[1], R.cam[2], 300, 300, 300), WHITE, 1, 1);
  gl.enable(gl.CULL_FACE);
  gl.depthMask(true);
  drawMesh(Level.cloudMesh, T(), WHITE, 0.55, 1);
  const tint = Level.tint;
  drawMesh(Level.static, M4.ident(), tint);
  const t = Game.time;
  for (const mv of Level.movers) {
    const s = mv.s;
    drawMesh(mv.mesh, T((s.x0 + s.x1) / 2, (s.y0 + s.y1) / 2, (s.z0 + s.z1) / 2), tint);
  }
  for (const sp of Level.spinners) {
    const s = sp.s;
    drawMesh(sp.mesh, T(s.cx, (s.y0 + s.y1) / 2, s.cz, 1, 1, 1, s.ang), tint);
  }
  for (const f of Level.fallers) {
    if (f.state === 'gone') continue;
    const s = f.s;
    const sh = f.state === 'shake' ? 0.08 : 0;
    drawMesh(f.mesh, T((s.x0 + s.x1) / 2 + Math.sin(t * 60) * sh, (s.y0 + s.y1) / 2, (s.z0 + s.z1) / 2 + Math.cos(t * 53) * sh), f.state === 'idle' ? tint : FALL_TINT);
  }
  for (const r of Level.risers) {
    if (r.s.off) continue;
    const s = r.s;
    drawMesh(r.mesh, T((s.x0 + s.x1) / 2, (s.y0 + s.y1) / 2 + Math.sin(t * 1.6 + s.x0) * 0.04, (s.z0 + s.z1) / 2), tint);
  }
  for (const st of Level.stakes) {
    const s = st.s;
    drawMesh(Models.stake, T(s.x, s.y1 - 2.9, s.z), st.down ? STAKE_TINT : tint);
  }
  for (const L of Level.launchers) {
    const k = 0.5 + 0.5 * Math.sin(L.t * 5);
    drawMesh(Models.launcher, T(L.x, L.y, L.z, 1, 1, 1, L.yaw), WHITE, 0.2 + k * 0.4);
  }
  for (const m of Level.mills) {
    const mm = T(m.x, m.y, m.z, 1, 1, 1, m.yaw);
    M4.rotZ(mm, m.a);
    drawMesh(Models.millBlades, mm, tint);
  }
  // 旗の布：細い帯を波打たせる
  for (const f of Level.flags) {
    const n = 5, w = 1.3 / n;
    for (let i = 0; i < n; i++) {
      const u = (i + 0.5) / n;
      const wave = Math.sin(f.t * 5 - i * 0.9) * 0.18 * u;
      drawMesh(Models.flagCloth2, T(f.x + 0.08 + u * 1.3, f.y - 0.35 - u * 0.08, f.z + wave, w * 1.02, 0.72 - u * 0.1, 0.05, Math.sin(f.t * 5 - i * 0.9) * 0.3), f.col);
    }
  }
  for (const s of Level.springs) {
    const b = s.boing || 0;
    drawMesh(Models.spring, T((s.x0 + s.x1) / 2, s.y0, (s.z0 + s.z1) / 2, 1, 1 + Math.sin(b * 12) * b * 0.6, 1), tint);
  }
  // ステージ専用の物
  for (const f of Level.drawers) f(t, tint);
}

// 風のつり橋：風の周期（秒）。しずか → 前ぶれ → 強い風
const WIND = { period: 3.6, calm: 1.5, warn: 0.5, push: 4.2 };
function windGust(t) {
  const p = t % WIND.period, g0 = WIND.calm + WIND.warn;
  if (p < WIND.calm) return 0;
  if (p < g0) return -1; // 前ぶれ（まだ押さない）
  return clamp((p - g0) / 0.15, 0, 1) * clamp((WIND.period - p) / 0.15, 0, 1);
}

function buildStage2(K) {
  const { g, rng, once, onceStage, kindColor, block, sign, flag, mover, faller, launcher, acornAt, acornLine, acornRing, seedAt, heartAt, hopperAt } = K;
  void onceStage;
  const S2 = Level.s2 = { windT: 0, gustOn: false, slab: null, broken: false, icicles: [], balls: [], lamps: [], crystals: [] };
  Level.arenaSeed = { id: 5, msg: 'ゆきだるんを ぜんぶ たおした！ ひかりの種が あらわれた！' };
  Level.arenaName = 'ゆきだるん';

  // ---------- 色 ----------
  const SNOW = hex(0xf3f7ff), SNOW2 = hex(0xdde6f5), SNOWSH = hex(0xc9d3ea);
  const ROCK = hex(0x8d88a6), ROCKDK = hex(0x5f5a7a), ICE = hex(0xa9e4ff), ICEDK = hex(0x6fbde8);
  const snowTop = (p, n) => (n[1] > 0.5 ? mixc(SNOW2, SNOW, 0.55 + 0.45 * Math.sin(p[0] * 2.1 + p[2] * 1.7)) : p[1] > 0.6 ? SNOW2 : SNOWSH);
  const rockSide = (p) => mixc(ROCKDK, ROCK, clamp(p[1] * 0.9 + 0.1 + 0.12 * Math.sin(p[1] * 11 + p[0]), 0, 1));
  const iceCol = (p, n) => (n[1] > 0.5 ? mixc(ICE, hex(0xe6f8ff), 0.3 + 0.3 * Math.sin(p[0] * 4 + p[2] * 3)) : mixc(ICEDK, ICE, clamp(p[1] + 0.5, 0, 1)));

  // ---------- 部品 ----------
  // 雪の島（円柱）
  function snowIsland(x, z, r, top, depth = 8) {
    World.cyl(x, z, r, top - depth * 0.6, top, 'snow');
    g.cyl(T(x, top - 0.6, z, r, 0.6, r), snowTop, 32);
    g.cyl(T(x, top - 0.6 - depth, z, r * 0.98, depth, r * 0.98), rockSide, 28, { bottom: 0.2, top: 1, caps: false, flat: true });
    // ふちの雪のたれ
    for (let i = 0; i < 14; i++) {
      const a = (i / 14) * TAU + rng() * 0.3;
      g.sphere(T(x + Math.cos(a) * r * 0.97, top - 0.75, z + Math.sin(a) * r * 0.97, 0.9 + rng() * 0.6, 0.45, 0.9 + rng() * 0.6, a), SNOW2, 7, 4, { flat: true });
    }
  }
  // 雪をかぶった箱（当たり判定つき）
  function snowBox(x0, y0, z0, x1, y1, z1, kind = 'snow') {
    const s = World.box(x0, y0, z0, x1, y1, z1, kind);
    const cx = (x0 + x1) / 2, cz = (z0 + z1) / 2, sx = Math.abs(x1 - x0), sz = Math.abs(z1 - z0);
    if (kind === 'ice') g.box(T(cx, (y0 + y1) / 2, cz, sx, y1 - y0, sz), iceCol);
    else {
      g.box(T(cx, (y0 + y1) / 2 - 0.15, cz, sx, y1 - y0 - 0.3, sz), rockSide);
      g.box(T(cx, y1 - 0.15, cz, sx + 0.08, 0.3, sz + 0.08), snowTop);
    }
    return s;
  }
  // 雪をかぶった針葉樹
  function snowPine(x, y, z, s = 1) {
    World.cyl(x, z, 0.4 * s, y, y + 4 * s, 'wood');
    g.cyl(T(x, y, z, 0.3 * s, 1.2 * s, 0.3 * s), COL.trunk, 6);
    for (let i = 0; i < 3; i++) {
      const r = (1.6 - i * 0.4) * s, yy = y + (1 + i * 1.1) * s;
      g.cyl(T(x, yy, z, r, 1.8 * s, r), (p) => (p[1] > 0.45 ? SNOW : mixc(hex(0x2f6b5a), hex(0x3f8a6a), p[1] * 2)), 8, { top: 0, flat: true });
    }

  function snowRock(x, y, z, s) {
    World.cyl(x, z, s * 0.9, y - 1, y + s * 0.9, 'stone');
    g.sphere(T(x, y, z, s, s * 0.9, s * 0.95, rng() * 3), (p) => (p[1] > 0.45 ? SNOW : mixc(ROCKDK, ROCK, p[1] * 0.5 + 0.5)), 7, 5, { flat: true });
  }
  // 雪の上のでこぼこ（見た目だけ）
  function drifts(cx, cz, r0, r1, y, n, avoid = []) {
    for (let i = 0; i < n; i++) {
      const a = rng() * TAU, r = r0 + rng() * (r1 - r0);
      const x = cx + Math.cos(a) * r, z = cz + Math.sin(a) * r;
      if (avoid.some(([ax, az, ar]) => Math.hypot(x - ax, z - az) < ar)) continue;
      if (rng() < 0.7) g.sphere(T(x, y - 0.05, z, 0.5 + rng() * 0.6, 0.18, 0.4 + rng() * 0.5, rng() * 3), SNOW, 7, 4, { flat: true });
      else g.cyl(T(x, y, z, 0.05, 0.4, 0.05), ROCKDK, 4, { top: 0.2, caps: false }); // かれ枝
    }
  }
  // 灯り（ゆうやけでもぽっと光る。光は drawers で描く）
  function lamp(x, y, z) {
    World.cyl(x, z, 0.16, y, y + 1.6, 'wood').noCam = true;
    g.cyl(T(x, y, z, 0.08, 1.5, 0.08), hex(0x4a3b55), 6);

  }
  // 氷の結晶（ほんのり光る。drawers で描く）
  function crystal(x, y, z, s, a = 0) { S2.crystals.push({ x, y, z, s, a }); }
  // つらら（近づくとゆれて落ちてくる）。y は根元の高さ

  const snowmanAt = (x, y, z, arena = false) => Level.enemies.push({ type: 'snowman', x, y, z, hx: x, hz: z, yaw: rng() * TAU, alive: true, t: rng() * 5, cd: 1.2 + rng(), wind: 0, squish: 1, arena });

  // ================= 中央の雪原 =================
  snowIsland(0, 0, 24, 0, 10);
  // かまくら（上にも乗れる）
  World.cyl(-9, 7, 2.2, -0.5, 1.9, 'snow');

    const crack = hex(0xffffff);
    gg.box(T(0, 0.17, 0, 2.0, 0.02, 0.07, 0.5), crack);
    gg.box(T(0.3, 0.17, 0.2, 1.3, 0.02, 0.06, -0.9), crack);
    gg.box(T(-0.4, 0.17, -0.3, 0.9, 0.02, 0.06, 1.7), crack);
    gg.box(T(-0.2, 0.17, 0.5, 0.7, 0.02, 0.05, 2.5), crack);
    return gg.mesh();
  });

  // ---------- このステージの仕掛けの動き ----------
  Level.updaters.push(updateStage2);
  Level.drawers.push(drawStage2);
  Level.poundHooks.push((x, y, z) => {
    const s = S2.slab;
    if (S2.broken || !s) return;
    if (x > s.x0 - 0.35 && x < s.x1 + 0.35 && z > s.z0 - 0.35 && z < s.z1 + 0.35 && Math.abs(y - s.y1) < 0.4) {
      S2.broken = true; s.off = true;
      Sound.play('pound');
      Fx.burst((s.x0 + s.x1) / 2, 0.1, (s.z0 + s.z1) / 2, [0.75, 0.95, 1], 22, 7);
      Game.shake = 0.3;
      Game.toast('氷が われた！ 下に ほらあなが…！', 3);
    }
  });
}

// つらら・風・雪玉の動き（updateLevel から毎フレーム呼ぶ）
function updateStage2(dt) {
  const S2 = Level.s2;
  // 遊んでいる間だけ（タイトル・ステージ選びの背景では 主人公に当たらない）
  const playing = P.state !== 'dead' && P.state !== 'win' && (Game.state === undefined || Game.state === 'play');
  // ---- 風のつり橋 ----
  S2.windT += dt;
  const gust = windGust(S2.windT);
  if (gust > 0 && !S2.gustOn) { S2.gustOn = true; if (Sound.noise && s2near(0, -38, 30)) Sound.noise(1.7, 0.1, 500, 1500, 'bandpass', 0, 0.6); }
  if (gust <= 0) S2.gustOn = false;
  S2.gust = gust;
  const B = S2.bridge;
  if (playing && gust > 0 && P.x > B.x0 && P.x < B.x1 && P.z > B.z0 && P.z < B.z1 && P.y > -8) {
    // 風よけのかげ（かべの東側）にいれば押されない
    const shelter = P.y < 2.4 && P.x > -0.85 && S2.walls.some((w) => Math.abs(P.z - w) < 1.3);
    if (!shelter) P.x += WIND.push * gust * dt;
  }
  // ---- つらら ----
  for (const ic of S2.icicles) {
    ic.t += dt;
    if (ic.state === 'idle') {
      ic.grow = Math.min(1, ic.grow + dt * 1.6);
      if (playing && ic.grow >= 1 && Math.abs(P.x - ic.x) < 2.2 && Math.abs(P.z - ic.z) < 3.0 && P.y < ic.y0 - 1) { ic.state = 'shake'; ic.t = 0; Sound.play('skid'); }
    } else if (ic.state === 'shake') {
      if (ic.t > 0.4) { ic.state = 'fall'; ic.t = 0; ic.vy = 0; }
    } else if (ic.state === 'fall') {
      ic.vy = Math.min(ic.vy + 32 * dt, 30);
      ic.y -= ic.vy * dt;
      const tip = ic.y - 1.25;
      if (playing && Math.abs(P.x - ic.x) < 0.75 && Math.abs(P.z - ic.z) < 0.75 && tip < P.y + P.h && ic.y > P.y + 0.3) {
        playerHurt(ic.x, ic.z);
        shatterIcicle(ic);
        continue;
      }
      const gb = groundBelow(ic.x, ic.z, ic.y, 0);
      if ((gb && tip <= gb.y) || ic.y < World.killY) shatterIcicle(ic, gb ? gb.y : null);
    } else if (ic.state === 'gone' && ic.t > 3) {
      ic.state = 'idle'; ic.t = 0; ic.y = ic.y0; ic.grow = 0;
    }
  }
  // ---- 雪玉 ----
  const balls = S2.balls;
  for (let i = balls.length - 1; i >= 0; i--) {
    const b = balls[i];
    b.t += dt;
    const py = b.y;
    b.vy -= 20 * dt;
    b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
    let hit = false;
    if (playing && Math.hypot(P.x - b.x, P.y + 0.65 - b.y, P.z - b.z) < 0.85) { playerHurt(b.x - b.vx * 0.05, b.z - b.vz * 0.05); hit = true; }
    const gb = !hit && groundBelow(b.x, b.z, py + 0.3, 0);
    if (hit || (gb && b.y - 0.3 <= gb.y) || b.t > 4 || b.y < World.killY) {
      Fx.burst(b.x, b.y, b.z, [1, 1, 1], 6, 3);
      balls.splice(i, 1);
    }
  }
}
function s2near(x, z, r) { return Math.hypot(P.x - x, P.z - z) < r; }
function shatterIcicle(ic, gy) {
  ic.state = 'gone'; ic.t = 0;
  Fx.burst(ic.x, gy !== null && gy !== undefined ? gy + 0.2 : ic.y - 1, ic.z, [0.75, 0.95, 1], 10, 4);
  Sound.play('hit');
}

// ゆきだるん：主人公の方を向き、近ければ雪玉を山なりに投げる。踏む・パンチ・ヒップドロップでたおせる
function updateSnowman(e, dt) {
  e.t += dt;
  e.squish = lerp(e.squish, 1, dt * 8);
  const dx = P.x - e.x, dz = P.z - e.z, dist = Math.hypot(dx, dz), dy = P.y - e.y;
  const see = dist < 14 && Math.abs(dy) < 6 && P.state !== 'dead' && P.state !== 'win';
  if (see) e.yaw += clamp(angDiff(e.yaw, Math.atan2(dx, dz)), -dt * 3, dt * 3);
  else e.yaw += dt * 0.3;
  e.cd -= dt;
  if (e.wind > 0) {
    // 投げる前の ふりかぶり（0.45秒）
    e.wind -= dt;
    if (e.wind <= 0) {
      const T0 = 0.6 + dist * 0.035;
      const sx = e.x + Math.sin(e.yaw) * 0.6, sy = e.y + 1.6, sz = e.z + Math.cos(e.yaw) * 0.6;
      const tx = P.x, ty = P.y + 0.65, tz = P.z;
      Level.s2.balls.push({ x: sx, y: sy, z: sz, vx: (tx - sx) / T0, vy: (ty - sy + 0.5 * 20 * T0 * T0) / T0, vz: (tz - sz) / T0, t: 0 });
      Sound.play('punch');
      e.squish = 0.85;
    }
  } else if (see && e.cd <= 0 && dist > 2.2 && dist < 13) {
    e.wind = 0.45; e.cd = 2.6;
  }
  // 足元（動く足場にも乗れるように）
  const gb = groundBelow(e.x, e.z, e.y + 0.5, 0.3);
  if (gb) { e.y = gb.y; e.x += gb.s.dx; e.z += gb.s.dz; }
  else { e.y -= 10 * dt; if (e.y < World.killY) e.alive = false; }
  enemyTouch(e, 0.68, 1.9);
}

function drawSnowman(e, tint) {
  const lean = e.wind > 0 ? Math.sin((0.45 - e.wind) / 0.45 * Math.PI) * -0.25 : 0;
  const bob = 1 + Math.sin(e.t * 3) * 0.02;
  const sq = e.squish * bob;
  drawMesh(Models.snowman, T(e.x, e.y, e.z, 1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq), e.yaw, lean), tint);
  drawShadow(e.x, e.y + 0.1, e.z, 0.8);
}

// つらら・割れる氷・光・雪のふる様子
function drawStage2(t, tint) {
  const S2 = Level.s2;
  if (!S2) return;
  if (!S2.broken && S2.slab) {
    const s = S2.slab;
    drawMesh(S2.iceSlabMesh, T((s.x0 + s.x1) / 2, (s.y0 + s.y1) / 2, (s.z0 + s.z1) / 2), tint);
  }
  for (const ic of S2.icicles) {
    if (ic.state === 'gone') continue;
    const sh = ic.state === 'shake' ? Math.sin(t * 70) * 0.07 : 0;
    const k = ic.grow;
    drawMesh(Models.icicle, T(ic.x + sh, ic.y, ic.z, k, k, k), ic.state === 'shake' ? ICICLE_WARN : tint, 0.15);
  }
  for (const b of S2.balls) drawMesh(Models.snowball, T(b.x, b.y, b.z, 1, 1, 1, b.t * 6), WHITE, 0.2);
  for (const c of S2.crystals) drawMesh(Models.crystal, T(c.x, c.y, c.z, c.s, c.s, c.s, c.a), WHITE, 0.45);
  if (R.pass === 'shadow') return;
  // 灯り・灯台の光
  for (const l of S2.lamps) Sprites.add(l[0], l[1], l[2], 1.1 + Math.sin(t * 3 + l[0]) * 0.06, 1, 1, 0.78, 0.45, 0.45);
  if (S2.beacon) {
    const b = S2.beacon;
    Sprites.add(b[0], b[1], b[2], 4.5 + Math.sin(t * 2) * 0.4, 2, 1, 0.85, 0.5, 0.75);
    Sprites.add(b[0] + Math.sin(t * 1.2) * 2.2, b[1], b[2] + Math.cos(t * 1.2) * 2.2, 2.4, 2, 1, 0.9, 0.6, 0.5);
  }
  for (const c of S2.crystals) Sprites.add(c.x, c.y + c.s * 0.8, c.z, c.s * 2.2, 2, 0.5, 0.85, 1, 0.35);
  // ふる雪：カメラのまわりの箱の中で、時間から位置を決める（状態を持たない）
  const cx = R.cam[0], cy = R.cam[1], cz = R.cam[2];
  const wx = S2.gust > 0 && cz < -18 && cz > -60 ? S2.gust * 9 : 0;
  for (let i = 0; i < 160; i++) {
    const h1 = fract(Math.sin(i * 12.9898) * 43758.5), h2 = fract(Math.sin(i * 78.233) * 12345.6), h3 = fract(Math.sin(i * 39.425) * 24634.6);
    const x = cx + wrapM(h1 * 44 + t * (0.6 + wx) + Math.sin(t * 0.8 + i) * 0.4 - cx, 44) - 22;
    const y = cy + 14 - wrapM(h2 * 28 + t * (1.2 + h3 * 0.8), 28);
    const z = cz + wrapM(h3 * 44 + t * 0.3 - cz, 44) - 22;
    Sprites.add(x, y, z, 0.07 + h3 * 0.06, 1, 1, 1, 1, 0.75);
  }
  // 風のつり橋：強い風の雪けむり
  if (S2.gust !== 0) {
    const k = S2.gust < 0 ? 0.25 : S2.gust;
    for (let i = 0; i < 46; i++) {
      const h1 = fract(Math.sin(i * 3.17) * 9182.7), h2 = fract(Math.sin(i * 7.71) * 5531.3);
      const x = -9 + wrapM(h1 * 18 + t * (S2.gust < 0 ? 5 : 15), 18);
      const z = -24 - h2 * 30, y = -0.3 + fract(h1 * 7.3) * 2.6;
      Sprites.add(x, y, z, 0.35 + h2 * 0.3, 0, 1, 1, 1, 0.35 * k);
    }
  }
}

const fract = (v) => v - Math.floor(v);
const wrapM = (v, m) => ((v % m) + m) % m;

// アイテム・敵の動き
function updateEntities(dt) {
  const px = P.x, py = P.y + 0.65, pz = P.z;
  const alive = P.state !== 'dead' && P.state !== 'win';

  // 看板：近づくとヒント
  for (const sg of Level.signs) {
    const d = Math.hypot(sg.x - P.x, sg.z - P.z);
    if (sg.armed && alive && d < 2.3 && Math.abs(P.y - sg.y) < 2) {
      sg.armed = false;
      Sound.play('select');
      for (const l of sg.lines) Game.toast(l, 4.5);
    } else if (!sg.armed && d > 6) sg.armed = true;
  }
  // 印のついた敵（arena）を全部たおすと種（どの種かはステージが Level.arenaSeed で決める）
  if (!Level.arenaDone && Level.arenaSeed) {
    const arena = Level.enemies.filter((e) => e.arena);
    if (arena.length && arena.every((e) => !e.alive)) {
      Level.arenaDone = true;
      revealSeedMsg(Level.arenaSeed.id, Level.arenaSeed.msg);
    }
  }

  // どんぐり
  for (const a of Level.acorns) {
    if (a.got) continue;
    a.t += dt * 3;
    if (alive && Math.abs(a.x - px) < 1 && Math.abs(a.z - pz) < 1 && Math.abs(a.y - py) < 1.2) {
      const d = Math.hypot(a.x - px, a.y - py, a.z - pz);
      if (d < 1.05) {
        a.got = true;
        Game.acorns++;
        Sound.play('acorn');
        Fx.burst(a.x, a.y, a.z, [1, 0.85, 0.4], 6, 3);
        const as = Level.acornSeed;
        if (as && Game.acorns === as.n) revealSeedMsg(as.id, as.msg);
      }
    }
  }
  // ハート
  for (const h of Level.hearts) {
    if (h.got) continue;
    h.t += dt * 2;
    if (alive && Math.hypot(h.x - px, h.y - py, h.z - pz) < 1.2) {
      h.got = true;
      P.hp = P.maxHp;
      Sound.play('heart');
      Fx.burst(h.x, h.y, h.z, COL.heart, 10, 4);
      Game.toast('ハートで元気いっぱい！');
    }
  }
  // ひかりの種
  for (const s of Level.seeds) {
    if (s.got || s.hidden) continue;
    s.t += dt;
    if (Math.random() < dt * 8) Fx.sparkle(s.x, s.y + 0.7, s.z, [0.8, 1, 0.95]);
    if (alive && Math.hypot(s.x - px, s.y + 0.6 - py, s.z - pz) < 1.5) {
      s.got = true;
      Game.getSeed(s);
    }
  }

  // 敵
  for (const e of Level.enemies) {
    if (!e.alive) {
      e.deadT = (e.deadT || 0) + dt;
      continue;
    }
    if (e.type === 'blob') updateBlob(e, dt);
    else if (e.type === 'spiky') updateSpiky(e, dt);
    else if (e.type === 'hopper') updateHopper(e, dt);
    else if (e.type === 'snowman') updateSnowman(e, dt);
  }
}

function updateBlob(e, dt) {
  e.t += dt;
  e.squish = lerp(e.squish, 1, dt * 8);
  const dx = P.x - e.x, dz = P.z - e.z;
  const dist = Math.hypot(dx, dz);
  const dy = P.y - e.y;
  // 見つけたら追いかける
  const chase = dist < 9 && Math.abs(dy) < 3 && P.state !== 'dead';
  let speed = 1.6;
  let want = e.yaw;
  if (chase) {
    want = Math.atan2(dx, dz);
    speed = 3.6;
    if (e.state !== 'chase') { e.state = 'chase'; e.vy = 5; e.squish = 1.3; }
  } else {
    e.state = 'walk';
    const hx = e.hx - e.x, hz = e.hz - e.z;
    if (Math.hypot(hx, hz) > e.range) want = Math.atan2(hx, hz);
    else if (Math.sin(e.t * 0.7) > 0.95) want = e.yaw + 0.05;
  }
  e.yaw += clamp(angDiff(e.yaw, want), -dt * 4, dt * 4);
  const nx = e.x + Math.sin(e.yaw) * speed * dt;
  const nz = e.z + Math.cos(e.yaw) * speed * dt;
  // 崖から落ちないように：進む先に地面がなければ止まる
  const gAhead = groundBelow(nx + Math.sin(e.yaw) * 0.6, nz + Math.cos(e.yaw) * 0.6, e.y + 0.5, 0);
  if (gAhead && Math.abs(gAhead.y - e.y) < 0.6) {
    const homeD = Math.hypot(nx - e.hx, nz - e.hz);
    if (homeD < e.range + 6) { e.x = nx; e.z = nz; }
  } else if (!chase) e.yaw += Math.PI * 0.5;
  // 重力
  e.vy -= 30 * dt;
  e.y += e.vy * dt;
  const g = groundBelow(e.x, e.z, e.y + 0.5, 0.3);
  if (g && e.y <= g.y) { e.y = g.y; e.vy = 0; if (g.s.dx || g.s.dz || g.s.dy) { e.x += g.s.dx; e.z += g.s.dz; } }
  if (e.y < World.killY) e.alive = false;
  enemyTouch(e, 0.62, 1.2);
}

// 踏める敵と主人公の当たり（rad: 半径, hgt: 高さ）
function enemyTouch(e, rad, hgt) {
  if (P.state === 'dead' || P.inv > 0.0 && P.state === 'hurt') return;
  const r = rad + P.r;
  const pd = Math.hypot(P.x - e.x, P.z - e.z);
  if (pd < r && P.y < e.y + hgt && P.y + P.h > e.y) {
    const stomp = (P.vy < 0 && P.y > e.y + hgt * 0.45) || P.state === 'pound';
    const hitting = P.state === 'punch' && P.stateT < 0.25 || P.kickT > 0;
    if (stomp) {
      killEnemy(e, 'stomp');
      if (P.state !== 'pound') { P.vy = Input.jump ? 17 : 12; P.state = 'air'; P.jumpHeld = true; P.grounded = false; }
    } else if (hitting) {
      killEnemy(e, 'punch');
    } else if (P.inv <= 0) {
      playerHurt(e.x, e.z);
    }
  } else if (pd < r + 0.9 && P.state === 'punch' && P.stateT < 0.25) {
    // パンチは少し先まで届く
    const fx = Math.sin(P.yaw), fz = Math.cos(P.yaw);
    if ((e.x - P.x) * fx + (e.z - P.z) * fz > 0 && Math.abs(P.y - e.y) < 1.2) killEnemy(e, 'punch');
  }
}

// ぴょんまる：止まって力をためて、主人公のほうへぴょんと跳ぶ。崖の外へは跳ばない
function updateHopper(e, dt) {
  e.t += dt;
  e.squish = lerp(e.squish, 1, dt * 8);
  const dx = P.x - e.x, dz = P.z - e.z;
  const dist = Math.hypot(dx, dz);
  const chase = dist < 10 && Math.abs(P.y - e.y) < 3 && P.state !== 'dead';
  if (!e.air) {
    e.st -= dt;
    const want = chase ? Math.atan2(dx, dz) : e.yaw;
    e.yaw += clamp(angDiff(e.yaw, want), -dt * 5, dt * 5);
    if (e.st < 0.25) e.squish = Math.min(e.squish, 0.75); // ためる
    if (e.st <= 0) {
      let yaw = e.yaw;
      const hx = e.hx - e.x, hz = e.hz - e.z;
      if (!chase && Math.hypot(hx, hz) > e.range) yaw = Math.atan2(hx, hz);
      else if (!chase) yaw = e.yaw + (Math.random() - 0.5) * 2.5;
      const hop = chase ? 2.4 : 1.6;
      const lx = e.x + Math.sin(yaw) * hop, lz = e.z + Math.cos(yaw) * hop;
      const gl2 = groundBelow(lx, lz, e.y + 1.0, 0);
      const far = Math.hypot(lx - e.hx, lz - e.hz) > e.range + 4;
      if (gl2 && Math.abs(gl2.y - e.y) < 1.0 && !far) {
        e.yaw = yaw;
        e.air = true; e.vy = 9.5;
        const T2 = (2 * 9.5) / 30;
        e.vx = (Math.sin(yaw) * hop) / T2; e.vz = (Math.cos(yaw) * hop) / T2;
        e.squish = 1.35;
        e.st = 0.7 + Math.random() * 0.6;
      } else {
        e.yaw = Math.atan2(hx, hz) + (Math.random() - 0.5);
        e.st = 0.4;
      }
    }
    const g = groundBelow(e.x, e.z, e.y + 0.5, 0.3);
    if (g) { e.y = g.y; e.x += g.s.dx; e.z += g.s.dz; }
    else { e.air = true; e.vx = e.vz = 0; }
  } else {
    const prevY = e.y;
    e.x += e.vx * dt; e.z += e.vz * dt;
    e.vy -= 30 * dt;
    e.y += e.vy * dt;
    if (e.vy < 0) {
      const g = groundBelow(e.x, e.z, prevY + 0.05, 0.3);
      if (g && e.y <= g.y) { e.y = g.y; e.air = false; e.vx = e.vz = 0; e.squish = 0.6; }
    }
  }
  if (e.y < World.killY) e.alive = false;
  enemyTouch(e, 0.52, 1.1);
}

function killEnemy(e, how) {
  e.alive = false;
  e.deadT = 0;
  e.how = how;
  Sound.play('stomp');
  Fx.burst(e.x, e.y + 0.5, e.z, COL.enemy, 14, 6);
  Game.shake = 0.12;
  // 倒すとどんぐりが出る
  Level.acorns.push({ x: e.x, y: e.y + 0.8, z: e.z, got: false, t: 0, bonus: true });
  Level.acornTotal++;
  if (e.arena) {
    const left = Level.enemies.filter((q) => q.arena && q.alive).length;
    if (left > 0) Game.toast(`${Level.arenaName || '高台の敵'} のこり ${left} ひき`, 2);
  }
}

function updateSpiky(e, dt) {
  const len = Math.hypot(e.bx - e.ax, e.bz - e.az);
  e.u += (e.speed / len) * dt * e.dir;
  if (e.u > 1) { e.u = 1; e.dir = -1; }
  if (e.u < 0) { e.u = 0; e.dir = 1; }
  e.x = lerp(e.ax, e.bx, e.u);
  e.z = lerp(e.az, e.bz, e.u);
  const g = groundBelow(e.x, e.z, Math.max(e.ay, e.by) + 2, 0);
  e.y = (g ? g.y : lerp(e.ay, e.by, e.u)) + 0.75;
  e.rot += (e.speed / 0.75) * dt * e.dir;
  e.yaw = Math.atan2(e.bx - e.ax, e.bz - e.az);
  if (P.state === 'dead') return;
  const d = Math.hypot(P.x - e.x, P.y + 0.6 - e.y, P.z - e.z);
  if (d < 0.9 + P.r) playerHurt(e.x, e.z);
}

// ヒップドロップの衝撃：近くの敵を倒す
function poundShock(x, y, z) {
  poundStakes(x, y, z);
  for (const f of Level.poundHooks) f(x, y, z);
  for (const e of Level.enemies) {
    if (!e.alive || e.type === 'spiky') continue;
    if (Math.hypot(e.x - x, e.z - z) < 2.6 && Math.abs(e.y - y) < 1) killEnemy(e, 'pound');
  }
}

const OLD_SEED_TINT = [0.75, 0.85, 1];
function drawEntities() {
  const t = Game.time;
  const tint = Level.tint;
  for (const a of Level.acorns) {
    if (a.got) continue;
    drawMesh(Models.acorn, T(a.x, a.y + Math.sin(a.t) * 0.12, a.z, 1.2, 1.2, 1.2, a.t * 1.3));
    drawShadow(a.x, a.y, a.z, 0.3, 0.2);
  }
  for (const h of Level.hearts) {
    if (h.got) continue;
    drawMesh(Models.heart, T(h.x, h.y + Math.sin(h.t) * 0.15, h.z, 1.3, 1.3, 1.3, h.t), WHITE, 0.25);
    drawShadow(h.x, h.y, h.z, 0.4, 0.2);
  }
  for (const s of Level.seeds) {
    if (s.got || s.hidden) continue;
    const pulse = 1 + Math.sin(s.t * 4) * 0.06;
    // 前のプレイで取ったことがある種は半透明
    if (s.old) drawMesh(Models.seed, T(s.x, s.y + Math.sin(s.t * 2) * 0.2, s.z, pulse, pulse, pulse, s.t * 1.5), OLD_SEED_TINT, 0.35, 0.45);
    else drawMesh(Models.seed, T(s.x, s.y + Math.sin(s.t * 2) * 0.2, s.z, pulse, pulse, pulse, s.t * 1.5), WHITE, 0.55);
    drawShadow(s.x, s.y, s.z, 0.7, 0.25);
  }
  for (const e of Level.enemies) {
    if (!e.alive) {
      if (e.deadT < 0.3 && e.type !== 'spiky') {
        const k = 1 - e.deadT / 0.3;
        const dm = e.type === 'blob' ? Models.blob : e.type === 'snowman' ? Models.snowman : Models.hopper;
        drawMesh(dm, T(e.x, e.y, e.z, 1 + (1 - k) * 0.6, k * 0.3 + 0.05, 1 + (1 - k) * 0.6, e.yaw), tint);
      }
      continue;
    }
    if (e.type === 'hopper') {
      const sq = e.squish;
      drawMesh(Models.hopper, T(e.x, e.y, e.z, 1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq), e.yaw), tint);
      drawShadow(e.x, e.y + 0.1, e.z, 0.6);
      continue;
    }
    if (e.type === 'snowman') { drawSnowman(e, tint); continue; }
    if (e.type === 'blob') {
      const wob = 1 + Math.sin(e.t * (e.state === 'chase' ? 14 : 7)) * 0.06;
      const sq = e.squish * wob;
      drawMesh(Models.blob, T(e.x, e.y, e.z, 1 / Math.sqrt(sq), sq, 1 / Math.sqrt(sq), e.yaw), tint);
      drawShadow(e.x, e.y + 0.1, e.z, 0.7);
    } else {
      const m = T(e.x, e.y, e.z, 1, 1, 1, e.yaw);
      M4.rotX(m, e.rot);
      drawMesh(Models.spiky, m, tint);
      drawShadow(e.x, e.y - 0.6, e.z, 0.75);
    }
  }
  void t;
}

// ---------------- セーブ（localStorage）----------------
// koron-save = { v:1, stages: { [ステージid]: { seeds:[取った種のid], best:ベストタイム(秒), done:全部集めたか } } }
const Save = {
  KEY: 'koron-save',
  data: { v: 1, stages: {} },
  load() {
    let d = null;
    try { d = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) { d = null; }
    if (!d || typeof d !== 'object' || !d.stages || typeof d.stages !== 'object') d = { v: 1, stages: {} };
    // 前の版のベストタイム（ステージが1つだったころ）を引きつぐ
    const old = Number(localStorage.getItem('koron-best') || 0);
    if (old > 0) {
      const s0 = d.stages[0] || (d.stages[0] = { seeds: [], best: 0, done: false });
      if (!s0.best) s0.best = old;
    }
    this.data = d;
  },
  write() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.data)); localStorage.removeItem('koron-best'); } catch (e) { /* 保存できない環境でも遊べるように */ }
  },
  st(id) {
    const ss = this.data.stages;
    if (!ss[id] || !Array.isArray(ss[id].seeds)) ss[id] = { seeds: [], best: 0, done: false };
    return ss[id];
  },
  has(id, seedId) { return this.st(id).seeds.includes(seedId); },
  count(id) { return this.st(id).seeds.length; },
  addSeed(id, seedId) {
    const s = this.st(id);
    if (s.seeds.includes(seedId)) return false;
    s.seeds.push(seedId); this.write();
    return true;
  },
  // 開く条件（unlock: {stage, seeds}）をみたしているか
  unlocked(id) {
    const st = STAGES[id];
    if (!st || !st.unlock) return true;
    return this.count(st.unlock.stage) >= st.unlock.seeds;
  },
  clear() {
    this.data = { v: 1, stages: {} };
    try { localStorage.removeItem(this.KEY); localStorage.removeItem('koron-best'); } catch (e) { /* なにもしない */ }
  },
};
Save.load();

const Game = {
  state: 'title',   // title | select | erase | play | pause | seed | dead | clear
  time: 0,          // 経過時間（演出用）
  playTime: 0,      // プレイ時間
  stT: 0,
  acorns: 0,
  seeds: 0,
  shake: 0,
  toasts: [],
  lastSeed: null,
  stageId: 0,       // 遊んでいる（選んでいる）ステージ
  lastOld: false,   // さっき取った種が「とったことがある」種か
  fullRun: false,   // 1回のプレイで全部集めたか（クリア画面用）
  titleMsg: '', titleMsgT: 0,
  selShake: 0,
  fps: 60,
  cpuMs: 0,         // 1フレームの計算時間（描画をのぞく）
  menuSel: 0,
  help: false,      // 操作説明を表示中
  hurtFlash: 0,
  acornPop: 0, shownAcorns: 0,
  heartShake: 0, shownHp: 3,
  newRecord: false,
  portraitHintT: 0,

  newGame(id) {
    if (id !== undefined) this.stageId = id;
    buildLevelState(this.stageId);
    if (typeof Music !== 'undefined' && Music.setStyle) Music.setStyle(Level.stage.music);
    this.acorns = 0; this.seeds = 0; this.playTime = 0; this.shownAcorns = 0;
    P.hp = P.maxHp; this.shownHp = P.maxHp;
    const s = Level.start;
    playerReset(s.x, s.y, s.z, s.yaw);
    camReset();
    this.state = 'play'; this.stT = 0; this.help = false;
    this.toasts.length = 0;
    this.toast(Level.stage.name + '　ひかりの種を ' + Level.seedTotal + ' こ 集めよう！', 4);
    const had = Save.count(this.stageId);
    if (had > 0 && had < Level.seedTotal) this.toast('うすい種は とったことがある種（のこり ' + (Level.seedTotal - had) + ' こ）', 4);
    this.portraitHintT = 6;
    Sound.setDuck(1);
  },
  toast(msg, dur = 2.6) {
    if (this.toasts.length >= 3) this.toasts.shift();
    this.toasts.push({ msg, t: 0, dur });
  },
  getSeed(s) {
    this.seeds++;
    this.lastSeed = s;
    // その場で保存する。前に取ったことがある種は「とったことがある」扱い
    this.lastOld = !!s.old;
    const sid = this.stageId;
    const wasDone = Save.st(sid).done;
    Save.addSeed(sid, s.id);
    const fullRun = this.seeds >= Level.seedTotal;                  // 1回のプレイで全部集めた
    const firstAll = !wasDone && Save.count(sid) >= Level.seedTotal; // これまでの分とあわせて はじめて全部そろった
    Sound.play('seed');
    Sound.setDuck(0.15);
    Fx.burst(s.x, s.y + 0.7, s.z, [0.7, 1, 0.95], 30, 8);
    P.hp = P.maxHp;
    // 空中のわざの途中で取っても、演出のあとに続きが残らないようにする
    P.vy = 0; P.speed = 0; P.vx = P.vz = 0;
    P.flip = 0; P.sideFlip = false; P.dive = false; P.longJump = false;
    P.skidT = 0; P.slideT = 0; P.kickT = 0; P.wallSlide = false; P.wall = null; P.punchN = 0;
    if (fullRun || firstAll) {
      this.state = 'clear'; this.stT = 0; this.menuSel = 0;
      P.state = 'win'; P.vx = P.vz = 0;
      setTimeout(() => Sound.play('clear'), 600);
      const t = this.playTime, sv = Save.st(sid);
      sv.done = true;
      this.fullRun = fullRun;
      // ベストタイムは「1回のプレイで全部集めた」ときのタイム
      if (fullRun && (!sv.best || t < sv.best)) { sv.best = t; this.newRecord = true; }
      else this.newRecord = false;
      Save.write();
    } else {
      this.state = 'seed'; this.stT = 0;
      P.state = 'win';
    }
  },
  revealSeed(id) { revealSeedMsg(id, 'ひかりの種が あらわれた！'); },
  onFall() {
    if (P.state === 'dead') return;
    Sound.play('fall');
    P.hp -= 1;
    this.hurtFlash = 1;
    if (P.hp <= 0) { playerDie(); return; }
    playerReset(P.safe[0], P.safe[1] + 0.2, P.safe[2], P.yaw);
    P.inv = 2;
    camReset();
    this.toast('落っこちた！', 1.6);
  },
  onDeath() { this.state = 'dead'; this.stT = 0; this.menuSel = 0; Sound.play('over'); Sound.setDuck(0.3); },
  onPound(x, y, z) { poundShock(x, y, z); },
};

// 敵やアイテムを初期状態に戻す（ステージを作り直す）。取ったことがある種には印をつける

function fmtTime(t) {

}

// 画面に描いたボタンの位置（タップ判定用。毎フレーム中身だけ書きかえる）
const menuRects = [];
for (let i = 0; i < 8; i++) menuRects.push({ x: 0, y: 0, w: 0, h: 0, on: false });

// メニュー操作。決まったら項目の id を返す
function menuInput(items) {
  const n = items.length;
  if (Input.upP) { Game.menuSel = (Game.menuSel + n - 1) % n; Sound.play('cursor'); }
  if (Input.downP) { Game.menuSel = (Game.menuSel + 1) % n; Sound.play('cursor'); }
  Game.menuSel = clamp(Game.menuSel, 0, n - 1);
  if (Input.tapP) {
    for (let i = 0; i < n; i++) {
      const r = menuRects[i];
      if (r.on && Input.tapX >= r.x && Input.tapX <= r.x + r.w && Input.tapY >= r.y && Input.tapY <= r.y + r.h) {
        Game.menuSel = i;
        Sound.play('select');
        return items[i].id;
      }
    }
  }
  if (Input.okP) { Sound.play('select'); return items[Game.menuSel].id; }
  return null;
}

function goTitle() {
  Cam.override = null;
  Game.state = 'title'; Game.stT = 0; Game.menuSel = 0; Game.help = false;
  showStage(0);

// ステージ選びの画面へ。sel: はじめに選んでおくステージ

// ---------------- 更新 ----------------
const seedOv = { eye: [0, 0, 0], target: [0, 0, 0] };

function update(dt) {
  Game.time += dt;
  Game.stT += dt;
  Game.shake = Math.max(0, Game.shake - dt);
  Game.hurtFlash = Math.max(0, Game.hurtFlash - dt * 1.8);
  Game.acornPop = Math.max(0, Game.acornPop - dt * 4);
  Game.heartShake = Math.max(0, Game.heartShake - dt * 2.5);
  Game.portraitHintT = Math.max(0, Game.portraitHintT - dt);
  // メッセージ（配列を作り直さずに古いものを消す）
  const ts = Game.toasts;
  for (let i = ts.length - 1; i >= 0; i--) { ts[i].t += dt; if (ts[i].t >= ts[i].dur) ts.splice(i, 1); }
  if (Game.acorns !== Game.shownAcorns) { Game.shownAcorns = Game.acorns; Game.acornPop = 1; }
  if (P.hp < Game.shownHp) Game.heartShake = 1;
  Game.shownHp = P.hp;

  // 操作説明を表示中は、閉じる操作だけ受け付ける
  if (Game.help) {
    if (Input.okP || Input.backP || Input.tapP || Input.pauseP || Input.jumpP) { Game.help = false; Sound.play('cursor'); }
    if (Game.state === 'title') { titleCamera(dt); updateLevel(dt); }
    return;
  }
  Game.titleMsgT = Math.max(0, Game.titleMsgT - dt);
  Game.selShake = Math.max(0, Game.selShake - dt);

  if (Game.state === 'title') {
    titleCamera(dt);
    updateLevel(dt);
    if (Game.stT > 0.3) {
      const id = menuInput(MENUS.title);
      if (id === 'start') goSelect();
      else if (id === 'help') Game.help = true;
      else if (id === 'erase') { Game.state = 'erase'; Game.stT = 0; Game.menuSel = 0; }
    }
    return;
  }
  if (Game.state === 'erase') {
    // セーブを消す前の確認（「けさない」が先に選ばれている）
    titleCamera(dt);
    updateLevel(dt);
    if (Input.backP) { Game.state = 'title'; Game.menuSel = 2; Sound.play('cursor'); return; }
    if (Game.stT > 0.2) {
      const id = menuInput(MENUS.erase);
      if (id === 'yes') {
        Save.clear();
        Game.stageId = 0;
        showStage(0);
        Game.titleMsg = 'きろくを けしました'; Game.titleMsgT = 2.5;
        Game.state = 'title'; Game.stT = 0; Game.menuSel = 0;
      } else if (id === 'no') { Game.state = 'title'; Game.stT = 0; Game.menuSel = 2; }
    }
    return;
  }
  if (Game.state === 'select') {
    titleCamera(dt);
    updateLevel(dt);
    if (Game.stT > 0.2) updateSelect();
    return;
  }
  if (Game.state === 'pause') {
    if (Input.pauseP || Input.backP) { Game.state = 'play'; Sound.setDuck(1); Sound.play('pause'); return; }
    const id = menuInput(MENUS.pause);
    if (id === 'resume') { Game.state = 'play'; Sound.setDuck(1); }
    else if (id === 'restart') Game.newGame();
    else if (id === 'sfx') Sound.setSfx(!Sound.sfxOn);
    else if (id === 'bgm') Sound.setBgm(!Sound.bgmOn);
    else if (id === 'quality') Perf.cycle();
    else if (id === 'help') Game.help = true;
    else if (id === 'select') goSelect(Game.stageId);
    else if (id === 'title') goTitle();
    return;
  }
  if (Input.pauseP && Game.state === 'play') {
    Game.state = 'pause'; Game.menuSel = 0;
    Sound.play('pause'); Sound.setDuck(0.35);
    return;
  }

  if (Game.state === 'play') Game.playTime += dt;

  if (Game.state === 'play' || Game.state === 'dead') {
    updateLevel(dt);
    updatePlayer(dt);
    updateEntities(dt);
    updateCamera(dt);
  } else if (Game.state === 'seed' || Game.state === 'clear') {
    updatePlayer(dt);
    // 種を取った演出：カメラが正面にゆっくり回り込む
    const a = P.yaw + Math.sin(Game.stT * 0.6) * 0.5;
    const d = 6.5 - Math.min(1, Game.stT) * 0.8;
    seedOv.eye[0] = P.x + Math.sin(a) * d; seedOv.eye[1] = P.y + 2.6; seedOv.eye[2] = P.z + Math.cos(a) * d;
    seedOv.target[0] = P.x; seedOv.target[1] = P.y + 2.1; seedOv.target[2] = P.z;
    Cam.override = seedOv;
    updateCamera(dt);
    if (Game.state === 'seed' && Game.stT > 2.8) {
      Cam.override = null;
      // 空中で取ったときは落ちるところから再開（'ground' のままだと重力がかからず浮き続ける）
      if (P.grounded) P.state = 'ground';
      else { P.state = 'air'; P.airT = 0; P.coyote = 0; P.jumpHeld = false; P.fallFrom = P.y; }
      P.stateT = 0;
      Game.state = 'play';
      Sound.setDuck(1);
      const have = Save.count(Game.stageId);
      Game.toast(Game.lastOld ? `とったことがある種（これまでに ${have} / ${Level.seedTotal}）` : `ひかりの種 ${have} / ${Level.seedTotal}`, 2.5);
    }
    if (Game.state === 'clear' && Game.stT > 3) {
      const id = menuInput(MENUS.clear);
      if (id === 'again') Game.newGame();
      else if (id === 'select') goSelect(Game.stageId);
      else if (id === 'title') goTitle();
    }
  }
  if (Game.state === 'dead' && Game.stT > 1.6) {
    const id = menuInput(MENUS.dead);
    if (id === 'retry') respawnAtStart(); // その場の進み具合は残して、スタート地点から再開
    else if (id === 'select') goSelect(Game.stageId);
    else if (id === 'title') goTitle();
  }
  Fx.update(dt);
}

function titleCamera(dt) {
  const a = Game.time * 0.08;
  const tc = (Level.stage && Level.stage.titleCam) || { r: 46, y: 22, tx: 0, ty: 4, tz: -4 };
  Cam.override = null;
  Cam.eye[0] = tc.tx + Math.sin(a) * tc.r; Cam.eye[1] = tc.y + Math.sin(a * 0.7) * 4; Cam.eye[2] = tc.tz + Math.cos(a) * tc.r;
  Cam.target[0] = tc.tx; Cam.target[1] = tc.ty; Cam.target[2] = tc.tz;
  void dt;
}

// ---------------- ステージ選び ----------------
// 項目：ステージ 0..n-1、そのあと「もどる」。←→↑↓で えらぶ
function updateSelect() {
  const n = STAGES.length + 1;
  let sel = Game.menuSel;
  const prev = sel;
  if (Input.leftP || Input.upP) sel = (sel + n - 1) % n;
  if (Input.rightP || Input.downP) sel = (sel + 1) % n;
  let pick = null;
  if (Input.tapP) {
    for (let i = 0; i < n; i++) {
      const r = menuRects[i];
      if (r.on && Input.tapX >= r.x && Input.tapX <= r.x + r.w && Input.tapY >= r.y && Input.tapY <= r.y + r.h) { sel = i; pick = i; }
    }
  }
  if (Input.okP) pick = sel;
  if (sel !== prev) {
    if (pick === null) Sound.play('cursor');
    Game.menuSel = sel;
    if (sel < STAGES.length) showStage(sel);
  }
  if (Input.backP) { Sound.play('cursor'); goTitle(); return; }
  if (pick === null) return;
  if (pick >= STAGES.length) { Sound.play('select'); goTitle(); return; }
  if (!Save.unlocked(pick)) { Game.selShake = 0.4; Sound.play('hurt'); return; }
  Sound.play('select');
  Game.newGame(pick);
}

// ---------------- 描画 ----------------
function render() {
  if (!R.ok) return;
  beginFrame(Cam.eye, Cam.target, Cam.fov);
  drawLevel();
  // カメラが主人公にくっつくほど近いとき（壁ぎわ）は、体の内側が映らないように描かない
  if (Game.state !== 'title' && (Cam.shown > 0.9 || Cam.override)) drawPlayer();
  drawEntities();
  // 半透明もの（影・粒）
  setBlend(true);
  gl.enable(gl.POLYGON_OFFSET_FILL);
  gl.polygonOffset(-2, -2);
  if (Game.state !== 'title' && P.state !== 'dead') drawShadow(P.x, P.y, P.z, 0.55, 0.38);
  gl.disable(gl.POLYGON_OFFSET_FILL);
  Fx.draw();
  setBlend(false);
}

// ---------------- 画面の文字・ボタン ----------------
let hudW = 0, hudH = 0, hudDpr = 1;
function resizeHud() {
  hudDpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  if (w !== hudW || h !== hudH || hudCanvas.width !== Math.floor(w * hudDpr)) {
    hudW = w; hudH = h;
    hudCanvas.width = Math.floor(w * hudDpr);
    hudCanvas.height = Math.floor(h * hudDpr);
    layoutTouch(w, h);
  }
}
window.addEventListener('orientationchange', () => { hudW = 0; });

const FONT_FAMILY = '"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","BIZ UDPGothic","Noto Sans JP",sans-serif';
const fontCache = new Map();
function setFont(size) {
  const k = Math.round(size * 2);
  let f = fontCache.get(k);
  if (!f) { f = 'bold ' + k / 2 + 'px ' + FONT_FAMILY; fontCache.set(k, f); }
  hud.font = f;
}

function txt(s, x, y, size, color = '#fff', align = 'left', stroke = 'rgba(40,50,90,.9)') {
  setFont(size);
  hud.textAlign = align;
  hud.textBaseline = 'middle';
  hud.lineJoin = 'round';
  if (stroke) {
    hud.lineWidth = Math.max(3, size * 0.24);
    hud.strokeStyle = stroke;
    hud.strokeText(s, x, y);
  }
  hud.fillStyle = color;
  hud.fillText(s, x, y);
}
// 幅に収まるように文字を小さくする
function txtFit(s, x, y, size, maxW, color, align, stroke) {
  setFont(size);
  const w = hud.measureText(s).width;
  if (w > maxW) size = Math.max(9, size * maxW / w);
  txt(s, x, y, size, color, align, stroke);
}

function rrect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  hud.beginPath();
  hud.moveTo(x + r, y);
  hud.arcTo(x + w, y, x + w, y + h, r);
  hud.arcTo(x + w, y + h, x, y + h, r);
  hud.arcTo(x, y + h, x, y, r);
  hud.arcTo(x, y, x + w, y, r);
  hud.closePath();
}
function panel(x, y, w, h, r, fill = 'rgba(30,50,100,.42)', stroke = 'rgba(255,255,255,.55)') {
  rrect(x, y, w, h, r);
  hud.fillStyle = fill; hud.fill();
  if (stroke) { hud.lineWidth = 2; hud.strokeStyle = stroke; hud.stroke(); }
}

function drawHeartIcon(x, y, s, full) {
  hud.save();
  hud.translate(x, y);
  hud.scale(s / 20, s / 20);
  hud.beginPath();
  hud.moveTo(0, 7);
  hud.bezierCurveTo(-11, -1, -10, -12, 0, -5.5);
  hud.bezierCurveTo(10, -12, 11, -1, 0, 7);
  hud.closePath();
  hud.fillStyle = full ? '#ff5577' : 'rgba(255,255,255,.28)';
  hud.strokeStyle = 'rgba(40,50,90,.9)';
  hud.lineWidth = 2.6;
  hud.stroke();
  hud.fill();
  if (full) { // つや
    hud.fillStyle = 'rgba(255,255,255,.7)';
    hud.beginPath(); hud.ellipse(-4.5, -4.5, 2.4, 1.6, -0.6, 0, TAU); hud.fill();
  }
  hud.restore();
}

function drawAcornIcon(x, y, s) {
  hud.save();
  hud.translate(x, y);
  hud.fillStyle = '#d69548'; hud.strokeStyle = 'rgba(40,50,90,.9)'; hud.lineWidth = 2;
  hud.beginPath(); hud.ellipse(0, s * 0.12, s * 0.32, s * 0.4, 0, 0, TAU); hud.fill(); hud.stroke();
  hud.fillStyle = 'rgba(255,255,255,.45)';
  hud.beginPath(); hud.ellipse(-s * 0.12, s * 0.12, s * 0.07, s * 0.14, 0, 0, TAU); hud.fill();
  hud.fillStyle = '#7a5230';
  hud.beginPath(); hud.ellipse(0, -s * 0.18, s * 0.38, s * 0.2, 0, 0, TAU); hud.fill(); hud.stroke();
  hud.beginPath(); hud.moveTo(0, -s * 0.36); hud.lineTo(s * 0.06, -s * 0.5); hud.stroke();
  hud.restore();
}

function drawSeedIcon(x, y, s, on, glow) {
  hud.save();
  hud.translate(x, y);
  if (on && glow) {
    hud.fillStyle = 'rgba(160,255,240,.35)';
    hud.beginPath(); hud.arc(0, 0, s * 0.7, 0, TAU); hud.fill();
  }
  hud.beginPath();
  hud.moveTo(0, -s * 0.5); hud.lineTo(s * 0.32, 0); hud.lineTo(0, s * 0.5); hud.lineTo(-s * 0.32, 0); hud.closePath();
  hud.fillStyle = on ? '#9cfff0' : 'rgba(255,255,255,.22)';
  hud.strokeStyle = 'rgba(40,50,90,.9)'; hud.lineWidth = 2;
  hud.fill(); hud.stroke();
  if (on) {
    hud.fillStyle = 'rgba(255,255,255,.85)';
    hud.beginPath(); hud.moveTo(0, -s * 0.36); hud.lineTo(s * 0.1, -s * 0.05); hud.lineTo(-s * 0.06, 0); hud.closePath(); hud.fill();
  }
  hud.restore();
}

// メニューのボタンを縦に並べて描く
function drawMenu(items, cx, top, W, H) {
  const small = Math.min(W, H) < 500;
  const bw = clamp(W * 0.6, 220, 340);
  let y = top;
  for (let i = 0; i < menuRects.length; i++) menuRects[i].on = false;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const bh = it.big ? (small ? 46 : 54) : (small ? 36 : 42);
    const sel = i === Game.menuSel;
    const x = cx - bw / 2;
    const pop = sel ? 1 + Math.sin(Game.time * 6) * 0.015 : 1;
    hud.save();
    hud.translate(cx, y + bh / 2); hud.scale(pop, pop); hud.translate(-cx, -(y + bh / 2));
    panel(x, y, bw, bh, bh / 2, sel ? 'rgba(255,209,102,.95)' : 'rgba(255,255,255,.88)', sel ? '#fff' : 'rgba(40,50,90,.35)');
    hud.restore();
    txtFit(it.label(), cx, y + bh / 2 + 1, it.big ? (small ? 19 : 22) : (small ? 15 : 17), bw - 24, sel ? '#5a3300' : '#2c3e70', 'center', null);
    if (sel && !Input.touchMode) txt('▶', x - 16, y + bh / 2 + 1, small ? 14 : 17, '#ffd166', 'center');
    const r = menuRects[i];
    r.x = x; r.y = y; r.w = bw; r.h = bh; r.on = true;
    y += bh + (small ? 8 : 10);
  }
  return y;
}

// 操作説明
function drawHelp(W, H) {
  hud.fillStyle = 'rgba(20,30,60,.6)';
  hud.fillRect(0, 0, W, H);
  const S = Input.safe;
  const pw = Math.min(W - S.l - S.r - 20, 620), ph = Math.min(H - S.t - S.b - 16, 520);
  const px = (W - pw) / 2, py = (H - ph) / 2;
  panel(px, py, pw, ph, 18, 'rgba(255,252,240,.97)', '#ffd166');
  const touch = Input.touchMode || (Input.hasTouch && !Input.padOn && !Input.keys.size);
  const ctl = touch
    ? [['いどう', '画面の左をなぞる'], ['カメラ', '画面の右をなぞる（2回タップで後ろへ）'], ['ジャンプ／パンチ／しゃがむ', '右下のボタン'], ['しゃがむ＋ジャンプ', 'しゃがむを押したまま ジャンプへ指をすべらせる']]
    : [['いどう', 'WASD / 矢印キー（パッド：左スティック）'], ['ジャンプ／パンチ', 'スペース ／ J（パッド：A ／ B・X）'], ['しゃがむ', 'Shift（パッド：L・ZL・ZR）'], ['カメラ', 'ドラッグ・Q/E・右スティック（F：後ろへ　R：遠近）']];
  const moves = [
    ['3段ジャンプ', '走って、着地のたびにジャンプ（3回目はくるっと高く）'],
    ['幅とび', '走りながら しゃがむ＋ジャンプ'],
    ['バク宙', '止まって しゃがむ＋ジャンプ'],
    ['くるりんジャンプ', '走っていて逆を入れ、ブレーキ中にジャンプ'],
    ['壁キック', '壁にぶつかった瞬間にジャンプ'],
    ['ヒップドロップ', '空中で しゃがむ（着地してすぐジャンプで大ジャンプ）'],
    ['パンチ3れんぞく／ダイブ', 'パンチを続けて押す／走りジャンプ中にパンチ'],
    ['坂すべり', '坂で しゃがむ'],
  ];
  const lines = ctl.length + moves.length + 2;
  const lh = clamp((ph - 70) / lines, 15, 28);
  const fs = clamp(lh * 0.62, 10, 16);
  txt('あそびかた', W / 2, py + 26, clamp(lh, 18, 24), '#ff9f1c', 'center', '#fff');
  let y = py + 54;
  const colA = px + 16, colB = px + Math.min(pw * 0.38, 210);
  txt('そうさ', colA, y, fs, '#2c7be5', 'left', null); y += lh;
  for (const [a, b] of ctl) { txtFit(a, colA, y, fs, colB - colA - 8, '#2c3e70', 'left', null); txtFit(b, colB, y, fs, px + pw - colB - 12, '#444', 'left', null); y += lh; }
  txt('わざ', colA, y, fs, '#2c7be5', 'left', null); y += lh;
  for (const [a, b] of moves) { txtFit(a, colA, y, fs, colB - colA - 8, '#2c3e70', 'left', null); txtFit(b, colB, y, fs, px + pw - colB - 12, '#444', 'left', null); y += lh; }
  if (Math.floor(Game.time * 2) % 2 === 0) txt(touch ? 'タップでとじる' : 'Enter / Esc でとじる', W / 2, py + ph - 14, fs, '#999', 'center', null);
}

function drawHud() {
  resizeHud();
  hud.setTransform(hudDpr, 0, 0, hudDpr, 0, 0);
  hud.clearRect(0, 0, hudW, hudH);
  const W = hudW, H = hudH;
  const S = Input.safe;
  const small = Math.min(W, H) < 500;
  const fs = small ? 16 : 20;

  if (!R.ok) {
    txt('この端末では 3D 表示（WebGL2）が使えません', W / 2, H / 2, 18, '#fff', 'center');
    return;
  }

  if (Game.state === 'title' || Game.state === 'erase') { drawTitle(W, H, fs, small); if (Game.help) drawHelp(W, H); return; }
  if (Game.state === 'select') { drawSelect(W, H, fs, small); return; }

  // ---- 体力 ----
  const L = S.l + 12, T0 = S.t + 10;
  const hs = small ? 26 : 30;
  const hx = Math.sin(Game.time * 60) * Game.heartShake * 4;
  panel(L, T0, P.maxHp * (hs + 6) + 14, hs + 14, (hs + 14) / 2);
  for (let i = 0; i < P.maxHp; i++) {
    const danger = P.hp === 1 && i === 0 ? 1 + Math.sin(Game.time * 9) * 0.12 : 1;
    drawHeartIcon(L + 7 + hs / 2 + 3 + i * (hs + 6) + hx, T0 + (hs + 14) / 2 + 1, hs * danger, i < P.hp);
  }
  // ---- どんぐり ----
  const ay = T0 + hs + 22;
  const pop = 1 + Game.acornPop * 0.35;
  setFont(fs + 2);
  const aw = hud.measureText('× ' + Game.acorns).width;
  panel(L, ay, aw + 50, hs + 8, (hs + 8) / 2);
  drawAcornIcon(L + 20, ay + (hs + 8) / 2, 24 * pop);
  txt('× ' + Game.acorns, L + 38, ay + (hs + 8) / 2 + 1, (fs + 2) * pop, Game.acornPop > 0 ? '#ffe08a' : '#fff');
  // ---- 種 ----
  const n = Level.seedTotal;
  const sw = n * 26 + 18;
  const portrait = H > W;
  const seedY = portrait ? T0 + hs + 22 + hs + 22 : T0;
  const seedX = portrait ? L : W / 2 - sw / 2;
  panel(seedX, seedY, sw, hs + 14, (hs + 14) / 2);
  // 明るい：このプレイで取った／うすい：前に取ったことがある／から：まだ
  let oldN = 0;
  for (const q of Level.seeds) if (q.old && !q.got) oldN++;
  for (let i = 0; i < n; i++) {
    const x = seedX + 22 + i * 26, y = seedY + (hs + 14) / 2;
    if (i < Game.seeds) drawSeedIcon(x, y, 22, true, true);
    else if (i < Game.seeds + oldN) { hud.globalAlpha = 0.45; drawSeedIcon(x, y, 22, true, false); hud.globalAlpha = 1; }
    else drawSeedIcon(x, y, 22, false, false);
  }
  // ---- タイム ----
  const touchUI = Input.touchMode && (Game.state === 'play' || Game.state === 'pause');
  const tx = touchUI ? (Input.btns.camera ? Input.btns.camera.x - 32 : W - 130) : W - S.r - 14;
  const tStr = fmtTime(Game.playTime);
  setFont(fs);
  // せまい横画面では種の表示とぶつかるので、1段下へ
  const tLow = !portrait && tx - hud.measureText(tStr).width < seedX + sw + 6;
  txt(tStr, tLow ? W - S.r - 14 : tx, tLow ? T0 + hs + 14 + 20 : T0 + (hs + 14) / 2, fs, '#fff', 'right');

  // ---- メッセージ ----
  // 種ゲットの演出中は、見出しと重なるので出さない
  const showToast = Game.state === 'play';
  for (let i = 0; showToast && i < Game.toasts.length; i++) {
    const t = Game.toasts[i];
    const a = Math.min(1, t.t * 5, (t.dur - t.t) * 2);
    const yy = (portrait ? H * 0.3 : H * 0.22) + i * (fs + 20) - (1 - Math.min(1, t.t * 5)) * 10;
    hud.globalAlpha = a;
    setFont(fs + 1);
    const tw = Math.min(hud.measureText(t.msg).width, W - 40);
    panel(W / 2 - tw / 2 - 16, yy - (fs + 12) / 2, tw + 32, fs + 12, (fs + 12) / 2, 'rgba(255,255,255,.88)', null);
    txtFit(t.msg, W / 2, yy + 1, fs + 1, W - 40, '#2c3e70', 'center', null);
    hud.globalAlpha = 1;
  }

  // ---- ダメージの赤いふち ----
  if (Game.hurtFlash > 0) {
    const g = hud.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    g.addColorStop(0, 'rgba(255,40,60,0)');
    g.addColorStop(1, `rgba(255,40,60,${Game.hurtFlash * 0.45})`);
    hud.fillStyle = g; hud.fillRect(0, 0, W, H);
  }

  if (Game.state === 'seed' && Game.lastSeed) drawSeedGet(W, H, fs);
  if (Game.state === 'clear') drawClear(W, H, fs, small);
  if (Game.state === 'dead') {
    hud.fillStyle = `rgba(30,10,40,${Math.min(0.5, Game.stT * 0.35)})`;
    hud.fillRect(0, 0, W, H);
    const k = Math.min(1, Game.stT * 2);
    txt('ころんは たおれてしまった…', W / 2, H * 0.3 - (1 - k) * 20, clamp(W / 20, 22, 40), '#fff', 'center');
    if (Game.stT > 1.6) drawMenu(MENUS.dead, W / 2, H * 0.45, W, H);
  }
  if (Game.state === 'pause') {
    hud.fillStyle = 'rgba(20,30,60,.55)';
    hud.fillRect(0, 0, W, H);
    const land = W > H;
    const items = MENUS.pause;
    const menuH = items.length * (small ? 44 : 52) + 10;
    if (land && W > 540) {
      // 横長：左に進み具合、右にメニュー
      txt('ポーズ', W * 0.3, H * 0.2, small ? 30 : 40, '#fff', 'center');
      drawProgress(W * 0.3, H * 0.2 + 44, fs);
      drawMenu(items, W * 0.68, Math.max(S.t + 16, (H - menuH) / 2), W * 0.6, H);
    } else {
      // 体力・どんぐり・種の表示の下から並べる（縦向きでは種の表示が左上の3段目にある）
      const top = (portrait ? seedY : T0) + hs + 14 + 10;
      txt('ポーズ', W / 2, top + 20, small ? 28 : 40, '#fff', 'center');
      const y = drawProgress(W / 2, top + 56, fs * 0.85, true);
      drawMenu(items, W / 2, Math.max(y + 10, H - S.b - menuH - 10), W, H);
    }
  }
  if (Game.help) drawHelp(W, H);

  // ---- タッチ操作ボタン ----
  if (Input.touchMode && Game.state === 'play') drawTouchUI();
  // ---- 縦向きの案内 ----
  if (Input.touchMode && portrait && Game.state === 'play' && Game.portraitHintT > 0) {
    hud.globalAlpha = Math.min(1, Game.portraitHintT);
    panel(W / 2 - 130, H * 0.55, 260, 34, 17, 'rgba(255,255,255,.85)', null);
    txt('よこむきにすると 遊びやすいよ', W / 2, H * 0.55 + 18, 14, '#2c3e70', 'center', null);
    hud.globalAlpha = 1;
  }
}

// 集めた種の一覧。compact なら 1 行にまとめる
function drawProgress(cx, y, fs, compact) {
  const left = Level.seeds.filter((s) => !s.got).length;
  const have = Save.count(Game.stageId);
  if (compact) {
    txt(`ひかりの種 ${Game.seeds} / ${Level.seedTotal}（これまで ${have}）　どんぐり ${Game.acorns}`, cx, y, fs, '#9cfff0', 'center');
    return y + fs + 8;
  }
  txt(Level.stage.name + '　これまでに ' + have + ' / ' + Level.seedTotal, cx, y, fs * 0.8, '#ffe9a8', 'center');
  y += fs + 6;
  let yy = y;
  // 画面の高さが足りないときは種の名前を省く
  const got = Level.seeds.length - left;
  const names = y + got * (fs + 6) + fs * 2 + 30 < hudH - Input.safe.b;
  for (const s of Level.seeds) {
    if (!s.got || !names) continue;
    txt('◆ ' + s.name, cx, yy, fs * 0.85, '#9cfff0', 'center'); yy += fs + 6;
  }
  txt('のこり ' + left + ' こ　どんぐり ' + Game.acorns + ' こ', cx, yy + 6, fs * 0.85, '#fff', 'center');
  txt('タイム ' + fmtTime(Game.playTime), cx, yy + fs + 16, fs * 0.85, '#fff', 'center');
  return yy + fs * 2 + 20;
}

function drawTitle(W, H, fs, small) {
  const g = hud.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(30,60,120,.35)');
  hud.fillStyle = g; hud.fillRect(0, 0, W, H);
  const portrait = H > W;
  const ts = clamp(Math.min(W / 11, H / 6), 26, 70);
  const bob = Math.sin(Game.time * 2) * 4;
  const ty = portrait ? H * 0.2 : H * 0.2;
  // ロゴ：1文字ずつ少しずつ揺らす
  txt('ころんの', W / 2, ty - ts * 0.2 + bob, ts * 0.55, '#fff6d8', 'center');
  const title = '空島アドベンチャー';
  setFont(ts);
  const tw = Math.min(hud.measureText(title).width, W - 30);
  const k = tw / hud.measureText(title).width;
  let x = W / 2 - tw / 2;
  for (let i = 0; i < title.length; i++) {
    const ch = title[i];
    setFont(ts * k);
    const cw = hud.measureText(ch).width;
    const yy = ty + ts * 0.85 + Math.sin(Game.time * 3 + i * 0.6) * 4;
    txt(ch, x + cw / 2, yy, ts * k, i < 2 ? '#8ee0ff' : '#ffd166', 'center', 'rgba(40,50,90,.95)');
    x += cw;
  }
  const menuTop = portrait ? H * 0.46 : ty + ts * 1.8;
  const y = drawMenu(MENUS.title, W / 2, menuTop, W, H);
  const touch = Input.touchMode || Input.hasTouch;
  const hint = touch ? 'ボタンをタップしてね' : 'Enter / スペースで決定　↑↓で えらぶ';
  if (Math.floor(Game.time * 1.5) % 2 === 0) txt(hint, W / 2, y + 12, fs * 0.8, '#fff', 'center');
  let by = H - Input.safe.b - 20;
  // 全ステージでとった種の数
  let got = 0;
  for (const st of STAGES) got += Save.count(st.id);
  if (got) { txt('あつめた ひかりの種 ' + got + ' こ', W / 2, by, fs * 0.8, '#ffe9a8', 'center'); by -= fs + 6; }
  if (touch && portrait) txt('スマホは よこむきが おすすめ', W / 2, by, fs * 0.75, '#fff', 'center');
  if (Game.titleMsgT > 0) {
    hud.globalAlpha = Math.min(1, Game.titleMsgT * 2);
    panel(W / 2 - 120, y + 30, 240, 36, 18, 'rgba(255,255,255,.9)', null);
    txt(Game.titleMsg, W / 2, y + 49, fs * 0.85, '#2c3e70', 'center', null);
    hud.globalAlpha = 1;
  }
  if (Game.state === 'erase') drawEraseConfirm(W, H, fs);
  void small;
}

// セーブを消す前の確認
function drawEraseConfirm(W, H, fs) {
  hud.fillStyle = 'rgba(20,30,60,.6)';
  hud.fillRect(0, 0, W, H);
  const pw = Math.min(W - 30, 420), ph = Math.min(H - 30, 250);
  const px = (W - pw) / 2, py = (H - ph) / 2;
  panel(px, py, pw, ph, 18, 'rgba(255,252,240,.97)', '#ff8a8a');
  txt('きろくを けしますか？', W / 2, py + 30, fs + 2, '#e04a5a', 'center', '#fff');
  txtFit('とった ひかりの種と ベストタイムが ぜんぶ きえます', W / 2, py + 62, fs * 0.8, pw - 30, '#2c3e70', 'center', null);
  drawMenu(MENUS.erase, W / 2, py + 86, pw, H);
}

// ステージ選び：カードを横（せまい縦画面では縦）にならべる
function drawSelect(W, H, fs, small) {
  const S = Input.safe;
  const g = hud.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(20,30,70,.15)');
  g.addColorStop(1, 'rgba(20,30,70,.5)');
  hud.fillStyle = g; hud.fillRect(0, 0, W, H);
  txt('ステージを えらぼう', W / 2, S.t + (small ? 26 : 40), small ? 22 : 30, '#ffd166', 'center');
  for (let i = 0; i < menuRects.length; i++) menuRects[i].on = false;
  const n = STAGES.length;
  const portrait = H > W * 1.1;
  const gap = small ? 10 : 18;
  const top = S.t + (small ? 48 : 72);
  const backH = small ? 38 : 44;
  const availH = H - top - S.b - backH - (small ? 40 : 56);
  let cw, ch;
  if (portrait) { cw = Math.min(W - S.l - S.r - 30, 380); ch = clamp((availH - gap * (n - 1)) / n, 92, 170); }
  else { cw = Math.min((W - S.l - S.r - 40 - gap * (n - 1)) / n, 300); ch = clamp(availH, 120, small ? 170 : 200); }
  const totalW = portrait ? cw : cw * n + gap * (n - 1);
  const x0 = W / 2 - totalW / 2;
  for (let i = 0; i < n; i++) {
    const st = STAGES[i];
    const x = portrait ? x0 : x0 + i * (cw + gap);
    const y = portrait ? top + i * (ch + gap) : top;
    const sel = Game.menuSel === i;
    const open = Save.unlocked(i);
    const sv = Save.st(i);
    const shake = sel && Game.selShake > 0 ? Math.sin(Game.selShake * 60) * 6 * Game.selShake / 0.4 : 0;
    const pop = sel ? 1 + Math.sin(Game.time * 5) * 0.01 : 1;
    hud.save();
    hud.translate(x + cw / 2 + shake, y + ch / 2); hud.scale(pop, pop); hud.translate(-(x + cw / 2), -(y + ch / 2));
    panel(x, y, cw, ch, 16, open ? (sel ? 'rgba(255,250,232,.96)' : 'rgba(255,255,255,.82)') : 'rgba(70,80,110,.82)', sel ? '#ffd166' : 'rgba(255,255,255,.6)');
    if (sel) { hud.lineWidth = 4; hud.strokeStyle = '#ffd166'; rrect(x - 3, y - 3, cw + 6, ch + 6, 18); hud.stroke(); }
    // 色の帯
    hud.fillStyle = open ? st.color : '#8890a8';
    rrect(x + 10, y + 10, cw - 20, small ? 6 : 8, 4); hud.fill();
    const lh = clamp(ch / 6, 15, 30);
    let yy = y + 14 + lh * 0.9;
    txtFit((i + 1) + '. ' + st.name, x + cw / 2, yy, small ? 18 : 22, cw - 20, open ? '#2c3e70' : '#fff', 'center', null);
    yy += lh * 0.95;
    if (open) {
      txtFit(st.sub || '', x + cw / 2, yy, small ? 12 : 14, cw - 20, '#6a7aa0', 'center', null);
      yy += lh;
      const total = st.seedTotal || 0;
      const got = sv.seeds.length;
      // 種のアイコン
      const iconS = clamp((cw - 30) / Math.max(total, 1), 12, 22);
      const ix0 = x + cw / 2 - (total - 1) * iconS / 2;
      for (let k = 0; k < total; k++) drawSeedIcon(ix0 + k * iconS, yy, iconS * 0.85, k < got, false);
      yy += lh * 0.95;
      txtFit('ひかりの種 ' + got + ' / ' + total + (sv.done ? '　クリア！' : ''), x + cw / 2, yy, small ? 14 : 16, cw - 20, sv.done ? '#e07a00' : '#2c3e70', 'center', null);
      yy += lh * 0.85;
      txtFit('ベスト ' + (sv.best ? fmtTime(sv.best) : '--:--.--'), x + cw / 2, yy, small ? 13 : 15, cw - 20, '#7a5230', 'center', null);
    } else {
      yy += lh * 0.4;
      txt('？', x + cw / 2, yy + lh * 0.3, small ? 28 : 38, '#fff', 'center', 'rgba(40,50,90,.9)');
      yy += lh * 1.4;
      const u = st.unlock, need = STAGES[u.stage] ? STAGES[u.stage].name : '';
      txtFit(need + 'で', x + cw / 2, yy, small ? 13 : 15, cw - 20, '#ffe9a8', 'center', null);
      yy += lh * 0.8;
      txtFit('ひかりの種を ' + u.seeds + 'こ 集めると ひらく（いま ' + Save.count(u.stage) + 'こ）', x + cw / 2, yy, small ? 12 : 14, cw - 20, '#ffe9a8', 'center', null);
    }
    hud.restore();
    const r = menuRects[i];
    r.x = x; r.y = y; r.w = cw; r.h = ch; r.on = true;
  }
  // もどる
  const by = portrait ? top + n * (ch + gap) : top + ch + gap + 6;
  const bw = 180, bx = W / 2 - bw / 2;
  const selB = Game.menuSel === n;
  panel(bx, by, bw, backH, backH / 2, selB ? 'rgba(255,209,102,.95)' : 'rgba(255,255,255,.88)', selB ? '#fff' : 'rgba(40,50,90,.35)');
  txt('もどる', W / 2, by + backH / 2 + 1, small ? 15 : 17, selB ? '#5a3300' : '#2c3e70', 'center', null);
  const rb = menuRects[n];
  rb.x = bx; rb.y = by; rb.w = bw; rb.h = backH; rb.on = true;
  const touch = Input.touchMode || Input.hasTouch;
  if (Math.floor(Game.time * 1.5) % 2 === 0) txt(touch ? 'カードを タップして はじめる' : '←→で えらんで Enter / スペースで はじめる', W / 2, Math.min(H - S.b - 16, by + backH + 22), fs * 0.75, '#fff', 'center');
}

function drawSeedGet(W, H, fs) {
  const t = Game.stT;
  const k = Math.min(1, t * 3);
  const bounce = 1 + Math.sin(Math.min(1, t * 2.5) * Math.PI) * 0.25;
  // 縦向きでは左上の種の表示と重ならないように少し下げる
  const cy = H > W ? Math.max(H * 0.22, Input.safe.t + 225) : H * 0.22;
  // 光の筋
  hud.save();
  hud.translate(W / 2, cy);
  hud.rotate(t * 0.6);
  hud.globalAlpha = Math.min(0.3, t) * (t > 2.3 ? Math.max(0, (2.8 - t) * 2) : 1);
  hud.fillStyle = '#fff6b0';
  const rl = Math.max(W, H) * 0.6;
  for (let i = 0; i < 12; i++) {
    hud.rotate(TAU / 12);
    hud.beginPath(); hud.moveTo(0, 0); hud.lineTo(rl, -rl * 0.08); hud.lineTo(rl, rl * 0.08); hud.closePath(); hud.fill();
  }
  hud.restore();
  hud.globalAlpha = 1;
  drawSeedIcon(W / 2, cy - 30, 54 * bounce * k, true, true);
  txt('ひかりの種 ゲット！', W / 2, cy + 40 - (1 - k) * 30, clamp(W / 16, 26, 52) * k * (t < 0.4 ? bounce : 1), '#9cfff0', 'center');
  if (t > 0.4) txt(Game.lastSeed.name, W / 2, cy + 40 + clamp(W / 16, 26, 52) * 0.75 + 6, fs, '#fff', 'center');
  const have = Save.count(Game.stageId);
  if (t > 0.6) txt(Game.lastOld ? 'とったことがある 種（' + have + ' / ' + Level.seedTotal + '）' : have + ' / ' + Level.seedTotal, W / 2, cy + 40 + clamp(W / 16, 26, 52) * 0.75 + fs + 16, Game.lastOld ? fs : fs + 4, Game.lastOld ? '#d8e4ff' : '#ffe08a', 'center');
}

function drawClear(W, H, fs, small) {
  hud.fillStyle = `rgba(255,250,220,${Math.min(0.4, Game.stT * 0.2)})`;
  hud.fillRect(0, 0, W, H);
  const k = Math.min(1, Game.stT * 1.5);
  const cy = H * 0.24;
  txt(Level.stage.name + ' クリア！', W / 2, cy - (1 - k) * 30, clamp(W / 16, 24, 54) * (0.6 + 0.4 * k), '#ffd166', 'center');
  if (Game.stT > 0.8) {
    const pw = Math.min(W - 40, 360), ph = small ? 96 : 120;
    panel(W / 2 - pw / 2, cy + 36, pw, ph, 16, 'rgba(255,255,255,.9)', '#ffd166');
    txt('タイム ' + fmtTime(Game.playTime), W / 2, cy + 36 + ph * 0.28, fs + 4, '#2c3e70', 'center', null);
    if (Game.newRecord) txt('ベスト更新！', W / 2, cy + 36 + ph * 0.52, fs, '#ff5577', 'center', null);
    else if (!Game.fullRun) txtFit('1回で ぜんぶ集めると タイムが のこるよ', W / 2, cy + 36 + ph * 0.52, fs * 0.8, pw - 20, '#6a7aa0', 'center', null);
    else { const b = Save.st(Game.stageId).best; if (b) txt('ベスト ' + fmtTime(b), W / 2, cy + 36 + ph * 0.52, fs * 0.9, '#6a7aa0', 'center', null); }
    txt('どんぐり ' + Game.acorns + ' / ' + Level.acornTotal, W / 2, cy + 36 + ph * 0.78, fs, '#7a5230', 'center', null);
    if (Game.stT > 3) drawMenu(MENUS.clear, W / 2, cy + 36 + ph + 16, W, H);
  }
}

function drawTouchUI() {
  hud.save();
  for (const k in Input.btns) {
    const b = Input.btns[k];
    const r = b.r * (b.down ? 0.92 : 1);
    hud.beginPath();
    hud.arc(b.x, b.y, r, 0, TAU);
    if (b.small) hud.fillStyle = b.down ? 'rgba(255,255,255,.6)' : 'rgba(30,50,100,.35)';
    else hud.fillStyle = b.down ? 'rgba(255,255,255,.65)' : 'rgba(255,255,255,.2)';
    hud.fill();
    hud.lineWidth = b.small ? 2 : 3;
    hud.strokeStyle = b.col || 'rgba(255,255,255,.8)';
    hud.stroke();
    if (b.small) txt(b.label, b.x, b.y + 1, k === 'pause' ? 16 : 10, '#fff', 'center');
    else txtFit(b.label, b.x, b.y + 1, Math.max(12, b.r * 0.34), b.r * 1.8, '#fff', 'center');
  }
  const R0 = Input.stickR;
  if (Input.stick) {
    const s = Input.stick;
    hud.beginPath(); hud.arc(s.ox, s.oy, R0, 0, TAU);
    hud.fillStyle = 'rgba(255,255,255,.15)'; hud.fill();
    hud.strokeStyle = 'rgba(255,255,255,.55)'; hud.lineWidth = 2.5; hud.stroke();
    let dx = s.x - s.ox, dy = s.y - s.oy; const d = Math.hypot(dx, dy);
    if (d > R0) { dx *= R0 / d; dy *= R0 / d; }
    hud.beginPath(); hud.arc(s.ox + dx, s.oy + dy, R0 * 0.45, 0, TAU);
    hud.fillStyle = 'rgba(255,255,255,.7)'; hud.fill();
  } else {
    // さわっていないときは、いつもの場所にうっすら表示
    const hx = Input.stickHome.x, hy = Input.stickHome.y;
    hud.beginPath(); hud.arc(hx, hy, R0, 0, TAU);
    hud.fillStyle = 'rgba(255,255,255,.08)'; hud.fill();
    hud.strokeStyle = 'rgba(255,255,255,.35)'; hud.lineWidth = 2; hud.stroke();
    hud.beginPath(); hud.arc(hx, hy, R0 * 0.45, 0, TAU);
    hud.fillStyle = 'rgba(255,255,255,.25)'; hud.fill();
    if (Game.playTime < 20) txt('いどう', hx, hy, 13, 'rgba(255,255,255,.9)', 'center');
  }
  hud.restore();
}

// ---------------- メインループ ----------------
let lastT = performance.now();
const debug = { manual: false };
function stepGame(dt) {
  pollInput();
  // 物理は細かく刻む（1/120 秒ずつ）
  const step = 1 / 120;
  let acc = dt, first = true;
  while (acc > 1e-6) {
    const h = Math.min(step, acc);
    update(h);
    if (first) { clearPressed(); first = false; }
    acc -= h;
  }
}
function frame(now) {
  let dt = (now - lastT) / 1000;
  lastT = now;
  if (dt > 0.1) dt = 0.1;
  Game.fps = lerp(Game.fps, 1 / Math.max(dt, 1e-3), 0.05);
  const t0 = performance.now();
  if (!debug.manual) stepGame(dt);
  Music.update();
  const t1 = performance.now();
  render();
  const t2 = performance.now();
  drawHud();
  Game.cpuMs = lerp(Game.cpuMs, (t1 - t0) + (performance.now() - t2), 0.05);
  requestAnimationFrame(frame);
}

function boot() {
  try {
    initGL();
    if (R.ok) { buildModels(); buildLevelState(0); }
  } catch (e) {
    R.ok = false;
    console.error(e);
  }
  Cam.eye[0] = 40; Cam.eye[1] = 20; Cam.eye[2] = 40;
  readSafeArea();
  // デバッグ用：KORON.step(秒) で入力を入れたまま時間を進められる（debug.manual=true のとき）
  window.KORON = { Game, P, PL, Cam, Level, World, Input, R, Sound, Music, debug, step: stepGame, camReset, menuRects, Save, STAGES, goSelect, goTitle, buildLevelState };
  requestAnimationFrame(frame);
}
boot();

})();</script>
